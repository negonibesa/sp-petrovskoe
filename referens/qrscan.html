<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Петровское СП — QR-сканер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* ─── Surface (3 levels) ────────────────────────────────────────── */
  --bg: #eaf4ff;
  --surface: #ffffff;
  --surface-2: #eef6ff;
  --surface-warm: #f5faff;

  /* ─── Foreground ramp (4 levels) ───────────────────────────────── */
  --fg: #12213b;
  --fg-2: #445269;
  --muted: #78859b;
  --meta: #99a4b7;

  /* ─── Border (2 levels) ────────────────────────────────────────── */
  --border: rgba(18,33,59,0.08);
  --border-soft: rgba(18,33,59,0.05);

  /* ─── Accent ────────────────────────────────────────────────────── */
  --accent: #1a86e0;
  --accent-on: #ffffff;
  --accent-hover: #2f97f0;
  --accent-active: #1473c9;

  /* ─── Semantic ──────────────────────────────────────────────────── */
  --success: #2bb066;
  --warn:    #ffc93c;
  --danger:  #ff4d4d;

  /* ─── Typography ────────────────────────────────────────────────── */
  --font-display: "Oswald", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Inter", "Helvetica Neue", Arial, sans-serif;

  /* ─── Radius ────────────────────────────────────────────────────── */
  --radius-sm:   10px;
  --radius-md:   14px;
  --radius-lg:   20px;
  --radius-pill: 980px;

  /* ─── Elevation ─────────────────────────────────────────────────── */
  --elev-flat:   none;
  --elev-ring:   0 0 0 1px var(--border);
  --elev-raised: 0 16px 36px rgba(18,33,59,0.10);

  /* ─── Focus ring ────────────────────────────────────────────────── */
  --focus-ring: 0 0 0 4px rgba(26,134,224,0.30);

  /* ─── Motion ────────────────────────────────────────────────────── */
  --motion-fast:   150ms;
  --motion-base:   220ms;
  --ease-standard: cubic-bezier(0.28, 0, 0.22, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: #000;
  color: var(--fg);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button {
  font-family: inherit;
  outline: none;
  -webkit-tap-highlight-color: transparent;
}

.app {
  position: relative;
  max-width: 700px;
  min-height: 100vh;
  margin: 0 auto;
  overflow: hidden;
  background: #000;
}

/* ── Фон видоискателя (имитация камеры) ───────────────────────────── */
.scan-stage {
  position: fixed;
  inset: 0;
  margin: 0 auto;
  max-width: 700px;
  background:
    radial-gradient(120% 90% at 50% 20%, rgba(47, 151, 240, 0.22), transparent 55%),
    radial-gradient(140% 110% at 85% 90%, rgba(255, 77, 77, 0.14), transparent 60%),
    linear-gradient(180deg, #101014 0%, #1c1c22 55%, #0b0b0e 100%);
}
.scan-grid {
  position: absolute;
  inset: 0;
  opacity: 0.5;
  background-image:
    linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: radial-gradient(90% 70% at 50% 40%, #000 30%, transparent 80%);
}

/* ── Верхняя панель ───────────────────────────────────────────────── */
.scan-top {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: calc(14px + env(safe-area-inset-top)) 16px 0;
}
.scan-back {
  position: relative;
  flex: none;
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border: none;
  border-radius: 50%;
  background: rgba(28, 28, 34, 0.72);
  color: #fff;
  cursor: pointer;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: background var(--motion-fast) var(--ease-standard);
}
.scan-back:hover { background: rgba(44, 44, 52, 0.85); }
.scan-back:focus-visible { box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.4); }
.scan-back svg { width: 20px; height: 20px; }
.scan-title {
  flex: 1;
  text-align: center;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 0.01em;
  color: #fff;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
}
.scan-title.is-scan { display: none; }

/* ── Сегмент-контрол «Сканер / Мой QR-код» ─────────────────────────── */
.seg {
  flex: 1;
  display: flex;
  padding: 3px;
  border-radius: var(--radius-pill);
  background: rgba(28, 28, 34, 0.72);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.seg-btn {
  flex: 1;
  height: 30px;
  border: none;
  border-radius: var(--radius-pill);
  background: transparent;
  color: rgba(255, 255, 255, 0.8);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.01em;
  cursor: pointer;
  transition: background var(--motion-fast) var(--ease-standard),
              color var(--motion-fast) var(--ease-standard);
}
.seg-btn.is-active {
  background: #fff;
  color: #12213b;
}
.seg-btn:focus-visible { box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.4); }

/* ── Окно сканирования ─────────────────────────────────────────────── */
.scan-window {
  position: absolute;
  left: 50%;
  top: 50%;
  width: min(264px, 66vw);
  height: min(264px, 66vw);
  transform: translate(-50%, -52%);
}
.scan-corner {
  position: absolute;
  width: 30px;
  height: 30px;
  border: 3px solid #fff;
  border-radius: 4px;
}
.scan-corner.tl { top: 0; left: 0; border-right: none; border-bottom: none; border-top-left-radius: 14px; }
.scan-corner.tr { top: 0; right: 0; border-left: none; border-bottom: none; border-top-right-radius: 14px; }
.scan-corner.bl { bottom: 0; left: 0; border-right: none; border-top: none; border-bottom-left-radius: 14px; }
.scan-corner.br { bottom: 0; right: 0; border-left: none; border-top: none; border-bottom-right-radius: 14px; }
.scan-line {
  position: absolute;
  left: 10px;
  right: 10px;
  top: 12px;
  height: 2px;
  border-radius: 1px;
  background: linear-gradient(90deg, transparent, #2f97f0, transparent);
  box-shadow: 0 0 12px rgba(47, 151, 240, 0.8);
  animation: scan-sweep 2.4s var(--ease-standard) infinite;
}
@keyframes scan-sweep {
  0%   { top: 12px; opacity: 0; }
  8%   { opacity: 1; }
  50%  { top: calc(100% - 12px); }
  92%  { opacity: 1; }
  100% { top: calc(100% - 12px); opacity: 0; }
}
.scan-hint {
  position: absolute;
  left: 0;
  right: 0;
  top: calc(100% + 18px);
  text-align: center;
  font-size: 14px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.88);
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
}

/* ── Выбор типа QR-кода ────────────────────────────────────────────── */
.scan-pick {
  position: absolute;
  left: 0;
  right: 0;
  bottom: calc(150px + env(safe-area-inset-bottom));
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 0 16px;
}
.scan-chip {
  flex: 0 0 auto;
  height: 32px;
  padding: 0 13px;
  border: none;
  border-radius: var(--radius-pill);
  background: rgba(28, 28, 34, 0.72);
  color: rgba(255, 255, 255, 0.85);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.01em;
  cursor: pointer;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: background var(--motion-fast) var(--ease-standard),
              color var(--motion-fast) var(--ease-standard);
}
.scan-chip:hover { background: rgba(44, 44, 52, 0.85); color: #fff; }
.scan-chip.is-on { background: #fff; color: #12213b; }
.scan-chip:focus-visible { box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.4); }

/* ── Панель «Мой QR-код» ───────────────────────────────────────────── */
.mine {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: calc(84px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom));
  overflow-y: auto;
  background:
    radial-gradient(120% 90% at 50% 0%, rgba(47, 151, 240, 0.16), transparent 55%),
    radial-gradient(140% 110% at 85% 95%, rgba(255, 77, 77, 0.10), transparent 60%),
    linear-gradient(180deg, #16161a 0%, #0b0b0e 100%);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--motion-base) var(--ease-standard);
}
.mine.is-on { opacity: 1; pointer-events: auto; }
.mine-card {
  width: 100%;
  max-width: 320px;
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-lg);
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
  padding: 24px 20px 20px;
  text-align: center;
  animation: pane-in 0.32s var(--ease-standard) both;
}
.mine-ava {
  display: grid;
  place-items: center;
  width: 64px;
  height: 64px;
  margin: 0 auto;
  border-radius: 50%;
  background: color-mix(in srgb, var(--accent) 14%, var(--bg));
  color: var(--accent);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.mine-name {
  display: block;
  margin-top: 12px;
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: var(--tracking-display);
  color: var(--fg);
}
.mine-role { display: block; margin-top: 3px; font-size: 13px; color: var(--muted); }
.mine-qr {
  width: 188px;
  height: 188px;
  margin: 18px auto 0;
  padding: 10px;
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-md);
  background: var(--surface-warm);
}
.mine-qr svg { width: 100%; height: 100%; display: block; }
.mine-id {
  display: inline-block;
  margin-top: 12px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.05em;
  color: var(--meta);
  background: var(--surface);
  border-radius: var(--radius-pill);
  padding: 4px 12px;
}
.mine-hint { margin: 12px 0 0; font-size: 13px; line-height: 1.45; color: var(--muted); }
.mine-btns { display: flex; gap: 10px; margin-top: 18px; }
.mine-btns .sheet-btn { margin-top: 0; }
.mine-btns .sheet-btn.ghost { margin-top: 0; }
@keyframes pane-in {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: none; }
}

/* ── Нижняя панель ─────────────────────────────────────────────────── */
.scan-bottom {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 0 40px calc(34px + env(safe-area-inset-bottom));
}
.scan-side {
  display: grid;
  place-items: center;
  width: 46px;
  height: 46px;
  border: none;
  border-radius: 50%;
  background: rgba(28, 28, 34, 0.72);
  color: #fff;
  cursor: pointer;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: background var(--motion-fast) var(--ease-standard);
}
.scan-side:hover { background: rgba(44, 44, 52, 0.85); }
.scan-side:focus-visible { box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.4); }
.scan-side svg { width: 20px; height: 20px; }
.scan-capture {
  position: relative;
  width: 74px;
  height: 74px;
  border: none;
  border-radius: 50%;
  background: #fff;
  cursor: pointer;
  transition: transform var(--motion-fast) var(--ease-standard);
}
.scan-capture::after {
  content: "";
  position: absolute;
  inset: 6px;
  border: 3px solid #000;
  border-radius: 50%;
}
.scan-capture:hover { transform: scale(1.04); }
.scan-capture:active { transform: scale(0.96); }
.scan-capture:focus-visible { box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.4); }

/* ── Вспышка успешного распознавания ──────────────────────────────── */
.scan-stage.detected .scan-window {
  animation: detect-flash 0.45s var(--ease-standard);
}
@keyframes detect-flash {
  0%   { filter: brightness(1); }
  35%  { filter: brightness(2.2); }
  100% { filter: brightness(1); }
}

/* ── Режим «Мой QR-код»: приглушаем видоискатель ──────────────────── */
.scan-stage.mode-mine .scan-window,
.scan-stage.mode-mine .scan-hint,
.scan-stage.mode-mine .scan-bottom,
.scan-stage.mode-mine .scan-line,
.scan-stage.mode-mine .scan-pick { opacity: 0; pointer-events: none; }
.scan-stage.mode-mine .scan-window,
.scan-stage.mode-mine .scan-hint,
.scan-stage.mode-mine .scan-bottom,
.scan-stage.mode-mine .scan-line,
.scan-stage.mode-mine .scan-pick { transition: opacity var(--motion-base) var(--ease-standard); }

/* ── Тост ──────────────────────────────────────────────────────────── */
.toast-wrap {
  position: absolute;
  left: 50%;
  bottom: 130px;
  transform: translateX(-50%);
  z-index: 80;
  width: max-content;
  max-width: calc(100vw - 40px);
}
.toast {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(29, 29, 31, 0.92);
  color: #fff;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.35;
  border-radius: var(--radius-pill);
  padding: 10px 18px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  animation: toast-in 0.3s var(--ease-standard) both;
}
.toast.hide { animation: toast-out 0.25s var(--ease-standard) both; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes toast-out { to { opacity: 0; transform: translateY(8px); } }

/* ── Шторка результата ─────────────────────────────────────────────── */
.scrim {
  position: fixed;
  inset: 0;
  z-index: 60;
  margin: 0 auto;
  max-width: 700px;
  background: rgba(0, 0, 0, 0.45);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--motion-base) var(--ease-standard);
}
.scrim.is-show { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 70;
  margin: 0 auto;
  max-width: 700px;
  max-height: 76vh;
  overflow-y: auto;
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-bottom: none;
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.14);
  padding: 8px 16px calc(20px + env(safe-area-inset-bottom));
  transform: translateY(105%);
  transition: transform var(--motion-base) var(--ease-standard);
}
.sheet.is-open { transform: translateY(0); }
.sheet-grab {
  width: 40px;
  height: 4px;
  border-radius: 2px;
  background: var(--border);
  margin: 4px auto 6px;
}
.sheet-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 2px 2px 12px;
}
.sheet-title {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--meta);
}
.sheet-close {
  position: relative;
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border: none;
  border-radius: 50%;
  background: var(--surface);
  color: var(--fg-2);
  cursor: pointer;
  transition: background var(--motion-fast) var(--ease-standard);
}
.sheet-close:hover { background: var(--border-soft); }
.sheet-close:focus-visible { box-shadow: var(--focus-ring); }
.sheet-close svg { width: 15px; height: 15px; }

.res-row {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--surface-warm);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-lg);
  padding: 12px 14px;
}
.res-ic {
  flex: none;
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  border-radius: 12px;
  background: color-mix(in srgb, var(--accent) 14%, var(--bg));
  color: var(--accent);
}
.res-ic svg { width: 22px; height: 22px; }
.res-body { flex: 1; min-width: 0; }
.res-name { display: block; font-size: 16px; font-weight: 600; color: var(--fg); letter-spacing: -0.01em; }
.res-meta { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; line-height: 1.4; }

.res-block { margin-top: 14px; }
.res-label {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--meta);
  padding: 0 2px 6px;
}
.res-list { display: flex; flex-direction: column; }
.res-item {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 46px;
  padding: 0 2px;
}
.res-item + .res-item { border-top: 1px solid var(--border-soft); }
.res-item-dot {
  flex: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--c, var(--accent));
}
.res-item-txt { flex: 1; font-size: 15px; font-weight: 500; color: var(--fg); }
.res-item-sub { flex: none; font-size: 13px; color: var(--muted); }

.res-video {
  position: relative;
  aspect-ratio: 16 / 9;
  border-radius: var(--radius-md);
  overflow: hidden;
  background:
    radial-gradient(90% 120% at 30% 0%, rgba(47, 151, 240, 0.28), transparent 60%),
    radial-gradient(110% 140% at 80% 100%, rgba(255, 77, 77, 0.20), transparent 60%),
    linear-gradient(160deg, #23232b 0%, #101014 100%);
  cursor: pointer;
}
.res-video img,
.res-video-thumb {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.res-video-play {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  display: grid;
  place-items: center;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.94);
  color: #12213b;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  transition: transform var(--motion-fast) var(--ease-standard);
}
.res-video-play svg { width: 22px; height: 22px; margin-left: 2px; }
.res-video:hover .res-video-play { transform: translate(-50%, -50%) scale(1.06); }
.res-video-tag {
  position: absolute;
  right: 8px;
  bottom: 8px;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  background: rgba(0, 0, 0, 0.55);
  border-radius: 6px;
  padding: 3px 8px;
}
.res-video-tag svg { width: 12px; height: 12px; vertical-align: -1px; margin-right: 4px; }
.res-video.is-play .res-video-play { opacity: 0; }
.res-video.is-play .res-video-progress {
  display: block;
  animation: video-run 7s var(--ease-standard) forwards;
}
.res-video-progress {
  display: none;
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 3px;
  background: var(--accent);
}
@keyframes video-run { from { width: 0; } to { width: 100%; } }
.res-item-num {
  flex: none;
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: color-mix(in srgb, var(--accent) 14%, var(--bg));
  color: var(--accent);
  font-size: 12px;
  font-weight: 700;
}

.sheet-btn {
  display: block;
  width: 100%;
  margin-top: 16px;
  height: 48px;
  border: none;
  border-radius: var(--radius-md);
  background: var(--accent);
  color: var(--accent-on);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: background var(--motion-fast) var(--ease-standard);
}
.sheet-btn:hover { background: var(--accent-hover); }
.sheet-btn:active { background: var(--accent-active); }
.sheet-btn:focus-visible { box-shadow: var(--focus-ring); }
.sheet-btn.ghost {
  margin-top: 8px;
  background: var(--surface);
  color: var(--accent);
}
.sheet-btn.ghost:hover { background: var(--border-soft); }
.sheet-btn.ghost:active { background: var(--surface); }
</style>
</head>
<body data-od-id="qr-scanner">

<svg style="display:none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="ic-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="ic-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="ic-flash" viewBox="0 0 24 24"><path d="M13 2.5L5.5 13.5h5l-1.5 8L17 10.5h-5l1-8z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="ic-images" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="9" r="1.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4.5 17l5-5 3 3 3-3 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="ic-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.5 12.2l2.4 2.4 4.6-4.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="ic-rental" viewBox="0 0 24 24"><path d="M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2.2a2.2 2.2 0 0 0 0 5.6V17a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2.2a2.2 2.2 0 0 0 0-5.6V7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 5.5v13" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="ic-machine" viewBox="0 0 24 24"><path d="M6.5 6.5c-.4 1-.4 10 0 11M17.5 6.5c.4 1 .4 10 0 11M4 7v10M20 7v10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="3" y="14.5" width="18" height="4.5" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="ic-play" viewBox="0 0 24 24"><path d="M7 5.2v13.6c0 .7.8 1.1 1.4.7l10.2-6.8c.5-.4.5-1.1 0-1.5L8.4 4.5c-.6-.4-1.4 0-1.4.7z" fill="currentColor"/></symbol>
  <symbol id="ic-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 20c0-3.2 3.1-5.4 7-5.4s7 2.2 7 5.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="ic-events" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="15.5" r="1.4" fill="currentColor"/></symbol>
  <symbol id="ic-flag" viewBox="0 0 24 24"><path d="M5 21V4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 4c3.5-2.2 6.5 2.2 10 0 1.6-1 3.4-.6 4 1.2v8.3c-.6-1.8-2.4-2.2-4-1.2-3.5 2.2-6.5-2.2-10 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<div class="app">
  <div class="scan-top">
    <a class="scan-back" href="index.html" aria-label="Назад"><svg><use href="#ic-back"/></svg></a>
    <div class="seg" role="tablist" aria-label="Раздел QR">
      <button type="button" class="seg-btn is-active" id="seg-scan" role="tab" aria-selected="true" data-od-id="seg-scan">Сканер</button>
      <button type="button" class="seg-btn" id="seg-mine" role="tab" tabindex="-1" aria-selected="false" data-od-id="seg-mine">Мой QR-код</button>
    </div>
  </div>
  <div class="scan-stage" id="stage" data-od-id="scan-stage">
    <div class="scan-grid" aria-hidden="true"></div>

    <div class="scan-window" data-od-id="scan-window">
      <i class="scan-corner tl" aria-hidden="true"></i>
      <i class="scan-corner tr" aria-hidden="true"></i>
      <i class="scan-corner bl" aria-hidden="true"></i>
      <i class="scan-corner br" aria-hidden="true"></i>
      <span class="scan-line" aria-hidden="true"></span>
    </div>
    <div class="scan-hint">Наведите камеру на QR-код</div>

    <div class="scan-pick" role="group" aria-label="Тип QR-кода">
      <button type="button" class="scan-chip" data-type="club" data-od-id="type-club">Клуб</button>
      <button type="button" class="scan-chip is-on" data-type="machine" data-od-id="type-machine">Тренажёр</button>
      <button type="button" class="scan-chip" data-type="friend" data-od-id="type-friend">Друг</button>
      <button type="button" class="scan-chip" data-type="event" data-od-id="type-event">Мероприятие</button>
    </div>

    <div class="scan-bottom">
      <button type="button" class="scan-side" id="gallery" aria-label="Галерея"><svg><use href="#ic-images"/></svg></button>
      <button type="button" class="scan-capture" id="capture" aria-label="Сфотографировать" data-od-id="scan-capture"></button>
      <button type="button" class="scan-side" id="flash-side" aria-label="Вспышка"><svg><use href="#ic-flash"/></svg></button>
    </div>
  </div>

  <div class="mine" id="mine" data-od-id="mine" hidden>
    <div class="mine-card">
      <span class="mine-ava" aria-hidden="true">ИП</span>
      <span class="mine-name">Иван Петров</span>
      <span class="mine-role">Спортсмен · Спорткомплекс «Петровское»</span>
      <div class="mine-qr" id="mine-qr"></div>
      <span class="mine-id" id="mine-id">ID: PS-1042</span>
      <p class="mine-hint">Покажите этот код на входе, чтобы отметиться на событии</p>
      <div class="mine-btns">
        <button type="button" class="sheet-btn" id="mine-share" data-od-id="mine-share">Поделиться</button>
        <button type="button" class="sheet-btn ghost" id="mine-save" data-od-id="mine-save">Скачать</button>
      </div>
    </div>
  </div>

  <div class="toast-wrap" id="toasts"></div>
</div>

<div class="scrim" id="scrim" data-od-id="scrim" hidden></div>
<div class="sheet" id="result-sheet" role="dialog" aria-modal="true" aria-label="Результат сканирования" data-od-id="result-sheet" hidden>
  <div class="sheet-grab" aria-hidden="true"></div>
  <div class="sheet-head">
    <span class="sheet-title" id="sheet-title">QR распознан</span>
    <button type="button" class="sheet-close" id="sheet-close" aria-label="Закрыть"><svg><use href="#ic-close"/></svg></button>
  </div>
  <div id="sheet-body"></div>
</div>

<script>
(function () {
  'use strict';

  var stage = document.getElementById('stage');
  var scrim = document.getElementById('scrim');
  var sheet = document.getElementById('result-sheet');
  var sheetOpen = false;
  var mine = document.getElementById('mine');
  var segScan = document.getElementById('seg-scan');
  var segMine = document.getElementById('seg-mine');
  var qrBuilt = false;

  function toast(msg) {
    var wrap = document.getElementById('toasts');
    while (wrap.children.length >= 2) wrap.removeChild(wrap.firstChild);
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    wrap.appendChild(t);
    setTimeout(function () {
      t.classList.add('hide');
      setTimeout(function () { t.remove(); }, 260);
    }, 2200);
  }

  function buildQR() {
    if (qrBuilt) return;
    qrBuilt = true;
    var cells = '';
    var seed = 42;
    function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed; }
    var n = 21;
    for (var y = 0; y < n; y++) {
      for (var x = 0; x < n; x++) {
        var finder = (x < 7 && y < 7) || (x >= n - 7 && y < 7) || (x < 7 && y >= n - 7);
        var on = finder ? ((x % 4 === 0 || y % 4 === 0)) : (rnd() % 3 !== 0);
        if (on) cells += '<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="#12213b"/>';
      }
    }
    document.getElementById('mine-qr').innerHTML =
      '<svg viewBox="0 0 21 21" shape-rendering="crispEdges" role="img" aria-label="Личный QR-код">' + cells + '</svg>';
  }

  function switchMode(mineOn) {
    var showMine = !!mineOn;
    segScan.classList.toggle('is-active', !showMine);
    segMine.classList.toggle('is-active', showMine);
    segScan.setAttribute('aria-selected', String(!showMine));
    segMine.setAttribute('aria-selected', String(showMine));
    segScan.setAttribute('tabindex', showMine ? '-1' : '0');
    segMine.setAttribute('tabindex', showMine ? '0' : '-1');
    stage.classList.toggle('mode-mine', showMine);
    if (showMine) {
      buildQR();
      mine.hidden = false;
      requestAnimationFrame(function () { mine.classList.add('is-on'); });
    } else {
      mine.classList.remove('is-on');
      setTimeout(function () { mine.hidden = true; }, 260);
    }
  }
  segScan.addEventListener('click', function () { switchMode(false); });
  segMine.addEventListener('click', function () { switchMode(true); });

  function openSheet() {
    sheetOpen = true;
    scrim.hidden = false;
    sheet.hidden = false;
    requestAnimationFrame(function () {
      scrim.classList.add('is-show');
      sheet.classList.add('is-open');
    });
  }
  function closeSheet() {
    sheetOpen = false;
    scrim.classList.remove('is-show');
    sheet.classList.remove('is-open');
    setTimeout(function () {
      if (!sheetOpen) {
        scrim.hidden = true;
        sheet.hidden = true;
      }
    }, 260);
  }

  var sheetBody = document.getElementById('sheet-body');
  var sheetTitle = document.getElementById('sheet-title');
  var currentType = 'machine';
  var detected = false;

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function itemHtml(dot, txt, sub) {
    return '<div class="res-item"><span class="res-item-dot" style="--c:' + dot + '" aria-hidden="true"></span>' +
      '<span class="res-item-txt">' + esc(txt) + '</span>' +
      (sub ? '<span class="res-item-sub">' + esc(sub) + '</span>' : '') + '</div>';
  }

  var SHEETS = {
    club: {
      title: 'QR-код клуба',
      toast: 'QR-код клуба распознан',
      body: function () {
        return '<div class="res-row"><span class="res-ic" aria-hidden="true"><svg><use href="#ic-flag"/></svg></span>' +
          '<span class="res-body"><span class="res-name">Спорткомплекс «Петровское»</span>' +
          '<span class="res-meta">Вход в клуб · сегодня · 09:00 – 23:00</span></span></div>' +
          '<div class="res-block"><div class="res-label">Вход</div><div class="res-list">' +
          itemHtml('#2bb066', 'Вход разрешён', 'Член клуба') +
          itemHtml('#1a86e0', 'Зал открыт', 'До 23:00') +
          '</div></div>';
      },
      okLabel: 'Пройти в клуб'
    },
    machine: {
      title: 'QR-код тренажёра',
      toast: 'QR-код тренажёра распознан',
      body: function () {
        return '<div class="res-row"><span class="res-ic" aria-hidden="true"><svg><use href="#ic-machine"/></svg></span>' +
          '<span class="res-body"><span class="res-name">Беговая дорожка</span>' +
          '<span class="res-meta">Life Fitness 95T · Зал № 1 · тренажёр 4</span></span></div>' +
          '<div class="res-block"><div class="res-label">Видеоинструкция</div>' +
          '<div class="res-video" id="res-video" data-od-id="res-video" tabindex="0" role="button" aria-label="Воспроизвести видеоинструкцию">' +
          '<span class="res-video-play" aria-hidden="true"><svg><use href="#ic-play"/></svg></span>' +
          '<span class="res-video-tag" aria-hidden="true"><svg><use href="#ic-play"/></svg>2:34</span>' +
          '<span class="res-video-progress" aria-hidden="true"></span></div></div>' +
          '<div class="res-block"><div class="res-label">Как пользоваться</div><div class="res-list">' +
          itemHtml('#1a86e0', 'Нажмите «Пуск» и выберите программу', '1') +
          itemHtml('#1a86e0', 'Задайте скорость и наклон стрелками', '2') +
          itemHtml('#1a86e0', 'Для остановки нажмите «Стоп»', '3') +
          '</div></div>';
      },
      okLabel: 'Смотреть видео'
    },
    friend: {
      title: 'QR-код друга',
      toast: 'QR-код друга распознан',
      body: function () {
        return '<div class="res-row"><span class="res-ic" aria-hidden="true"><svg><use href="#ic-user"/></svg></span>' +
          '<span class="res-body"><span class="res-name">Мария Соколова</span>' +
          '<span class="res-meta">Спортсмен · Спорткомплекс «Петровское»</span></span></div>' +
          '<div class="res-block"><div class="res-label">Профиль</div><div class="res-list">' +
          itemHtml('#2f9e54', 'Настольный теннис', 'клуб') +
          itemHtml('#ffc93c', 'В клубе с 2023', 'стаж') +
          '</div></div>';
      },
      okLabel: 'Добавить в друзья'
    },
    event: {
      title: 'QR-код мероприятия',
      toast: 'QR-код мероприятия распознан',
      body: function () {
        return '<div class="res-row"><span class="res-ic" aria-hidden="true"><svg><use href="#ic-events"/></svg></span>' +
          '<span class="res-body"><span class="res-name">Кубок поселения по футболу</span>' +
          '<span class="res-meta">Сб, 24 авг · стадион · 10:00</span></span></div>' +
          '<div class="res-block"><div class="res-label">О мероприятии</div><div class="res-list">' +
          itemHtml('#2bb066', 'Регистрация открыта', 'свободно 12 из 50') +
          itemHtml('#1a86e0', 'Формат: 5×5', '1 тур') +
          itemHtml('#ffc93c', 'Призовой фонд', 'кубок + медали') +
          '</div></div>';
      },
      okLabel: 'Зарегистрироваться'
    }
  };

  function renderSheet(type) {
    var s = SHEETS[type];
    if (!s) s = SHEETS.machine;
    sheetTitle.textContent = s.title;
    sheetBody.innerHTML =
      s.body() +
      '<button type="button" class="sheet-btn" id="res-ok" data-od-id="res-ok">' + s.okLabel + '</button>' +
      '<button type="button" class="sheet-btn ghost" id="res-again" data-od-id="res-again">Сканировать ещё раз</button>';

    var okBtn = document.getElementById('res-ok');
    document.getElementById('res-again').addEventListener('click', function () {
      closeSheet();
      setTimeout(function () {
        detected = false;
        stage.classList.remove('detected');
      }, 280);
    });

    if (type === 'machine') {
      var resVideo = document.getElementById('res-video');
      function startVideo() {
        if (resVideo.classList.contains('is-play')) return;
        resVideo.classList.add('is-play');
        toast('Воспроизводим видеоинструкцию');
        setTimeout(function () {
          resVideo.classList.remove('is-play');
          toast('Видеоинструкция завершена');
        }, 7200);
      }
      resVideo.addEventListener('click', startVideo);
      resVideo.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); startVideo(); }
      });
      okBtn.addEventListener('click', startVideo);
    } else if (type === 'club') {
      okBtn.addEventListener('click', function () {
        closeSheet();
        setTimeout(function () { toast('Вы вошли в клуб'); }, 280);
        detected = false;
        stage.classList.remove('detected');
      });
    } else if (type === 'friend') {
      okBtn.addEventListener('click', function () {
        okBtn.textContent = 'Заявка отправлена';
        okBtn.disabled = true;
        okBtn.style.opacity = 0.6;
        toast('Заявка в друзья отправлена');
      });
    } else if (type === 'event') {
      okBtn.addEventListener('click', function () {
        okBtn.textContent = 'Вы записаны';
        okBtn.disabled = true;
        okBtn.style.opacity = 0.6;
        toast('Вы записаны на мероприятие');
      });
    }
  }

  function detect() {
    if (detected) return;
    detected = true;
    stage.classList.add('detected');
    toast(SHEETS[currentType].toast);
    setTimeout(function () {
      renderSheet(currentType);
      openSheet();
    }, 380);
  }

  document.querySelectorAll('.scan-chip').forEach(function (chip) {
    chip.addEventListener('click', function () {
      currentType = chip.getAttribute('data-type');
      document.querySelectorAll('.scan-chip').forEach(function (c) {
        c.classList.toggle('is-on', c === chip);
      });
    });
  });

  document.getElementById('capture').addEventListener('click', detect);
  document.getElementById('sheet-close').addEventListener('click', function () {
    closeSheet();
    detected = false;
    stage.classList.remove('detected');
  });
  scrim.addEventListener('click', function () {
    closeSheet();
    detected = false;
    stage.classList.remove('detected');
  });
  document.getElementById('gallery').addEventListener('click', function () {
    toast('Выбор фото откроется в полной версии');
  });
  document.getElementById('mine-share').addEventListener('click', function () {
    toast('Ссылка на профиль скопирована');
  });
  document.getElementById('mine-save').addEventListener('click', function () {
    toast('QR-код сохранён в галерею');
  });
  document.querySelector('.seg').addEventListener('keydown', function (e) {
    var onMine = segMine.getAttribute('aria-selected') === 'true';
    var next = null;
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') next = !onMine;
    else if (e.key === 'Home') next = false;
    else if (e.key === 'End') next = true;
    if (next === null) return;
    e.preventDefault();
    switchMode(next);
    (next ? segMine : segScan).focus();
  });
  var flash = document.getElementById('flash-side');
  flash.addEventListener('click', function () {
    var on = flash.getAttribute('aria-pressed') === 'true';
    flash.setAttribute('aria-pressed', String(!on));
    flash.style.color = on ? '#fff' : '#ffc93c';
    if (!on) toast('Фонарик включён');
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !sheet.hidden) closeSheet();
  });
})();
</script>
</body>
</html>
