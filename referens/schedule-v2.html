<style>
/* ── Токены и компоненты — в base.css (канон design-system.html) ────── */
body { background: var(--surface-warm); }

/* Карточка календаря */
.cal-card {
  margin-top: var(--space-2);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--space-4) var(--space-3) var(--space-5);
  box-shadow: var(--elev-card);
}
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: 0 var(--space-1) var(--space-3); }
.cal-nav { display: flex; gap: var(--space-2); }
.cal-nav .icon-btn-sm {
  display: grid; place-items: center;
  width: 36px; height: 36px;
  border: 1px solid var(--border-soft); border-radius: 50%;
  background: var(--surface); color: var(--fg-2);
  transition: background var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard), transform var(--motion-fast) var(--ease-standard);
}
.cal-nav .icon-btn-sm:hover { background: var(--surface-2); color: var(--fg); border-color: var(--border-strong); }
.cal-nav .icon-btn-sm:active { transform: scale(0.94); }
.cal-nav .icon-btn-sm svg { width: 18px; height: 18px; }
.cal-nav .prev svg { transform: rotate(180deg); }

/* Заголовок месяца — как заголовок дня («Среда, 12 августа») */
.cal-card .cal-month { font-size: var(--fs-title-sm); letter-spacing: 0.01em; text-transform: none; }

/* Шапка-процесс: topbar канона DS */
.topbar { background: transparent; }
.topbar .topbar-ic { position: relative; }
.topbar-ic .notif { top: 2px; right: 2px; }

/* Фильтр по типу события — горизонтальный слайдер */
.chips {
  display: flex; flex-wrap: nowrap; gap: var(--space-2);
  margin: var(--space-3) calc(-1 * var(--space-3)) 0;
  padding: 0 var(--space-3) var(--space-1);
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  scroll-snap-type: x proximity;
}
.chips::-webkit-scrollbar { display: none; }
.chips > .fchip { flex: none; scroll-snap-align: start; }
.fchip .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--meta)); }
.fchip.is-on .dot { background: var(--accent-on); }

/* Кнопка «Добавить событие» — FAB над таббаром (канон DS: градиент blue→purple) */
.fab-add {
  position: fixed; z-index: 40;
  right: var(--space-4); bottom: calc(96px + env(safe-area-inset-bottom));
  display: grid; place-items: center;
  width: 56px; height: 56px;
  border: 0; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent-purple));
  color: var(--accent-on); text-decoration: none;
  box-shadow: 0 4px 20px var(--accent-glow);
  cursor: pointer;
  transition: transform var(--motion-fast) var(--ease-standard), box-shadow var(--motion-fast) var(--ease-standard), background var(--motion-fast) var(--ease-standard);
}
.fab-add svg { width: 26px; height: 26px; }
.fab-add:hover { transform: translateY(-2px); box-shadow: 0 8px 32px var(--accent-glow); }
.fab-add:active { transform: scale(0.94); }
.fab-add:focus-visible { outline: none; box-shadow: var(--focus-ring); }

/* День и карточки событий */
.day { margin-top: var(--space-8); }
.day-head { display: flex; align-items: center; gap: var(--space-3); padding: 0 var(--space-1) var(--space-4); }
.day-head h2 { flex: 1; min-width: 0; margin: 0; font-family: var(--font-display); font-size: var(--fs-title-sm); font-weight: 600; letter-spacing: 0.01em; color: var(--fg); }
.sec-count { flex: none; font-family: var(--font-mono); font-size: var(--fs-caption); font-weight: 600; color: var(--meta); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-pill); padding: var(--space-1) var(--space-3); }
.cards { display: grid; gap: var(--space-3); }
.ev-card { animation: card-in 0.28s var(--ease-standard) both; animation-delay: calc(var(--i, 0) * 40ms); }
@keyframes card-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.day-empty {
  padding: var(--space-8) var(--space-6);
  text-align: center; font-size: var(--fs-meta); line-height: 1.5; color: var(--meta);
  background: var(--surface); border: 1px dashed var(--border-strong); border-radius: var(--radius-lg);
}
.day-empty svg { width: var(--icon-lg); height: var(--icon-lg); color: var(--border-strong); margin-bottom: var(--space-2); }

@media (prefers-reduced-motion: reduce) {
  .ev-card { animation: none; }
}
</style>

<script>
(function () {
  var TYPE = {
    training: 'var(--type-training)',
    event: 'var(--type-event)',
    club: 'var(--type-club)',
    rental: 'var(--type-rental)'
  };
  var STATUS = {
    confirmed: ['Подтв.', 'var(--st-confirmed)'],
    open: ['Запись', 'var(--st-open)'],
    pending: ['Ожид.', 'var(--st-pending)'],
    done: ['Готово', 'var(--st-done)']
  };
  var FILTERS = [
    { id: 'all', label: 'Все', token: null },
    { id: 'training', label: 'Тренировки', token: '--type-training' },
    { id: 'event', label: 'События СП', token: '--type-event' },
    { id: 'club', label: 'Клубы', token: '--type-club' },
    { id: 'rental', label: 'Аренда', token: '--type-rental' }
  ];
  var state = { filter: 'all' };
  var EVENTS = [
    { d: '2026-08-12', t: '05:40', title: 'Утренняя пробежка', place: 'парк у спорткомплекса', type: 'training', st: 'confirmed' },
    { d: '2026-08-12', t: '19:00', title: 'Аренда зала', place: 'Спорткомплекс «СП Петровское»', type: 'rental', st: 'open' },
    { d: '2026-08-13', t: '09:00', title: 'Тренировка с тренером', place: 'тренажёрный зал', type: 'training', st: 'confirmed' },
    { d: '2026-08-14', t: '10:00', title: 'Турнир по шахматам', place: 'холл спорткомплекса', type: 'event', st: 'open' },
    { d: '2026-08-15', t: '09:00', title: 'Клуб любителей бега', place: 'стадион «Труд»', type: 'club', st: 'open' },
    { d: '2026-08-16', t: '12:00', title: 'Аренда бассейна', place: 'бассейн спорткомплекса', type: 'rental', st: 'confirmed' },
    { d: '2026-08-18', t: '18:30', title: 'Силовая тренировка', place: 'тренажёрный зал', type: 'training', st: 'pending' },
    { d: '2026-08-21', t: '11:00', title: 'Летний Кубок · финал', place: 'стадион «Труд»', type: 'event', st: 'open' },
    { d: '2026-08-23', t: '10:00', title: 'Волейбольный турнир', place: 'волейбольная площадка', type: 'event', st: 'open' },
    { d: '2026-08-26', t: '18:00', title: 'Клуб настольного тенниса', place: 'клуб тенниса', type: 'club', st: 'confirmed' },
    { d: '2026-08-28', t: '16:00', title: 'Аренда корта', place: 'теннисный корт', type: 'rental', st: 'pending' },
    { d: '2026-08-30', t: '08:00', title: 'Осенний полумарафон', place: 'центр поселения', type: 'event', st: 'open' }
  ];
  var WD = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
  var WD_FULL = ['понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота', 'воскресенье'];
  var MONTH_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  var MONTH_NOM = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];

  var grid = document.getElementById('grid');
  var week = document.getElementById('week');
  var monthEl = document.getElementById('cal-month');
  var dayTitle = document.getElementById('day-title');
  var dayCount = document.getElementById('day-count');
  var dayList = document.getElementById('day-list');

  var today = new Date(2026, 7, 12);
  var view = new Date(today.getFullYear(), today.getMonth(), 1);
  var selected = today.getDate();

  function iso(d, m, y) {
    return y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  }
  function eventsFor(d) {
    var key = iso(d.getDate(), d.getMonth(), d.getFullYear());
    return EVENTS.filter(function (e) { return e.d === key && (state.filter === 'all' || e.type === state.filter); });
  }
  function mondayIndex(date) { return (date.getDay() + 6) % 7; }

  function renderChips() {
    var box = document.getElementById('type-chips');
    box.innerHTML = '';
    FILTERS.forEach(function (f) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'fchip' + (state.filter === f.id ? ' is-on' : '');
      if (f.token) b.style.setProperty('--c', 'var(' + f.token + ')');
      b.innerHTML = (f.token ? '<span class="dot" aria-hidden="true"></span>' : '') + f.label;
      b.addEventListener('click', function () {
        state.filter = f.id;
        renderChips();
        renderGrid();
        renderDay(new Date(view.getFullYear(), view.getMonth(), selected));
      });
      box.appendChild(b);
    });
  }

  function renderWeek() {
    week.innerHTML = '';
    WD.forEach(function (w) {
      var el = document.createElement('span');
      el.className = 'cal-wd';
      el.textContent = w;
      week.appendChild(el);
    });
  }

  function renderGrid() {
    var y = view.getFullYear(), m = view.getMonth();
    var first = new Date(y, m, 1);
    var dim = new Date(y, m + 1, 0).getDate();
    var prevDim = new Date(y, m, 0).getDate();
    var lead = mondayIndex(first);
    monthEl.textContent = MONTH_NOM[m] + ' ' + y;
    grid.innerHTML = '';
    var cells = [];

    for (var i = lead - 1; i >= 0; i--) {
      cells.push({ d: prevDim - i, m: m - 1, y: y, other: true });
    }
    for (var d = 1; d <= dim; d++) {
      cells.push({ d: d, m: m, y: y, other: false });
    }
    var tail = cells.length % 7;
    if (tail !== 0) {
      for (var k = 1; k <= 7 - tail; k++) {
        cells.push({ d: k, m: m + 1, y: y, other: true });
      }
    }

    cells.forEach(function (c, idx) {
      var cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'cal-cell';
      if (c.other) cell.classList.add('is-other');
      var isToday = c.d === today.getDate() && c.m === today.getMonth() && c.y === today.getFullYear() && !c.other;
      if (isToday) cell.classList.add('is-today');
      if (c.d === selected && c.m === view.getMonth() && c.y === view.getFullYear() && !c.other) cell.classList.add('is-sel');
      cell.setAttribute('aria-label', String(c.d));
      cell.style.setProperty('--i', idx);

      var num = document.createElement('span');
      num.className = 'cal-num';
      num.textContent = c.d;
      cell.appendChild(num);

      var events = eventsFor(new Date(c.y, c.m, c.d));
      if (events.length) {
        var dots = document.createElement('span');
        dots.className = 'cal-dots';
        var shown = Math.min(events.length, 4);
        for (var j = 0; j < shown; j++) {
          var dot = document.createElement('span');
          dot.className = 'cal-dot';
          dot.style.setProperty('--c', TYPE[events[j].type] || 'var(--meta)');
          dots.appendChild(dot);
        }
        cell.appendChild(dots);
      }
      cell.addEventListener('click', function () {
        selected = c.d;
        renderGrid();
        renderDay(new Date(c.y, c.m, c.d));
      });
      grid.appendChild(cell);
    });
  }

  function evLabel(date) {
    var t = today;
    if (date.getDate() === t.getDate() && date.getMonth() === t.getMonth() && date.getFullYear() === t.getFullYear()) return 'Сегодня';
    var tm = new Date(t.getFullYear(), t.getMonth(), t.getDate() + 1);
    if (date.getDate() === tm.getDate() && date.getMonth() === tm.getMonth() && date.getFullYear() === tm.getFullYear()) return 'Завтра';
    return WD[mondayIndex(date)];
  }

  function renderDay(date) {
    var events = eventsFor(date);
    dayTitle.textContent = WD_FULL[mondayIndex(date)][0].toUpperCase() + WD_FULL[mondayIndex(date)].slice(1) + ', ' + date.getDate() + ' ' + MONTH_GEN[date.getMonth()];
    dayCount.textContent = events.length;
    dayList.innerHTML = '';
    if (!events.length) {
      var empty = document.createElement('div');
      empty.className = 'day-empty';
      empty.innerHTML = '<svg aria-hidden="true"><use href="#ic-cal-empty"></use></svg><div>В этот день пока ничего нет</div>';
      dayList.appendChild(empty);
      return;
    }
    events.forEach(function (e, i) {
      var card = document.createElement('article');
      card.className = 'ev-card';
      card.style.setProperty('--c', TYPE[e.type]);
      card.style.setProperty('--i', i);
      var st = STATUS[e.st] || STATUS.done;
      card.innerHTML =
        '<div class="ev-when"><span class="ev-day"></span><span class="ev-time">' + e.t + '</span></div>' +
        '<div class="ev-body"><h3 class="ev-title"></h3><div class="ev-place"></div></div>' +
        '<div class="ev-side"><span class="ev-status" style="--c:' + st[1] + '"></span></div>';
      card.querySelector('.ev-day').textContent = evLabel(date);
      card.querySelector('.ev-title').textContent = e.title;
      card.querySelector('.ev-place').textContent = e.place;
      card.querySelector('.ev-status').textContent = st[0];
      dayList.appendChild(card);
    });
  }

  document.getElementById('prev').addEventListener('click', function () {
    view = new Date(view.getFullYear(), view.getMonth() - 1, 1);
    renderGrid();
  });
  document.getElementById('next').addEventListener('click', function () {
    view = new Date(view.getFullYear(), view.getMonth() + 1, 1);
    renderGrid();
  });

  renderWeek();
  renderChips();
  renderGrid();
  renderDay(new Date(view.getFullYear(), view.getMonth(), selected));
})();
</script>

</body></html>
