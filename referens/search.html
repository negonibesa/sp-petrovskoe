<style>
  .hd.search-hd { padding-top: var(--space-4); padding-bottom: var(--space-3); }
  @media (min-width: 560px) { .hd.search-hd { padding-top: var(--space-6); padding-bottom: var(--space-4); } }
  .back svg { transform: rotate(180deg); }

  .search-field input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; }
  .search-clear {
    flex: none; width: 40px; height: 40px; padding: 0;
    border: 0; background: none; color: var(--meta);
    display: grid; place-items: center; cursor: pointer;
  }
  .search-clear svg { width: var(--icon-sm); height: var(--icon-sm); }
  .search-clear:hover { color: var(--fg-2); }
  .search-clear:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: 50%; }

  .chips {
    display: flex; gap: var(--space-2); overflow-x: auto;
    padding: 0 var(--space-3) var(--space-3);
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .chips::-webkit-scrollbar { display: none; }
  @media (min-width: 560px) { .chips { padding: 0 var(--space-6) var(--space-4); } }
  .chips.has-on .fchip { display: none; }
  .chips.has-on .fchip.is-on { display: inline-flex; }
  .fchip .cnt {
    display: grid; place-items: center; min-width: 18px; height: 18px;
    padding: 0 var(--space-1); border-radius: var(--radius-pill);
    background: var(--surface-2); color: var(--muted);
    font-size: var(--fs-caption); font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .fchip.is-on .cnt { background: rgba(255,255,255,0.22); color: var(--accent-on); }

  .qchips { padding: 0; }
  .cat-grid { padding: 0; }
  .results-count { margin: var(--space-1) 0 var(--space-3); }

  .group-label {
    display: flex; align-items: center; gap: var(--space-2);
    margin: var(--space-5) 0 var(--space-2);
  }
  .group-label:first-child { margin-top: var(--space-3); }
  .group-label span {
    font-family: var(--font-display); font-size: var(--fs-meta); font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
    white-space: nowrap;
  }
  .group-label::after { content: ""; flex: 1; height: 1px; background: var(--border-soft); }

  .res-row {
    width: 100%; text-align: left; cursor: pointer; text-decoration: none;
    font: inherit; color: var(--fg);
    -webkit-appearance: none; appearance: none;
    transition: background var(--motion-fast) var(--ease-standard), transform var(--motion-fast) var(--ease-standard);
  }
  .res-row:hover { background: var(--surface-warm); }
  .res-row:active { transform: scale(0.995); }
  .res-row:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .res-row + .res-row { margin-top: var(--space-2); }
  .res-title { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
  .res-badge {
    flex: none; display: inline-block; font-size: var(--fs-caption); font-weight: 700;
    letter-spacing: 0.01em; white-space: nowrap;
    color: color-mix(in oklab, var(--c), var(--fg) 40%);
    background: color-mix(in srgb, var(--c) 14%, var(--surface));
    border-radius: var(--radius-pill); padding: 2px var(--space-2);
  }
  .res-side { flex: none; display: grid; gap: var(--space-1); justify-items: end; }
  .res-price {
    font-size: var(--fs-meta); font-weight: 800; color: var(--fg-2);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .res-chev { flex: none; width: var(--icon-sm); height: var(--icon-sm); color: var(--meta); }
  .res-stars {
    display: inline-block; color: var(--yellow);
    font-size: var(--fs-caption); letter-spacing: 1px; line-height: 1;
  }
  .res-ic .av { width: 36px; height: 36px; }
</style>

<script>
(function () {
  'use strict';

  var SORT = ['event', 'training', 'trainer', 'club', 'rental', 'person'];

  var TYPE_TOKEN = {
    training: 'var(--type-training)',
    trainer: 'var(--yellow)',
    event: 'var(--type-event)',
    club: 'var(--type-club)',
    rental: 'var(--type-rental)'
  };

  var HEADERS = {
    event: 'События',
    training: 'Тренировки',
    trainer: 'Тренеры',
    club: 'Клубы',
    rental: 'Аренда',
    person: 'Люди'
  };

  var FILTERS = [
    { key: 'all', label: 'Все' },
    { key: 'training', label: 'Тренировки' },
    { key: 'trainer', label: 'Тренеры' },
    { key: 'event', label: 'События' },
    { key: 'club', label: 'Клубы' },
    { key: 'rental', label: 'Аренда' }
  ];

  var DATA = {
    popular: [
      { type: 'event', id: 'e1', title: 'Забег «Петровские холмы»', badge: 'Открыта запись', badgeC: 'var(--st-open)', meta: '12 апреля · 09:00 · Центральный парк', price: 'Бесплатно', icon: 'ic-events', to: 'schedule-calendar.html' },
      { type: 'training', id: 't1', title: 'ОФП · утренний поток', badge: 'Сегодня', badgeC: 'var(--st-confirmed)', meta: '07:30–08:30 · Стадион «Юность»', price: '1 200 ₽', icon: 'ic-dumbbell', to: 'trainings.html' },
      { type: 'club', id: 'c1', title: 'Клуб «Пульс»', badge: 'Фитнес', badgeC: 'var(--type-club)', meta: '17 направлений · 340 участников', price: 'от 1 900 ₽', icon: 'ic-users', to: 'events-system.html' }
    ],
    cats: [
      { id: 'События', icon: 'ic-events', c: 'var(--type-event)', hint: 'По ближайшим датам', to: 'schedule-calendar.html' },
      { id: 'Тренировки', icon: 'ic-dumbbell', c: 'var(--type-training)', hint: 'План и запись', to: 'trainings.html' },
      { id: 'Клубы', icon: 'ic-users', c: 'var(--type-club)', hint: 'Сообщества и секции', to: 'events-system.html' },
      { id: 'Аренда', icon: 'ic-clock', c: 'var(--type-rental)', hint: 'Площадки и инвентарь', to: 'create-event.html' }
    ],
    results: [
      { type: 'event', id: 'e1', title: 'Забег «Петровские холмы»', badge: 'Открыта запись', badgeC: 'var(--st-open)', meta: '12 апреля · 09:00 · Центральный парк', price: 'Бесплатно', icon: 'ic-events', to: 'schedule-calendar.html' },
      { type: 'event', id: 'e2', title: 'Турнир по баскетболу 3×3', badge: 'Мероприятие', badgeC: 'var(--type-event)', meta: '19 апреля · 12:00 · УСК «Арена»', price: '500 ₽', icon: 'ic-events', to: 'schedule-calendar.html' },
      { type: 'event', id: 'e3', title: 'Стритбол-фест «Русский баскет»', badge: 'Мероприятие', badgeC: 'var(--type-event)', meta: '3 мая · 11:00 · Набережная', price: 'Бесплатно', icon: 'ic-events', to: 'schedule-calendar.html' },
      { type: 'training', id: 't1', title: 'ОФП · утренний поток', badge: 'Сегодня', badgeC: 'var(--st-confirmed)', meta: '07:30–08:30 · Стадион «Юность»', price: '1 200 ₽', icon: 'ic-dumbbell', to: 'trainings.html' },
      { type: 'training', id: 't2', title: 'Круговая тренировка', badge: 'Ближайшая', badgeC: 'var(--st-pending)', meta: 'Сб 09:00 · ФОК «Ритм»', price: '900 ₽', icon: 'ic-dumbbell', to: 'trainings.html' },
      { type: 'trainer', id: 'tr1', title: 'Анна Ковалёва', ava: 'ava-1', meta: 'ЛФК · стаж 8 лет', price: '1 500 ₽/ч' },
      { type: 'trainer', id: 'tr2', title: 'Илья Морозов', ava: 'ava-2', meta: 'Силовая · стаж 6 лет', price: '1 200 ₽/ч' },
      { type: 'trainer', id: 'tr3', title: 'Степан Власов', ava: 'ava-3', meta: 'Бег · стаж 9 лет', price: '1 800 ₽/ч' },
      { type: 'club', id: 'c1', title: 'Клуб «Пульс»', badge: 'Фитнес', badgeC: 'var(--type-club)', meta: '17 направлений · 340 участников', price: 'от 1 900 ₽', icon: 'ic-users', to: 'events-system.html' },
      { type: 'rental', id: 'r1', title: 'Баскетбольная площадка', badge: 'Крытая', badgeC: 'var(--type-rental)', meta: 'УСК «Арена» · 2 ч · до 10 чел', price: '1 500 ₽', stars: 4.5, icon: 'ic-clock', to: 'create-event.html' },
      { type: 'person', id: 'p1', title: 'Дмитрий Орлов', ava: 'ava-4', meta: 'ГТО · знак «Серебро»' }
    ]
  };

  var input = byId('search-input');
  var clearBtn = byId('search-clear');
  var micBtn = byId('search-mic');
  var filtersEl = byId('search-filters');
  var body = byId('search-body');

  function byId(id) { return document.getElementById(id); }

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function plural(n, forms) {
    var a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return forms[2];
    if (b > 1 && b < 5) return forms[1];
    if (b === 1) return forms[0];
    return forms[2];
  }

  function starsFor(v) {
    var s = '';
    for (var i = 0; i < Math.floor(v); i++) s += '★';
    if (v - Math.floor(v) >= 0.5) s += '½';
    return s;
  }

  function countFor(key) {
    var n = 0;
    for (var i = 0; i < DATA.results.length; i++) if (DATA.results[i].type === key) n++;
    return n;
  }

  function toast(msg) {
    var t = document.createElement('div');
    t.className = 'toast';
    t.innerHTML = msg;
    byId('toasts').appendChild(t);
    requestAnimationFrame(function () { t.classList.add('show'); });
    setTimeout(function () { t.classList.remove('show'); t.classList.add('hide'); }, 2400);
    setTimeout(function () { t.remove(); }, 2700);
  }

  function activeFilter() {
    if (!filtersEl.classList.contains('has-on')) return 'all';
    var on = filtersEl.querySelector('.fchip.is-on');
    return on ? on.dataset.k : 'all';
  }

  function updateURL() {
    var q = input.value.trim();
    var f = activeFilter();
    var s = '';
    if (q) s += 'q=' + encodeURIComponent(q);
    if (f !== 'all') s += (s ? '&' : '') + 'f=' + f;
    if (history.replaceState) history.replaceState(null, '', 'search.html' + (s ? '?' + s : ''));
  }

  function buildChips() {
    var s = '';
    for (var i = 0; i < FILTERS.length; i++) {
      var f = FILTERS[i];
      var c = f.key === 'all' ? DATA.results.length : countFor(f.key);
      s += '<button type="button" class="fchip" data-k="' + f.key + '" data-od-id="search-filter-' + f.key + '"><span>' + f.label + '</span><span class="cnt">' + c + '</span></button>';
    }
    filtersEl.innerHTML = s;
  }

  function resultCard(r) {
    var el = document.createElement('a');
    el.className = 'res-row';
    el.href = r.to || '#';
    el.style.setProperty('--c', TYPE_TOKEN[r.type] || 'var(--accent)');
    el.dataset.odId = 'search-result-' + r.id;
    var stars = r.stars ? '<span class="res-stars">' + starsFor(r.stars) + '</span> ' : '';
    el.innerHTML =
      '<span class="res-ic"><svg><use href="#' + r.icon + '"/></svg></span>' +
      '<span class="res-body">' +
        '<span class="res-title"><span class="res-name">' + escapeHtml(r.title) + '</span>' +
        (r.badge ? '<span class="res-badge" style="--c:' + r.badgeC + '">' + escapeHtml(r.badge) + '</span>' : '') +
        '</span>' +
        '<span class="res-meta">' + stars + escapeHtml(r.meta) + '</span>' +
      '</span>' +
      (r.price ? '<span class="res-side"><span class="res-price">' + escapeHtml(r.price) + '</span></span>' : '') +
      '<svg class="res-chev" aria-hidden="true"><use href="#ic-chev"/></svg>';
    return el;
  }

  function personCard(r, badge, badgeC, msg) {
    var el = document.createElement('button');
    el.className = 'res-row';
    el.setAttribute('type', 'button');
    el.style.setProperty('--c', TYPE_TOKEN[r.type] || 'var(--accent)');
    el.dataset.odId = 'search-result-' + r.id;
    el.innerHTML =
      '<span class="res-ic"><svg class="av"><use href="#' + r.ava + '"/></svg></span>' +
      '<span class="res-body">' +
        '<span class="res-title"><span class="res-name">' + escapeHtml(r.title) + '</span></span>' +
        '<span class="res-meta">' + escapeHtml(r.meta) + '</span>' +
      '</span>' +
      '<span class="res-side"><span class="res-badge" style="--c:' + badgeC + '">' + badge + '</span>' +
      (r.price ? '<span class="res-price">' + escapeHtml(r.price) + '</span>' : '') +
      '</span>';
    el.addEventListener('click', function () { toast(msg); });
    return el;
  }

  function cardFor(r) {
    if (r.type === 'trainer') return personCard(r, 'Тренер', 'var(--yellow)', 'Запись к тренеру появится в следующей версии');
    if (r.type === 'person') return personCard(r, 'ГТО · Серебро', 'var(--gto-silver)', 'Профиль появится в следующей версии');
    return resultCard(r);
  }

  function catTile(c) {
    var el = document.createElement('a');
    el.className = 'cat-tile';
    el.href = c.to;
    el.style.setProperty('--c', c.c);
    el.dataset.odId = 'search-cat-' + c.id;
    el.innerHTML =
      '<span class="ct-ic"><svg><use href="#' + c.icon + '"/></svg></span>' +
      '<span class="ct-tx"><b>' + escapeHtml(c.id) + '</b><small>' + escapeHtml(c.hint) + '</small></span>' +
      '<svg class="ct-chev" aria-hidden="true"><use href="#ic-chev"/></svg>';
    return el;
  }

  function groupLabel(t) {
    var d = document.createElement('div');
    d.className = 'group-label';
    d.innerHTML = '<span>' + escapeHtml(t) + '</span>';
    return d;
  }

  function resultsCount(n) {
    var d = document.createElement('div');
    d.className = 'results-count';
    d.dataset.odId = 'search-count';
    d.innerHTML = 'Найдено <b>' + n + '</b> ' + plural(n, ['результат', 'результата', 'результатов']);
    return d;
  }

  function emptyState() {
    var d = document.createElement('div');
    d.className = 'empty';
    d.dataset.odId = 'search-empty';
    d.innerHTML = '<svg><use href="#ic-search"/></svg><b>Ничего не найдено</b><span>Попробуйте изменить запрос или выбрать другую категорию</span>';
    return d;
  }

  function buildStart() {
    var s = '';
    s += '<div class="group-label"><span>Быстрые запросы</span></div>';
    s += '<div class="qchips" id="search-quick"></div>';
    s += '<div class="group-label"><span>Популярное</span></div>';
    s += '<div id="search-popular"></div>';
    s += '<div class="group-label"><span>Категории</span></div>';
    s += '<div class="cat-grid" id="search-cats"></div>';
    body.innerHTML = s;

    var quick = byId('search-quick');
    var qs = '';
    for (var i = 0; i < DATA.popular.length; i++) {
      var p = DATA.popular[i];
      qs += '<button type="button" class="qchip" data-q="' + escapeHtml(p.title) + '"><svg><use href="#' + p.icon + '"/></svg>' + escapeHtml(p.title) + '</button>';
    }
    quick.innerHTML = qs;

    var popular = byId('search-popular');
    for (var j = 0; j < DATA.popular.length; j++) popular.appendChild(resultCard(DATA.popular[j]));

    var cats = byId('search-cats');
    for (var k = 0; k < DATA.cats.length; k++) cats.appendChild(catTile(DATA.cats[k]));
  }

  function render(items, q) {
    body.innerHTML = '';
    if (q && !items.length) { body.appendChild(emptyState()); return; }
    body.appendChild(resultsCount(items.length));

    var sorted = items.slice().sort(function (a, b) { return SORT.indexOf(a.type) - SORT.indexOf(b.type); });
    var groups = [];
    for (var i = 0; i < sorted.length; i++) {
      var gi = -1;
      for (var j = 0; j < groups.length; j++) if (groups[j].type === sorted[i].type) { gi = j; break; }
      if (gi === -1) { groups.push({ type: sorted[i].type, items: [] }); gi = groups.length - 1; }
      groups[gi].items.push(sorted[i]);
    }

    for (var g = 0; g < groups.length; g++) {
      body.appendChild(groupLabel(HEADERS[groups[g].type] || groups[g].type));
      for (var k = 0; k < groups[g].items.length; k++) body.appendChild(cardFor(groups[g].items[k]));
    }
  }

  function runSearch() {
    var q = input.value.trim().toLowerCase();
    var f = activeFilter();
    var items = DATA.results.slice();
    if (f !== 'all') items = items.filter(function (r) { return r.type === f; });
    if (q) items = items.filter(function (r) { return r.title.toLowerCase().indexOf(q) > -1; });
    render(items, q);
  }

  function renderStart() {
    if (input.value.trim() || filtersEl.classList.contains('has-on')) runSearch();
    else buildStart();
  }

  function readQuery() {
    var q = '', f = 'all';
    var raw = decodeURIComponent(window.location.search.replace(/^\?/, ''));
    if (!raw) return { q: q, f: f };
    var pairs = raw.split('&');
    for (var i = 0; i < pairs.length; i++) {
      var kv = pairs[i].split('=');
      if (kv[0] === 'q') q = (kv[1] || '').replace(/\+/g, ' ');
      if (kv[0] === 'f') f = kv[1] || 'all';
    }
    return { q: q, f: f };
  }

  function applyQuery(q) {
    input.value = q.q;
    clearBtn.style.display = q.q ? '' : 'none';
    if (q.f !== 'all') {
      filtersEl.classList.add('has-on');
      var chips = filtersEl.children;
      for (var i = 0; i < chips.length; i++) chips[i].classList.toggle('is-on', chips[i].dataset.k === q.f);
    }
    renderStart();
  }

  filtersEl.addEventListener('click', function (e) {
    var chip = e.target.closest ? e.target.closest('.fchip') : null;
    if (!chip) return;
    if (filtersEl.classList.contains('has-on')) {
      filtersEl.classList.remove('has-on');
      var all = filtersEl.children;
      for (var i = 0; i < all.length; i++) all[i].classList.remove('is-on');
    } else {
      filtersEl.classList.add('has-on');
      var c = filtersEl.children;
      for (var j = 0; j < c.length; j++) c[j].classList.toggle('is-on', c[j] === chip);
    }
    updateURL();
    renderStart();
  });

  body.addEventListener('click', function (e) {
    var chip = e.target.closest ? e.target.closest('.qchip') : null;
    if (!chip) return;
    input.value = chip.dataset.q;
    clearBtn.style.display = '';
    input.focus();
    updateURL();
    renderStart();
  });

  input.addEventListener('input', function () {
    clearBtn.style.display = input.value ? '' : 'none';
    updateURL();
    renderStart();
  });

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
  });

  clearBtn.addEventListener('click', function () {
    input.value = '';
    clearBtn.style.display = 'none';
    input.focus();
    updateURL();
    renderStart();
  });

  micBtn.addEventListener('click', function () {
    toast('Голосовой поиск появится в следующей версии');
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    input.value = '';
    clearBtn.style.display = 'none';
    filtersEl.classList.remove('has-on');
    var c = filtersEl.children;
    for (var i = 0; i < c.length; i++) c[i].classList.remove('is-on');
    updateURL();
    renderStart();
  });

  document.querySelectorAll('[data-toast]').forEach(function (b) {
    b.addEventListener('click', function () { toast(b.getAttribute('data-toast')); });
  });

  buildChips();
  applyQuery(readQuery());
  input.focus();
})();
</script>
</body>
</html>
