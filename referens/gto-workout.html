<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eaf4ff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<title>Петровское СП — тренировка ГТО</title>
<style>
:root {
  /* ─── Surface (3 levels) ────────────────────────────────────────── */
  --bg: #ffffff;
  --surface: #eef6ff;
  --surface-2: #eef6ff;
  --surface-warm: #f5faff;

  /* ─── Foreground ramp (4 levels) ───────────────────────────────── */
  --fg: #12213b;
  --fg-2: #445269;
  --muted: #78859b;
  --meta: #99a4b7;

  /* ─── Border (2 levels) ────────────────────────────────────────── */
  --border: rgba(18,33,59,0.08);
  --border-soft: rgba(18,33,59,0.05);
  --border-strong: rgba(18,33,59,0.16);

  /* ─── Accent ────────────────────────────────────────────────────── */
  --accent: #1a86e0;
  --accent-on: #ffffff;
  --accent-hover: #2f97f0;
  --accent-active: #1473c9;
  --yellow: #ffc93c;
  --yellow-on: #12213b;
  --lime: #ffc93c;
  --lime-on: #12213b;

  /* ─── Semantic ──────────────────────────────────────────────────── */
  --success: #2bb066;
  --warn:    #ffc93c;
  --danger:  #ff4d4d;

  /* ─── Знак ГТО ──────────────────────────────────────────────────── */
  --gto-bronze: #c9a06b;
  --gto-silver: #a9b6c9;
  --gto-gold:   #ffc93c;

  /* ─── Typography ────────────────────────────────────────────────── */
  --font-display: "Oswald", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Inter", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;

  --fs-body: 16px;
  --fs-meta: 13px;
  --h-base: 44px;
  --icon-md: 20px;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;

  /* ─── Radius ────────────────────────────────────────────────────── */
  --radius-sm:   10px;
  --radius-md:   14px;
  --radius-lg:   20px;
  --radius-pill: 980px;

  /* ─── Elevation & focus ─────────────────────────────────────────── */
  --elev-raised: 0 16px 36px rgba(18,33,59,0.10);
  --focus-ring: 0 0 0 4px rgba(26,134,224,0.30);

  /* ─── Motion ────────────────────────────────────────────────────── */
  --motion-fast:   150ms;
  --motion-base:   220ms;
  --ease-standard: cubic-bezier(0.28,0,0.22,1);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--surface-warm);
  color: var(--fg);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button { font-family: inherit; }
a { color: inherit; }

.app {
  max-width: 700px;
  margin: 0 auto;
  padding: 0 0 100px;
  min-height: 100vh;
}

/* ── Экранная шапка · назад / заголовок / действие ─────────────────── */
.topbar {
  flex: none;
  width: 100%;
  display: flex;
  align-items: center;
  gap: var(--space-1);
  padding: var(--space-2);
}
.topbar-ic {
  flex: none;
  width: var(--h-base);
  height: var(--h-base);
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--fg-2);
  cursor: pointer;
  text-decoration: none;
  transition: background var(--motion-fast) var(--ease-standard);
}
.topbar-ic:hover { background: var(--surface-2); }
.topbar-ic:active { background: var(--border-soft); }
.topbar-ic:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.topbar-ic svg { width: 20px; height: 20px; }
.topbar-tx {
  flex: 1;
  min-width: 0;
  margin: 0;
  padding: 0 var(--space-2);
  font-size: var(--fs-body);
  font-weight: 600;
  color: var(--fg);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── Лид-блок (eyebrow · подзаголовок) ─────────────────────────────── */
.lead {
  padding: var(--space-1) var(--space-4) var(--space-3);
}
.lead .eyebrow {
  margin: 0 0 3px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--meta);
}
.lead .sub { margin: 5px 0 0; font-size: 13px; line-height: 1.4; color: var(--muted); }
@media (min-width: 560px) { .lead { padding-left: var(--space-6); padding-right: var(--space-6); } }

/* ── Прогресс дня ──────────────────────────────────────────────────── */
.day-progress {
  margin: 4px 16px 0;
  background: var(--bg);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-lg);
  box-shadow: var(--elev-raised);
  padding: 14px 16px;
  animation: rise 0.4s var(--ease-standard) both;
}
@media (min-width: 560px) { .day-progress { margin-left: 24px; margin-right: 24px; } }
.dp-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  font-size: 13px;
  color: var(--muted);
}
.dp-top b { font-size: 15px; font-weight: 700; color: var(--fg); }
.dp-track {
  margin-top: 10px;
  height: 8px;
  border-radius: var(--radius-pill);
  background: var(--surface);
  overflow: hidden;
}
.dp-fill {
  height: 100%;
  width: 0;
  border-radius: var(--radius-pill);
  background: linear-gradient(90deg, var(--gto-bronze), var(--gto-gold));
  transition: width 0.5s var(--ease-standard);
}

/* ── Карточка упражнения ───────────────────────────────────────────── */
.ex-wrap { margin: 20px 16px 0; }
@media (min-width: 560px) { .ex-wrap { margin-left: 24px; margin-right: 24px; } }
.ex {
  background: var(--bg);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-lg);
  box-shadow: var(--elev-raised);
  padding: 16px;
  animation: rise 0.4s var(--ease-standard) both;
  animation-delay: calc(var(--i, 0) * 60ms);
}
@keyframes rise {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: reduce) { .day-progress, .ex { animation: none; } }
.ex-top { display: flex; align-items: baseline; gap: 8px; }
.ex-top h2 { margin: 0; flex: 1; font-size: 17px; font-weight: 700; letter-spacing: -0.011em; }
.ex-group { font-size: 12px; font-weight: 600; color: var(--meta); }
.ex-note { margin: 6px 0 0; font-size: 12px; line-height: 1.4; color: var(--muted); }

.sets { display: grid; gap: 8px; margin-top: 14px; }
.set-row {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--surface-warm);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-md);
  padding: 10px 12px;
}
.set-row.is-done { background: color-mix(in srgb, var(--success) 9%, var(--bg)); border-color: color-mix(in srgb, var(--success) 40%, var(--border)); }
.set-label { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; }
.set-label small { display: block; font-size: 11px; font-weight: 500; color: var(--meta); }
.set-done {
  flex: none;
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  background: var(--bg);
  color: transparent;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background var(--motion-fast) var(--ease-standard),
              border-color var(--motion-fast) var(--ease-standard),
              color var(--motion-fast) var(--ease-standard);
}
.set-done:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.set-done svg { width: 16px; height: 16px; }
.set-row.is-done .set-done {
  background: var(--success);
  border-color: var(--success);
  color: #fff;
}

.timer-btn {
  flex: none;
  display: grid;
  place-items: center;
  min-width: 84px;
  height: 40px;
  padding: 0 12px;
  border-radius: var(--radius-pill);
  border: 1.5px solid var(--border);
  background: var(--bg);
  color: var(--fg);
  font-size: 15px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background var(--motion-fast) var(--ease-standard),
              border-color var(--motion-fast) var(--ease-standard),
              color var(--motion-fast) var(--ease-standard);
}
.timer-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.timer-btn.is-running {
  border-color: var(--danger);
  color: var(--danger);
  animation: pulse 1s ease-in-out infinite;
}
.timer-btn.is-timed { border-color: var(--border); }
.timer-btn.is-finished {
  background: var(--success);
  border-color: var(--success);
  color: #fff;
  animation: none;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--danger) 35%, transparent); }
  50%      { box-shadow: 0 0 0 6px color-mix(in srgb, var(--danger) 0%, transparent); }
}

/* ── Пустой день (отдых) ───────────────────────────────────────────── */
.rest {
  margin: 20px 16px 0;
  background: var(--bg);
  border: 1px dashed var(--border);
  border-radius: var(--radius-lg);
  padding: 30px 20px;
  text-align: center;
  font-size: 14px;
  line-height: 1.5;
  color: var(--muted);
}
@media (min-width: 560px) { .rest { margin-left: 24px; margin-right: 24px; } }
.rest b { display: block; color: var(--fg-2); font-size: 16px; margin-bottom: 4px; }
.rest .r-ic {
  width: 46px;
  height: 46px;
  margin: 0 auto 12px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--success);
  background: color-mix(in srgb, var(--success) 12%, var(--bg));
}
.rest .r-ic svg { width: 24px; height: 24px; }

/* ── Нижняя панель ─────────────────────────────────────────────────── */
.bottom-bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 50;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: saturate(1.8) blur(20px);
  -webkit-backdrop-filter: saturate(1.8) blur(20px);
  border-top: 1px solid var(--border-soft);
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
}
.bottom-inner { max-width: 700px; margin: 0 auto; }
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  height: 50px;
  border-radius: var(--radius-pill);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.01em;
  cursor: pointer;
  border: 0;
  transition: background var(--motion-fast) var(--ease-standard),
              transform var(--motion-fast) var(--ease-standard),
              opacity var(--motion-fast) var(--ease-standard);
}
.btn:active { transform: scale(0.985); }
.btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.btn svg { width: 18px; height: 18px; }
.btn-primary { background: var(--accent); color: var(--accent-on); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:active { background: var(--accent-active); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn:disabled:active { transform: none; }
.fin-note { margin-top: 8px; text-align: center; font-size: 12px; color: var(--meta); }

/* ── Тост ──────────────────────────────────────────────────────────── */
.toast-wrap {
  position: fixed;
  left: 50%;
  bottom: 92px;
  transform: translateX(-50%);
  display: grid;
  gap: 8px;
  z-index: 70;
  width: max-content;
  max-width: calc(100vw - 40px);
}
.toast {
  background: var(--fg);
  color: var(--surface-warm);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.35;
  border-radius: var(--radius-pill);
  padding: 10px 18px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22);
  animation: toast-in 0.3s var(--ease-standard) both;
}
.toast.hide { animation: toast-out 0.25s var(--ease-standard) both; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes toast-out { to { opacity: 0; transform: translateY(8px); } }

/* ── Единый брендовый confirm-диалог ──────────────────────────────── */
.bc {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: grid;
  place-items: center;
  padding: 24px;
}
.bc[hidden] { display: none; }
.bc-scrim {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  opacity: 0;
  transition: opacity 0.22s cubic-bezier(0.28, 0, 0.22, 1);
}
.bc.open .bc-scrim { opacity: 1; }
.bc-card {
  position: relative;
  width: 100%;
  max-width: 340px;
  background: #ffffff;
  border-radius: 20px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
  padding: 22px 20px 18px;
  text-align: center;
  transform: scale(0.92) translateY(8px);
  opacity: 0;
  transition: transform 0.22s cubic-bezier(0.28, 0, 0.22, 1),
              opacity 0.22s cubic-bezier(0.28, 0, 0.22, 1);
  font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
  color: #1d2939;
}
.bc.open .bc-card { transform: none; opacity: 1; }
.bc-title {
  margin: 0;
  font-family: "Oswald", "Helvetica Neue", Arial, sans-serif;
  font-size: 21px;
  font-weight: 600;
  letter-spacing: 0.01em;
  line-height: 1.25;
  color: #10294d;
}
.bc-sub {
  margin: 8px 0 0;
  font-size: 14px;
  line-height: 1.5;
  color: #5b6b82;
}
.bc-actions { display: grid; gap: 8px; margin-top: 20px; }
.bc-btn {
  width: 100%;
  height: 46px;
  border: 0;
  border-radius: 980px;
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s cubic-bezier(0.28, 0, 0.22, 1),
              transform 0.15s cubic-bezier(0.28, 0, 0.22, 1);
}
.bc-btn:active { transform: scale(0.985); }
.bc-btn:focus-visible { outline: none; box-shadow: 0 0 0 4px rgba(47, 155, 255, 0.35); }
.bc-cancel { background: #eef3f9; color: #10294d; }
.bc-cancel:hover { background: #e2eaf4; }
.bc-primary { background: #2f9bff; color: #ffffff; }
.bc-primary:hover { background: #52adff; }
.bc-danger { background: #ff4d4d; color: #ffffff; }
.bc-danger:hover { background: #ff6b6b; }
body.no-scroll { overflow: hidden; }
</style>
</head>
<body data-od-id="gto-workout">

<div class="app">
  <header class="hd" data-od-id="gto-workout-header">
    <a class="back" id="w-back" href="gto-plan.html" aria-label="Назад к плану подготовки"><svg><use href="#ic-back"/></svg></a>
    <div class="hd-txt">
      <div class="eyebrow">Петровское СП · Дневник ГТО</div>
      <h1 id="w-title">Тренировка</h1>
      <p class="sub" id="w-sub"></p>
    </div>
  </header>

  <main class="body">
    <section class="day-progress" data-od-id="gto-workout-progress" aria-label="Прогресс тренировки">
      <div class="dp-top"><span id="dp-label">Выполнено</span><b id="dp-count">0 из 0</b></div>
      <div class="dp-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="dp-fill" id="dp-fill"></div>
      </div>
    </section>
    <div id="w-body" data-od-id="gto-workout-body"></div>
  </main>
</div>

<div class="bottom-bar" data-od-id="gto-workout-finish-bar">
  <div class="bottom-inner">
    <button type="button" class="btn btn-primary" id="w-finish" data-od-id="gto-workout-finish" disabled>
      <svg aria-hidden="true"><use href="#ic-flag"/></svg>Завершить тренировку
    </button>
    <div class="fin-note" id="w-hint">Отметьте подходы и таймеры, чтобы завершить</div>
  </div>
</div>

<div class="bc" id="bc" data-od-id="gto-workout-confirm" hidden>
  <div class="bc-scrim" id="bc-scrim" data-od-id="gto-workout-confirm-scrim"></div>
  <div class="bc-card" role="dialog" aria-modal="true" aria-label="Подтверждение" data-od-id="gto-workout-confirm-card">
    <h3 class="bc-title" id="bc-title"></h3>
    <p class="bc-sub" id="bc-sub"></p>
    <div class="bc-actions">
      <button type="button" class="bc-btn bc-primary" id="bc-ok" data-od-id="gto-workout-confirm-ok"></button>
      <button type="button" class="bc-btn bc-cancel" id="bc-cancel" data-od-id="gto-workout-confirm-cancel">Отмена</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toasts" data-od-id="gto-workout-toasts"></div>

<script>
(function () {
  function qs(name) {
    var m = location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
    return m ? decodeURIComponent(m[1]) : null;
  }
  function toast(msg) {
    var wrap = document.getElementById('toasts');
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    wrap.appendChild(t);
    setTimeout(function () {
      t.classList.add('hide');
      setTimeout(function () { t.remove(); }, 260);
    }, 2200);
  }

  var PLAN = {
    pull: {
      name: 'Подтягивания', target: '20 раз',
      exercises: [
        { name: 'Отжимания', group: 'Грудь · трицепс', note: 'До отказа — последний подход максимально', w: [
          ['3×10', '3×10 +до отказа', '3×15'],
          ['4×12', '4×12 +до отказа', '4×15'],
          ['4×15', '4×15 +до отказа', '5×12']
        ]},
        { name: 'Планка', group: 'Кор · стабилизация', note: 'Держите корпус прямо, не прогибайтесь', w: [
          ['30 с', '45 с', '30 с'],
          ['45 с', '60 с', '45 с'],
          ['60 с', '75 с', '60 с']
        ]},
        { name: 'Подтягивания с резинкой', group: 'Широчайшие · бицепс', note: 'Резинка помогает на 40%', w: [
          ['3×5', '3×6', '3×7'],
          ['3×8', '3×9', '3×10'],
          ['4×8', '4×9', '4×10']
        ]},
        { name: 'Вис на перекладине', group: 'Хват · предплечья', note: 'Не раскачивайтесь', w: [
          ['3×15 с', '3×20 с', '3×25 с'],
          ['3×30 с', '3×35 с', '3×40 с'],
          ['4×30 с', '4×40 с', '4×45 с']
        ]}
      ]
    },
    run100: {
      name: 'Бег 100 м', target: '14,6 с',
      exercises: [
        { name: 'Интервалы 100 м · темп 80%', group: 'Беговая техника', note: 'Между повторениями — отдых 2 мин', w: [
          ['4×100 м', '4×100 м', '5×100 м'],
          ['5×100 м', '5×100 м', '6×100 м'],
          ['6×100 м', '6×100 м', '7×100 м']
        ]},
        { name: 'Лёгкий бег · пульс ~140', group: 'Аэробная база', note: 'Бегите разговорно', w: [
          ['15 мин', '20 мин', '15 мин'],
          ['20 мин', '25 мин', '20 мин'],
          ['25 мин', '30 мин', '25 мин']
        ]},
        { name: 'Выпады', group: 'Ягодицы · квадрицепс', note: 'Шаг шире, колено не вперёд носка', w: [
          ['3×10', '3×12', '3×12'],
          ['3×15', '3×15', '4×12'],
          ['4×15', '4×15', '4×15']
        ]},
        { name: 'Подъём на носки', group: 'Икры', note: 'В верхней точке — пауза 1 сек', w: [
          ['3×15', '3×20', '3×20'],
          ['3×25', '3×25', '4×20'],
          ['4×25', '4×25', '4×20']
        ]}
      ]
    }
  };

  var norm = PLAN[qs('norm') || 'pull'] ? qs('norm') : 'pull';
  var week = Math.min(Math.max(parseInt(qs('week') || '1', 10), 1), 3);
  var day = Math.min(Math.max(parseInt(qs('day') || '1', 10), 1), 7);
  var n = PLAN[norm];

  document.getElementById('w-title').textContent = 'Тренировка · ' + n.name;
  document.getElementById('w-sub').textContent = 'Неделя ' + week + ' · День ' + day;

  var state = [];
  function parseVolume(v) {
    if (!v) return null;
    var toFail = v.indexOf('+до отказа') !== -1;
    var base = v.replace('+до отказа', '').trim();
    var mt = base.match(/^(\d+)×(\d+)\s*(с|мин)$/);
    if (mt) return { kind: 'time', sets: parseInt(mt[1], 10), secs: parseInt(mt[2], 10) * (mt[3] === 'мин' ? 60 : 1) };
    var ms = base.match(/^(\d+)\s*(с|мин)$/);
    if (ms) return { kind: 'time', sets: 1, secs: parseInt(ms[1], 10) * (ms[2] === 'мин' ? 60 : 1) };
    var m = base.match(/^(\d+)×(.+)$/);
    if (!m) return null;
    var sets = parseInt(m[1], 10);
    var target = m[2];
    return { kind: 'reps', sets: sets, target: target, lastFail: toFail };
  }

  var timers = {}; /* key -> {left, timerId, running} */

  function build() {
    var body = document.getElementById('w-body');
    var vol = n.exercises[0].w[week - 1][day - 1];

    if (!vol || vol === 'отдых') {
      body.innerHTML =
        '<div class="rest" data-od-id="gto-workout-rest">' +
          '<div class="r-ic" aria-hidden="true"><svg><use href="#ic-sleep"/></svg></div>' +
          '<b>День отдыха</b>' +
          'Восстановление — часть плана. Следующая тренировка по плану в расписании.' +
        '</div>';
      document.getElementById('dp-count').textContent = '—';
      document.getElementById('w-finish').disabled = true;
      return;
    }

    var totalSets = 0;
    n.exercises.forEach(function (ex) {
      var p = parseVolume(ex.w[week - 1][day - 1]);
      if (!p) return;
      totalSets += p.sets;
      state.push({ ex: ex, p: p, done: [] });
    });

    var html = '';
    var si = 0;
    n.exercises.forEach(function (ex, ei) {
      var p = parseVolume(ex.w[week - 1][day - 1]);
      if (!p) return;
      var st = state[si];

      if (p.kind === 'time') {
        var trows = '';
        for (var t = 0; t < p.sets; t++) {
          var key = norm + '-' + week + '-' + day + '-' + si + '-' + t;
          timers[key] = { left: p.secs, running: false, finished: !!st.done[t] };
          trows += '<div class="set-row' + (st.done[t] ? ' is-done' : '') + '" data-timer-row="' + key + '">' +
            '<span class="set-label">' + (p.sets > 1 ? 'Подход ' + (t + 1) : 'Одна попытка на время') + '<small>Удерживайте ' + fmt(p.secs) + '</small></span>' +
            '<button type="button" class="timer-btn' + (st.done[t] ? ' is-finished' : '') + '" data-timer="' + key + '" data-target="' + p.secs + '" aria-label="Таймер подхода ' + (t + 1) + '">' + fmt(p.secs) + '</button>' +
          '</div>';
        }
        html += '<section class="ex" style="--i:' + ei + '" data-od-id="gto-workout-ex-' + ei + '">' +
          '<div class="ex-top"><h2>' + ex.name + '</h2><span class="ex-group">' + ex.group + '</span></div>' +
          '<p class="ex-note">' + ex.note + '</p>' +
          '<div class="sets">' + trows + '</div>' +
        '</section>';
      } else {
        var sets = '';
        for (var s = 0; s < p.sets; s++) {
          var label = p.lastFail && s === p.sets - 1 ? 'До отказа' : 'Подход ' + (s + 1);
          var meta = (p.lastFail && s === p.sets - 1) ? ('цель: как можно больше, не ниже ' + p.target) : ('цель: ' + p.target);
          sets += '<div class="set-row' + (st.done[s] ? ' is-done' : '') + '" data-od-id="gto-workout-set-' + ei + '-' + s + '">' +
            '<span class="set-label">' + label + '<small>' + meta + '</small></span>' +
            '<button type="button" class="set-done" data-set="' + si + '-' + s + '" aria-label="Подход ' + (s + 1) + ' выполнен"><svg aria-hidden="true"><use href="#ic-check"/></svg></button>' +
          '</div>';
        }
        html += '<section class="ex" style="--i:' + ei + '" data-od-id="gto-workout-ex-' + ei + '">' +
          '<div class="ex-top"><h2>' + ex.name + '</h2><span class="ex-group">' + ex.group + '</span></div>' +
          '<p class="ex-note">' + ex.note + '</p>' +
          '<div class="sets">' + sets + '</div>' +
        '</section>';
      }
      si++;
    });

    body.innerHTML = html;
    bind();
    update();
  }

  function fmt(secs) {
    if (secs >= 60) {
      var m = Math.floor(secs / 60);
      var s = secs % 60;
      return (s ? m + ' мин ' + s + ' с' : m + ' мин');
    }
    return secs + ' с';
  }

  function bind() {
    document.querySelectorAll('[data-set]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var parts = btn.getAttribute('data-set').split('-');
        var st = state[+parts[0]];
        st.done[+parts[1]] = !st.done[+parts[1]];
        btn.closest('.set-row').classList.toggle('is-done', !!st.done[+parts[1]]);
        update();
      });
    });
    document.querySelectorAll('[data-timer]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var parts = btn.getAttribute('data-timer').split('-');
        var st = state[+parts[3]];
        var tIdx = +parts[4];
        var row = btn.closest('[data-timer-row]');
        var key = btn.getAttribute('data-timer');
        var t = timers[key];
        if (t.finished) {
          t.finished = false;
          st.done[tIdx] = false;
          btn.classList.remove('is-finished');
          btn.textContent = fmt(t.left);
          row.classList.remove('is-done');
          update();
          return;
        }
        if (t.running) { stopTimer(key, btn); return; }
        t.running = true;
        btn.classList.add('is-running');
        t.timerId = setInterval(function () {
          t.left--;
          btn.textContent = fmt(t.left);
          if (t.left <= 0) {
            clearInterval(t.timerId);
            t.running = false;
            t.finished = true;
            btn.classList.remove('is-running');
            btn.classList.add('is-finished');
            btn.textContent = 'Готово';
            st.done[tIdx] = true;
            row.classList.add('is-done');
            update();
          }
        }, 1000);
      });
    });
  }

  function stopTimer(key, btn) {
    var t = timers[key];
    if (t.timerId) clearInterval(t.timerId);
    t.running = false;
    btn.classList.remove('is-running');
    btn.textContent = fmt(t.left);
  }

  function doneSets() {
    var c = 0;
    state.forEach(function (s) { c += s.done.filter(Boolean).length; });
    return c;
  }
  function totalSets() {
    var c = 0;
    state.forEach(function (s) { c += s.p.sets; });
    return c;
  }

  function update() {
    var done = doneSets();
    var total = totalSets();
    document.getElementById('dp-count').textContent = done + ' из ' + total;
    var pct = total ? Math.round(done / total * 100) : 0;
    document.getElementById('dp-fill').style.width = pct + '%';
    var bar = document.querySelector('.dp-track');
    bar.setAttribute('aria-valuenow', String(pct));
    var fin = document.getElementById('w-finish');
    fin.disabled = done !== total;
    document.getElementById('w-hint').textContent =
      done === total ? 'Отлично, всё выполнено!' : 'Отметьте подходы и таймеры, чтобы завершить';
  }

  document.getElementById('w-finish').addEventListener('click', function () {
    bcConfirm({
      title: 'Завершить тренировку?',
      sub: 'Вы действительно хотите завершить тренировку? День будет отмечен выполненным в плане подготовки.',
      okLabel: 'Завершить',
      onOk: function () {
        toast('Тренировка завершена · день отмечен в плане');
        setTimeout(function () { location.href = 'gto-plan.html'; }, 900);
      }
    });
  });

  /* ── Единый брендовый confirm-диалог ─────────────────────────────── */
  var bcCtx = null;
  function bcConfirm(opts) {
    var root = document.getElementById('bc');
    document.getElementById('bc-title').textContent = opts.title || 'Подтверждение';
    document.getElementById('bc-sub').textContent = opts.sub || '';
    var ok = document.getElementById('bc-ok');
    ok.textContent = opts.okLabel || 'Подтвердить';
    ok.className = 'bc-btn ' + (opts.danger ? 'bc-danger' : 'bc-primary');
    bcCtx = { onOk: opts.onOk || null };
    root.hidden = false;
    requestAnimationFrame(function () { root.classList.add('open'); });
    document.body.classList.add('no-scroll');
  }
  function bcClose() {
    if (!bcCtx) return;
    bcCtx = null;
    var root = document.getElementById('bc');
    root.classList.remove('open');
    document.body.classList.remove('no-scroll');
    setTimeout(function () { root.hidden = true; }, 220);
  }
  document.getElementById('bc-ok').addEventListener('click', function () {
    var cb = bcCtx && bcCtx.onOk;
    bcClose();
    if (cb) cb();
  });
  document.getElementById('bc-cancel').addEventListener('click', bcClose);
  document.getElementById('bc-scrim').addEventListener('click', bcClose);
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && bcCtx) bcClose();
  });

  build();
})();
</script>
</body>
</html>
