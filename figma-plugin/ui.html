<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: Inter, system-ui, sans-serif; margin: 0; padding: 16px; background: #1e1e1e; color: #e6e6e6; }
    h1 { font-size: 14px; margin: 0 0 12px; font-weight: 600; }
    .btn { display: block; width: 100%; padding: 10px 12px; border: 0; border-radius: 6px; font-size: 13px; cursor: pointer; margin-top: 8px; }
    .btn-primary { background: #0d99ff; color: #fff; }
    .btn-primary:disabled { background: #444; color: #999; cursor: default; }
    .btn-secondary { background: #333; color: #e6e6e6; }
    #files { font-size: 12px; color: #aaa; margin-top: 10px; white-space: pre-wrap; }
    #status { font-size: 12px; color: #7bd88f; margin-top: 10px; white-space: pre-wrap; }
    #status.err { color: #ff8b8b; }
  </style>
</head>
<body>
  <h1>Импорт .fig.json на активную страницу</h1>
  <button class="btn btn-secondary" id="pick">Выбрать .fig.json файлы</button>
  <input type="file" id="input" accept=".json,application/json" multiple hidden>
  <div id="files">Файлы не выбраны</div>
  <button class="btn btn-primary" id="go" disabled>Импортировать</button>
  <div id="status"></div>
  <script>
    const input = document.getElementById('input');
    const pick = document.getElementById('pick');
    const go = document.getElementById('go');
    const filesEl = document.getElementById('files');
    const statusEl = document.getElementById('status');
    let files = [];

    pick.onclick = () => input.click();
    input.onchange = () => {
      files = Array.from(input.files);
      filesEl.textContent = files.length
        ? files.map(f => '• ' + f.name).join('\n')
        : 'Файлы не выбраны';
      go.disabled = files.length === 0;
    };
    go.onclick = () => {
      if (!files.length) return;
      go.disabled = true;
      const readers = files.map(f => new Promise((res) => {
        const r = new FileReader();
        r.onload = () => res({ name: f.name, data: r.result });
        r.readAsText(f);
      }));
      Promise.all(readers).then((items) => {
        parent.postMessage({ pluginMessage: { type: 'import', items } }, '*');
      });
    };
    onmessage = (e) => {
      const msg = e.data.pluginMessage;
      if (!msg) return;
      if (msg.type === 'status') {
        statusEl.className = msg.ok ? '' : 'err';
        statusEl.textContent = msg.text;
        if (msg.done) go.disabled = false;
      }
    };
  </script>
</body>
</html>
