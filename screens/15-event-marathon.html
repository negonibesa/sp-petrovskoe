<!doctype html>
<html lang="ru">
<head>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%233b7bff'/%3E%3C/svg%3E">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f7fc">
<title>Событие · Петровское СП</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/ds.css">
<style>
  /* Универсальный `event_details` (product-spec §6.4): один экран, рендерится
     по данным события. Состав табов — из данных, не из типа экрана:
     - марафон (забег, сетки нет):      Обзор / Результаты / Участники
     - турнир-пример «Летний Кубок»:    Обзор / Сетка / Результаты / Участники
     (бракет + пьедестал из ДС v1). Переключение табов — JS с обновлением
     aria-selected (в ДС — CSS :checked; в проде — JS). */
  .ev-app { background: var(--surface-warm); padding-bottom: calc(196px + env(safe-area-inset-bottom, 0px)); }
  .ev-body { padding-top: var(--space-1); }
  .ev-body > .evd-pane + .evd-pane { margin-top: 0; }

  /* ── Шапка: чистая типографика (канон ГТО .r-head) —
        eyebrow (категория) + display-заголовок + статус-пилюля. Без иконки. ── */
  .evd-head { padding: var(--space-1) var(--space-4) var(--space-4); }
  .evd-head .eyebrow {
    margin: 0;
    font-size: var(--fs-caption);
    font-weight: 600;
    letter-spacing: var(--tracking-caps);
    text-transform: uppercase;
    color: var(--muted);
  }
  .evd-title { margin: 10px 0 0; font-family: var(--font-display); font-size: var(--fs-display); font-weight: 700; line-height: 1.08; letter-spacing: 0.01em; color: var(--fg); }
  .evd-badges { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; margin-top: var(--space-3); }

  /* ── Табы (JS: .is-on + aria-selected вместо :checked). Колонки автоширины,
        межтабовый зазор ЕДИНЫЙ var(--space-3) — расстояния между подписями
        равные при любой их ширине (не flex:1 — тот даёт разный визуальный
        зазор из-за центрирования в равных колонках). ── */
  .evd-tabbar { display: flex; justify-content: center; gap: var(--space-3); padding: 0 var(--space-4); border-bottom: 1px solid var(--border-soft); }
  .evd-tab {
    flex: 0 0 auto; height: var(--h-base); min-width: 0;
    padding: 0 var(--space-2);
    display: inline-flex; align-items: center; justify-content: center;
    border: 0; border-bottom: 2px solid transparent;
    background: transparent; color: var(--fg-2);
    font-family: inherit; font-size: var(--fs-meta); font-weight: 600;
    white-space: nowrap; cursor: pointer; user-select: none;
    transition: color var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), background var(--motion-fast) var(--ease-standard);
  }
  .evd-tab.is-on { color: var(--accent); border-bottom-color: var(--accent); }
  .evd-tab:active { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .evd-tab:focus-visible { outline: none; box-shadow: var(--focus-ring); }

  .evd-pane { display: none; }
  .evd-pane.is-on { display: block; animation: pane-in 0.15s var(--ease-out); }
  @keyframes pane-in { from { opacity: 0; } to { opacity: 1; } }

  .evd-rows { display: grid; gap: var(--space-2); }
  .evd-row { display: flex; gap: var(--space-3); align-items: center; }
  .evd-ric { flex: none; width: 40px; height: 40px; border-radius: var(--radius-md); display: grid; place-items: center; color: color-mix(in oklab, var(--c), var(--fg) 30%); background: color-mix(in srgb, var(--c) 10%, transparent); }
  .evd-ric svg { width: 20px; height: 20px; }
  .evd-rtx { display: grid; gap: 2px; min-width: 0; }
  .evd-rtx b { font-size: var(--fs-body); font-weight: 600; color: var(--fg); }
  .evd-rtx span { font-size: var(--fs-meta); color: var(--muted); }
  .evd-note { margin: var(--space-3) 0 0; font-size: var(--fs-meta); color: var(--fg-2); line-height: 1.5; }
  .evd-sec { display: grid; gap: var(--space-2); margin-top: var(--space-3); }
  .evd-sec-t { margin: 0; font-size: var(--fs-meta); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .card .evd-sec-t { margin: 0 0 var(--space-3); }
  .evd-pane .card .mrow.is-static { padding-left: 0; padding-right: 0; }
  .evd-pane .card .ev-steps { margin-top: var(--space-2); }

  .evd-org { display: flex; align-items: center; gap: var(--space-3); margin-top: var(--space-4); padding: var(--space-3); background: var(--surface-warm); border: 1px solid var(--border); border-radius: var(--radius-md); }
  .evd-org-tx { min-width: 0; display: grid; gap: 1px; }
  .evd-org-tx b { font-size: var(--fs-meta); font-weight: 600; color: var(--fg); }
  .evd-org-tx span { font-size: var(--fs-caption); color: var(--muted); }

  .evd-rego { display: grid; gap: var(--space-2); }
  .evd-rego-row { display: flex; gap: var(--space-3); align-items: baseline; font-size: var(--fs-meta); color: var(--fg-2); }
  .evd-rego-time { flex: none; width: 52px; font-weight: 600; color: var(--fg); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .evd-rego-dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--type-event); }
  .evd-rego-dot.is-next { background: var(--muted); }

  /* ── Сетка турнира: колонки, горизонтальный скролл внутри таба ── */
  .evd-brk-hint { display: flex; align-items: center; gap: var(--space-1); margin: 0 0 var(--space-2); font-size: var(--fs-caption); color: var(--muted); }
  .evd-brk-hint svg { width: 13px; height: 13px; }
  .evd-brk { margin: 0 calc(-1 * var(--space-4)); padding: var(--space-2) var(--space-4) var(--space-3); display: flex; align-items: stretch; overflow-x: auto; overscroll-behavior-x: contain; }
  .evd-brk-col { flex: none; min-width: 148px; display: grid; gap: var(--space-2); align-content: start; }
  .evd-brk-col + .evd-brk-col { margin-left: var(--space-6); padding-left: var(--space-6); border-left: 1px solid var(--border-soft); }
  .evd-brk-h { margin: 0; font-size: var(--fs-caption); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
  .evd-m { display: grid; gap: var(--space-1); padding: var(--space-2) var(--space-3); background: var(--surface-warm); border: 1px solid var(--border); border-radius: var(--radius-sm); }
  .evd-m.is-final { border-color: color-mix(in srgb, var(--type-event) 50%, var(--border)); }
  .evd-m.is-win { background: color-mix(in srgb, var(--type-event) 10%, var(--surface-warm)); border-color: color-mix(in srgb, var(--type-event) 35%, var(--border)); }
  .evd-m-row { display: flex; align-items: center; gap: var(--space-2); font-size: var(--fs-meta); }
  .evd-m-row b { flex: 1; min-width: 0; font-weight: 500; color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .evd-m-row.is-out b { color: var(--muted); }
  .evd-m-row.is-win b { font-weight: 700; color: var(--fg); }
  .evd-m-row .scr { flex: none; font-family: var(--font-mono); font-weight: 600; color: var(--fg-2); font-variant-numeric: tabular-nums; }
  .evd-m-row.is-win .scr { color: var(--type-event); }
  .evd-m-note { font-size: var(--fs-caption); color: var(--muted); }

  /* ── Пьедестал ── */
  .evd-podium { display: flex; align-items: flex-end; justify-content: center; gap: var(--space-3); margin: 0 0 var(--space-3); }
  .evd-pod { flex: 1; display: grid; justify-items: center; gap: var(--space-1); }
  .evd-pod-name { font-size: var(--fs-caption); font-weight: 600; color: var(--fg-2); }
  .evd-pod-note { font-size: var(--fs-caption); color: var(--muted); }
  .evd-pod-bar { width: 100%; max-width: 76px; height: 32px; border-radius: var(--radius-sm) var(--radius-sm) 0 0; background: var(--muted); }
  .evd-pod.is-1 { order: 1; }
  .evd-pod.is-2 { order: 0; }
  .evd-pod.is-3 { order: 2; }
  .evd-pod.is-1 .evd-pod-bar { height: 56px; background: var(--type-event); }
  .evd-pod.is-2 .evd-pod-bar { height: 44px; background: var(--st-confirmed); }
  .evd-pod.is-3 .evd-pod-bar { height: 34px; background: var(--muted); }

  /* ── Участники / результаты: v2-канон .mrow (неинтерактивные строки) ── */
  .mrow.is-me { background: color-mix(in srgb, var(--accent) 6%, transparent); border-radius: var(--radius-md); }
  .evd-part-more { display: flex; margin: var(--space-3) auto 0; }

  /* ── Протокол забега: место-тайл + имя + время ── */
  .r-place {
    flex: none; width: 32px; height: 32px; border-radius: 10px;
    display: grid; place-items: center;
    font-size: var(--fs-meta); font-weight: 700; font-variant-numeric: tabular-nums;
    color: var(--fg-2); background: var(--surface-2);
  }
  .mrow.is-p1 .r-place { color: var(--yellow-ink-strong); background: var(--gto-gold); }
  .mrow.is-p2 .r-place { color: var(--accent-on); background: var(--gto-silver); }
  .mrow.is-p3 .r-place { color: var(--accent-on); background: var(--gto-bronze); }

  /* ── Ссылка на фотоотчёт: плашка-карточка → новость сообщества ── */
  .evd-news {
    display: flex; align-items: center; gap: var(--space-3);
    width: 100%; margin-top: var(--space-3);
    padding: var(--space-3) var(--space-4);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    text-align: left; font: inherit; color: inherit; cursor: pointer;
    transition: border-color var(--motion-fast) var(--ease-standard), background var(--motion-fast) var(--ease-standard);
  }
  .evd-news:hover { border-color: var(--border-strong); background: var(--surface-warm); }
  .evd-news:active { transform: scale(0.99); }
  .evd-news:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .evd-news-ic { flex: none; width: 44px; height: 44px; display: grid; place-items: center; border-radius: var(--radius-md); background: var(--surface-2); color: var(--fg-2); }
  .evd-news-ic svg { width: var(--icon-lg); height: var(--icon-lg); }
  .evd-news-tx { flex: 1; min-width: 0; }
  .evd-news-tx b { display: block; font-size: var(--fs-body); font-weight: 600; color: var(--fg); }
  .evd-news-tx span { display: block; margin-top: 1px; font-size: var(--fs-meta); color: var(--muted); }
  .evd-news-chev { flex: none; color: var(--meta); }
  .evd-news-chev svg { width: var(--icon-sm); height: var(--icon-sm); }

  /* ── Плашка над таббаром — DS .evd-bar.is-tabbed (ds.css) + ряд .bar-actions;
        локально только сдвиг тоста выше плашки ── */
  .evd-toast { bottom: calc(172px + env(safe-area-inset-bottom, 0px)); }

  /* ── Стадия: контент под текущую фазу (в табе «Обзор») ── */
  .ev-stage { padding-top: var(--space-3); }
  .ev-stage .stage-title { margin: 0; font-size: var(--fs-body); font-weight: 700; color: var(--fg); }
  .ev-stage .stage-sub { margin: var(--space-1) 0 0; font-size: var(--fs-meta); line-height: 1.4; color: var(--muted); }
  .ev-fact {
    display: flex; align-items: flex-start; gap: var(--space-3);
    margin-top: var(--space-4);
    padding: var(--space-3);
    border: 1px solid var(--border-soft); border-radius: var(--radius-md);
    background: var(--surface-warm);
  }
  .ev-fact + .ev-fact { margin-top: var(--space-2); }
  .ev-fact-ic {
    flex: none; width: 40px; height: 40px; border-radius: var(--radius-md);
    display: grid; place-items: center;
    background: var(--surface); color: var(--fg-2);
  }
  .ev-fact-ic svg { width: 20px; height: 20px; }
  .ev-fact-tx { min-width: 0; display: grid; gap: 1px; }
  .ev-fact-tx b { font-size: var(--fs-body); font-weight: 600; line-height: 1.3; color: var(--fg); }
  .ev-fact-tx span { font-size: var(--fs-meta); line-height: 1.35; color: var(--muted); }

  /* ── QR-код участника (канон referens/qrscan.html: рамка, белый фон, грид) ── */
  .ev-qr {
    width: 188px; height: 188px; margin: var(--space-4) auto 0;
    padding: 10px; border: 1px solid var(--border-soft); border-radius: var(--radius-md);
    background: #fff;
  }
  .ev-qr svg { width: 100%; height: 100%; display: block; }
  .ev-qr-cap { text-align: center; margin-top: var(--space-2); font-size: var(--fs-caption); line-height: 1.4; color: var(--meta); }

  /* ── Результат: крупный моноширинный формат ── */
  .ev-result { text-align: center; padding: var(--space-5) var(--space-4) var(--space-3); margin-bottom: var(--space-3); }
  .ev-result-time { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; color: var(--fg); font-variant-numeric: tabular-nums; }
  .ev-result-sub { margin-top: var(--space-1); font-size: var(--fs-meta); font-weight: 600; color: var(--muted); }
  .ev-result-badge { margin-top: var(--space-3); }

  /* ── Дорожка участия: 4 шага, вертикальная ось ── */
  .ev-steps { list-style: none; margin: 0; padding: 0; }
  .ev-step { display: flex; align-items: center; gap: var(--space-3); min-height: 36px; }
  .ev-node { position: relative; flex: none; width: 20px; align-self: stretch; display: flex; align-items: center; justify-content: center; }
  .ev-node::before {
    content: ""; position: absolute; top: 0; bottom: 0; left: 50%;
    width: 2px; transform: translateX(-50%); background: var(--border-soft);
  }
  .ev-step:first-child .ev-node::before { top: 50%; }
  .ev-step:last-child .ev-node::before { bottom: 50%; }
  .ev-dot {
    position: relative; z-index: 1; flex: none; width: 20px; height: 20px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--surface); border: 2px solid var(--border-strong);
  }
  .ev-dot svg { width: 11px; height: 11px; color: #fff; animation: dot-pop 160ms var(--ease-out); }
  .ev-step.is-done .ev-dot { background: var(--accent-purple); border-color: var(--accent-purple); animation: dot-done 240ms var(--ease-out); }
  .ev-step.is-current .ev-dot { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 12%, transparent); }
  .ev-step.is-cancel .ev-dot { border-color: var(--danger); color: var(--danger); font-size: 13px; font-weight: 700; }
  @keyframes dot-done { from { background: var(--surface); border-color: var(--border-strong); } to { background: var(--accent-purple); border-color: var(--accent-purple); } }
  @keyframes dot-pop { from { transform: scale(0.5); } to { transform: scale(1); } }
  .ev-step:has(+ .ev-step.is-done) .ev-node::before { top: 50%; bottom: 0; background: var(--accent-purple); }
  .ev-step.is-done + .ev-step .ev-node::before { top: 0; background: var(--accent-purple); }
  .ev-step.is-cancel + .ev-step .ev-node::before { top: 0; background: var(--danger); }
  .ev-step-name { font-size: 14px; font-weight: 600; line-height: 1.3; color: var(--fg-2); }
  .ev-step.is-done .ev-step-name { color: var(--fg); }
  .ev-step.is-current .ev-step-name { color: var(--accent); }
  .ev-step.is-cancel .ev-step-name { color: var(--danger); }

  .ev-num {
    display: inline-flex; align-items: center; gap: var(--space-2);
    margin-top: var(--space-3);
    font-size: var(--fs-meta); font-weight: 600; color: var(--meta);
    background: var(--surface-warm); border: 1px solid var(--border-soft);
    border-radius: var(--radius-pill); padding: var(--space-1) var(--space-4);
    font-variant-numeric: tabular-nums;
  }

  /* ── Шиты: опрос (радио-чипы) ── */
  .ev-q-group { margin-top: var(--space-4); }
  .ev-q-label { display: block; margin: 0 var(--space-1) var(--space-2); font-size: var(--fs-meta); font-weight: 600; color: var(--muted); }
  .ev-q-group:first-child { margin-top: 0; }
  .ev-q-group .chips { margin-top: 0; }
  .ev-q-note { margin-top: var(--space-2); font-size: var(--fs-caption); line-height: 1.45; color: var(--meta); text-align: center; }

  .ev-reset { margin-top: var(--space-4); text-align: center; }
  .ev-reset button {
    font: inherit; font-size: var(--fs-caption); font-weight: 600; color: var(--meta);
    background: none; border: none; padding: var(--space-1) var(--space-2);
    cursor: pointer; text-decoration: underline; text-underline-offset: 2px;
  }
  .ev-reset button:hover { color: var(--fg); }

  /* Меню «⋯» §4.17: цвет пунктов по намерению (в ДС v2 ещё не вынесено —
     для прототипа локально; кандидаты is-ok / is-danger для .sheet-item) */
  .sheet-item.is-ok .sheet-ic { color: var(--success); background: color-mix(in srgb, var(--success) 12%, var(--surface)); }
  .sheet-item.is-ok .sheet-il { color: var(--success); font-weight: 700; }
  .sheet-item.is-danger .sheet-ic { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, var(--surface)); }
  .sheet-item.is-danger .sheet-il { color: var(--danger); font-weight: 700; }
</style>
</head>

<script>
(function () {
  'use strict';
  var KEY = 'evt:marathon';
  function $(id) { return document.getElementById(id); }
  function qs(name) {
    var m = location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
    return m ? decodeURIComponent(m[1]) : null;
  }

  function load() {
    try { var s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }
    catch (e) { return null; }
  }
  function save(obj) {
    try { localStorage.setItem(KEY, JSON.stringify(obj)); } catch (e) { /* noop */ }
  }
  function reset() {
    try { localStorage.removeItem(KEY); } catch (e) { /* noop */ }
    location.reload();
  }

  var saved = load();
  var st = (saved && saved.status) || 'pending';
  var IS_CUP = qs('ev') === 'cup';

  /* ── Табы (JS: переключение .is-on + aria-selected) ── */
  function setTab(name) {
    document.querySelectorAll('.evd-tab').forEach(function (t) {
      var on = t.getAttribute('data-tab') === name;
      t.classList.toggle('is-on', on);
      t.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    document.querySelectorAll('.evd-pane').forEach(function (p) {
      p.classList.toggle('is-on', p.getAttribute('data-pane') === name);
    });
  }
  document.querySelectorAll('.evd-tab').forEach(function (t) {
    t.addEventListener('click', function () { setTab(t.getAttribute('data-tab')); });
  });

  /* ── Тост ── */
  var toastTimer = null;
  function toast(msg, points) {
    $('ev-toast-tx').textContent = msg;
    var pts = $('ev-toast').querySelector('.toast-warn');
    if (points == null) { pts.style.display = 'none'; }
    else { pts.style.display = ''; pts.lastChild.textContent = ' +' + points + ' баллов'; }
    $('ev-toast').classList.add('open');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $('ev-toast').classList.remove('open'); }, 2400);
  }

  /* ── Вход контента после пере-рендера (od-enter из ДС) ── */
  function reveal(el) {
    el.classList.remove('od-reveal');
    void el.offsetWidth;
    el.classList.add('od-reveal');
  }

  /* ── Шиты ── */
  var scrim = $('scrim');
  function openSheet(el) { scrim.classList.add('open'); el.classList.add('open'); }
  function closeSheets() { scrim.classList.remove('open'); document.querySelectorAll('.sheet.open').forEach(function (s) { s.classList.remove('open'); }); }
  scrim.addEventListener('click', closeSheets);
  document.querySelectorAll('.js-close').forEach(function (b) { b.addEventListener('click', closeSheets); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheets(); });

  function initials(name) {
    return name.split(/\s+/).map(function (w) { return w.charAt(0); }).slice(0, 2).join('').toUpperCase();
  }

  function avatar(name, sm, cls) {
    return '<span class="' + (sm ? 'avatar-sm' : 'avatar') + ' is-tint' + (cls ? ' ' + cls : '') + '">' + initials(name) + '</span>';
  }

  function factRow(ic, b, s) {
    return '<div class="ev-fact"><span class="ev-fact-ic" aria-hidden="true"><svg><use href="#' + ic + '"></use></svg></span>' +
      '<span class="ev-fact-tx"><b>' + b + '</b><span>' + s + '</span></span></div>';
  }
  function btn(label, cls, act) {
    return '<button type="button" class="btn ' + cls + '" data-act="' + act + '">' + label + '</button>';
  }

  /* ════════════════════════════════════════════════════════════════════
     ТУРНИР-ПРИМЕР «Летний Кубок» (второй полюс event_details).
     Только демо-данные: статус «Завершено» → фаза «после» (матрица).
     Состав табов: Обзор / Сетка / Результаты / Участники.
     ════════════════════════════════════════════════════════════════════ */
  var CUP = {
    title: 'Летний Кубок · финал',
    chip: 'Событие СП · турнир',
    dot: 'ic-trophy',
    pill: ['Завершено', 'var(--st-done)', ''],
    rows: [
      ['ic-cal', 'Сб, 21 авг · 11:00–18:00', 'Регламент расписан на весь день'],
      ['ic-map-pin', 'Стадион «Труд»', 'теннис · корты 1–4'],
      ['ic-users', '24 участника', 'максимум 32 · жеребьёвка при 16+']
    ],
    note: 'Турнир по теннису среди жителей посёлка. Участие свободное, инвентарь предоставляется. Победитель получает переходящий кубок.',
    org: ['Спорткомитет поселения', 'Организатор · на месте с 09:30'],
    rego: [
      ['11:00', 'Открытие и жеребьёвка'],
      ['11:30', 'Групповой этап · корты 1–2'],
      ['15:00', 'Плей-офф'],
      ['17:30', 'Финал и награждение']
    ],
    podium: [
      { place: 'is-2', name: 'Егор П.', note: '2 · серебро', c: 'var(--st-confirmed)' },
      { place: 'is-1', name: 'Анна К.', note: '1 · кубок и медаль', c: 'var(--type-event)' },
      { place: 'is-3', name: 'Дмитрий С.', note: '3 · бронза', c: 'var(--muted)' }
    ],
    parts: [
      { n: 'Вы', f: 'записались сегодня в 09:12', tag: 'Записан', c: 'var(--st-confirmed)', you: true },
      { n: 'Спорткомитет поселения', f: 'Организатор', tag: 'Организатор', c: 'var(--type-event)' },
      { n: 'Анна К.', f: '1 место · кубок', tag: 'Победитель', c: 'var(--st-confirmed)' },
      { n: 'Егор П.', f: '2 место · серебро', tag: 'Финалист', c: 'var(--st-confirmed)' },
      { n: 'Дмитрий С.', f: '3 место · бронза', tag: 'Финалист', c: 'var(--muted)' },
      { n: 'Мария В.', f: 'выбыла в 1/2 финала', tag: 'Участник', c: 'var(--muted)' }
    ],
    menu: [
      { act: 'news', ic: 'ic-photo', il: 'Фотоотчёт в новости', ih: 'Как прошёл турнир — фото и итоги' },
      { act: 'share', ic: 'ic-users', il: 'Поделиться', ih: 'Отправить участникам сообщества' },
      { act: 'add-cal', ic: 'ic-cal', il: 'Добавить в календарь', ih: 'Событие появится в расписании' }
    ]
  };

  function renderRows(rows) {
    $('evd-rows').innerHTML = rows.map(function (r) {
      return '<div class="evd-row"><span class="evd-ric" style="--c:var(--type-event)" aria-hidden="true"><svg><use href="#' + r[0] + '"></use></svg></span>' +
        '<div class="evd-rtx"><b>' + r[1] + '</b><span>' + r[2] + '</span></div></div>';
    }).join('');
  }

  function renderCup() {
    $('evd-title').textContent = CUP.title;
    $('evd-chip-tx').textContent = CUP.chip;

    var pill = CUP.pill;
    var p = $('ev-pill');
    p.textContent = pill[0];
    p.style.setProperty('--c', pill[1]);
    p.className = 'ev-status' + (pill[2] ? ' ' + pill[2] : '');

    /* табы: + Сетка */
    var tb = $('evd-tabbar');
    tb.innerHTML =
      '<button type="button" class="evd-tab is-on" role="tab" aria-selected="true" data-tab="obzor">Обзор</button>' +
      '<button type="button" class="evd-tab" role="tab" aria-selected="false" data-tab="setka">Сетка</button>' +
      '<button type="button" class="evd-tab" role="tab" aria-selected="false" data-tab="res">Результаты</button>' +
      '<button type="button" class="evd-tab" role="tab" aria-selected="false" data-tab="part">Участники</button>';
    tb.querySelectorAll('.evd-tab').forEach(function (t) {
      t.addEventListener('click', function () { setTab(t.getAttribute('data-tab')); });
    });

    var body = document.querySelector('.evd-pane[data-pane="part"]');
    body.insertAdjacentHTML('afterend',
      '<div class="evd-pane" data-pane="setka" role="tabpanel">' + bracketHTML() + '</div>');

    renderRows(CUP.rows);
    $('evd-note').textContent = CUP.note;
    $('evd-flow').innerHTML =
      '<div class="card"><h5 class="evd-sec-t">Регламент</h5>' +
      '<div class="evd-rego">' + CUP.rego.map(function (r, i) {
        return '<div class="evd-rego-row"><span class="evd-rego-time">' + r[0] + '</span><span class="evd-rego-dot' + (i ? ' is-next' : '') + '"></span><span>' + r[1] + '</span></div>';
      }).join('') + '</div>' +
      '<div class="evd-org">' + avatar(CUP.org[0], true) +
        '<div class="evd-org-tx"><b>' + CUP.org[0] + '</b><span>' + CUP.org[1] + '</span></div></div></div>';

    /* фаза «после»: фотоотчёт — ссылка на новость сообщества */
    $('ev-stage').innerHTML =
      '<div class="ev-fact"><span class="ev-fact-ic" aria-hidden="true"><svg><use href="#ic-photo"></use></svg></span>' +

  /* ════════════════════════════════════════════════════════════════════

    var WHO = [

    var RESULTS = [
      { p: 1, n: 'Алексей Морозов', f: 'клуб «Волна»', r: '1:14:52', pts: 100 },

    ];

    var FACT_DONE = {
      id: 'evt-marathon', title: 'Осенний полумарафон', when: 'Сб, 30 авг · 08:00–12:00',

          factRow('ic-qr', 'Стартовый номер 54', 'Иван Петров · участник марафона') +
          factRow('ic-bell', 'Напоминание за 30 минут', 'Включено · 07:30, 30 августа') +
          factRow('ic-star', 'За участие начислят +50 баллов', 'значок «Участник марафона» · после финиша') +

      }
      if (st === 'ongoing') {
        return '<div class="card"><p class="stage-title">Марафон идёт</p>' +
          '<p class="stage-sub">Покажите QR-код на входе в стартовый городок — так подтвердится ваше участие. После финиша заполните опрос.</p>' +
          factRow('ic-flag', 'Дистанция открыта', '08:00–12:00 · два пункта воды') +

          '<div class="ev-qr" id="ev-qr"></div>' +
          '<p class="ev-qr-cap">QR-код участника · обновляется каждые 3 минуты</p>' +

      if (st === 'done') {
        return '<div class="ev-result">' +

          '<div class="ev-result-sub">124-е место из 487</div>' +
          '<span class="gchip is-sign ev-result-badge" style="--c: var(--type-event)"><span class="dot" aria-hidden="true"></span>Участие в соревновании</span>' +
          '</div>' +
          '<div class="card">' +
          factRow('ic-qr', 'Подтверждено по QR при входе', 'вход в стартовый городок · 08:12') +

    function barHTML() {
      if (st === 'pending') {
        return '<div class="bar-actions">' +
          btn('Принять', 'btn-accent', 'accept') +
          btn('Отклонить', 'btn-ghost', 'decline') +
          '</div>';
      }
      if (st === 'confirmed') {
        return '<div class="bar-actions">' +
          btn('Кто идёт', 'btn-ghost', 'who') +
          btn('Добавить в календарь', 'btn-accent', 'add-cal') +
          '</div>';
      }
      if (st === 'ongoing') {
        return '<div class="bar-actions">' + btn('Я финишировал — опрос', 'btn-accent', 'survey') + '</div>';
      }
      if (st === 'done') {
        return '<div class="bar-actions">' +
          btn('Читать новость', 'btn-accent', 'news') +
          btn('В журнал активностей', 'btn-ghost', 'open-log') +
          '</div>';
      }
      /* cancelled */
      return '<div class="bar-actions">' + btn('Вернуть приглашение', 'btn-ghost', 'reset') + '</div>';

    function render() {
      var pill = PILL[st];
      var p = $('ev-pill');
      p.textContent = pill[0];
      p.style.setProperty('--c', pill[1]);
      p.className = 'ev-status' + (pill[2] ? ' ' + pill[2] : '');
      p.classList.remove('is-pending');
      if (pill[2] === 'is-pending') p.classList.add('is-pending');

      renderRows(ROWS_MAR);
      $('evd-note').textContent = 'Забег на 21,1 км по центральным улицам посёлка. Для участников — пункты воды и награждение финишёров.';

      var steps = [
        { key: 'pending', label: 'Приглашение' },
        { key: 'confirmed', label: 'Подтверждение' },
        { key: 'ongoing', label: 'QR-вход' },
        { key: 'done', label: 'Опрос и итог' }
      ];
      $('evd-flow').innerHTML =
        '<div class="card"><h5 class="evd-sec-t">Дорожка участия</h5>' +
        '<ul class="ev-steps" id="ev-steps">' + steps.map(function (s) {
          return '<li class="ev-step" data-step="' + s.key + '"><span class="ev-node"><span class="ev-dot"></span></span><span class="ev-step-name">' + s.label + '</span></li>';
        }).join('') + '</ul></div>';

      var rank = { pending: 0, confirmed: 1, ongoing: 2, done: 3, cancelled: 0 };
      var cur = rank[st];
      var list = $('ev-steps');
      list.querySelectorAll('.ev-step').forEach(function (li, i) {
        li.className = 'ev-step';
        if (st === 'cancelled') {
          if (i === 0) li.classList.add('is-cancel');
          return;
        }
        if (i < cur) li.classList.add('is-done');
        if (i === cur) li.classList.add('is-current');
        var dot = li.querySelector('.ev-dot');
        if (i < cur) dot.innerHTML = '<svg aria-hidden="true"><use href="#ic-check"></use></svg>';
        else if (st === 'cancelled' && i === 0) dot.textContent = '!';
        else dot.textContent = '';
      });

      $('ev-stage').innerHTML = stageHTML();
      if (st === 'ongoing') buildQR();

      renderResults();
      renderPartsMarathon();

      $('evd-bar').innerHTML = barHTML();
      reveal($('ev-stage'));
      reveal($('evd-bar'));
    }

    /* ── QR (канон referens/qrscan.html: сидированный грид 21×21) ── */
    var qrBuilt = false;
    function buildQR() {
      if (qrBuilt) return;
      qrBuilt = true;
      var cells = '';
      var seed = 42;
      function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed; }
      var n = 21;
      for (var y = 0; y < n; y++) {
        for (var x = 0; x < n; x++) {
          var finder = (x < 7 && y < 7) || (x >= n - 7 && y < 7) || (x < 7 && y >= n - 7);
          var on = finder ? ((x % 4 === 0 || y % 4 === 0)) : (rnd() % 3 !== 0);
          if (on) cells += '<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="#12213b"/>';
        }
      }
      $('ev-qr').innerHTML =
        '<svg viewBox="0 0 21 21" shape-rendering="crispEdges" role="img" aria-label="QR-код участника марафона">' + cells + '</svg>';
    }

    /* ── Опрос ── */
    var q1v = 'Нормальное', q2v = 'В мою силу';
    document.querySelectorAll('#q1 .pick-chip, #q2 .pick-chip').forEach(function (c) {
      c.addEventListener('click', function () {
        var group = c.parentNode;
        group.querySelectorAll('.pick-chip').forEach(function (x) { x.classList.remove('is-on'); });
        c.classList.add('is-on');
        if (group.id === 'q1') q1v = c.getAttribute('data-v');
        else q2v = c.getAttribute('data-v');
      });
    });
    $('btn-survey').addEventListener('click', function () {
      closeSheets();
      save({
        status: 'done',
        q1: q1v, q2: q2v,
        fact: FACT_DONE
      });
      st = 'done';
      render();
      toast('Участие в марафоне зафиксировано · запись в журнале', 50);
    });

    function handle(act) {
      switch (act) {
        case 'accept':
          save({ status: 'confirmed' });
          st = 'confirmed';
          render();
          toast('Участие подтверждено · стартовый номер 54');
          break;
        case 'decline':
          save({ status: 'cancelled' });
          st = 'cancelled';
          render();
          toast('Участие отменено');
          break;
        case 'who':
          setTab('part');
          break;
        case 'results':
          setTab('res');
          break;
        case 'share':
          toast('Ссылка на событие скопирована');
          break;
        case 'add-cal':
          toast('Событие добавлено в календарь');
          break;
        case 'qr':
          setTab('obzor');
          render();
          toast('QR-код участника показан');
          break;
        case 'survey':
          openSheet($('survey-sheet'));
          break;
        case 'open-log':
          location.href = 'activities.html';
          break;
        case 'news':
          location.href = 'news.html?id=n1';
          break;
        case 'reset':
          reset();
          break;
      }
    }

    $('btn-more').addEventListener('click', function () {
      var items = MENU[st] || [];
      if (!items.length) { toast('Для этого статуса действий нет'); return; }
      renderMenu(items);
      openSheet($('menu-sheet'));
    });
    $('menu-list').addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('[data-act]') : null;
      if (!b) return;
      closeSheets();
      handle(b.getAttribute('data-act'));
    });
    $('evd-bar').addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('[data-act]') : null;
      if (b) handle(b.getAttribute('data-act'));
    });
    $('ev-stage').addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('[data-act]') : null;
      if (b) handle(b.getAttribute('data-act'));
    });
    $('btn-reset').addEventListener('click', reset);
    document.querySelectorAll('.tabbar [data-toast]').forEach(function (b) {
      b.addEventListener('click', function () { toast(b.getAttribute('data-toast'), null); });
    });

    render();
    if (autoStarted) toast('Забег стартовал · QR-вход открыт');
    return;
  }

  /* ── Куп: обработчики действий ── */
  $('menu-list').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b) return;
    closeSheets();
    var act = b.getAttribute('data-act');
    if (act === 'news') location.href = 'news.html?id=n1';
    else if (act === 'share') toast('Ссылка на событие скопирована');
    else if (act === 'add-cal') toast('Событие добавлено в календарь');
  });
  $('evd-bar').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b) return;
    var act = b.getAttribute('data-act');
    if (act === 'news') location.href = 'news.html?id=n1';
    else if (act === 'share') toast('Ссылка на событие скопирована');
  });
  $('btn-share').addEventListener('click', function () { toast('Ссылка на событие скопирована'); });
  document.querySelectorAll('.tabbar [data-toast]').forEach(function (b) {
    b.addEventListener('click', function () { toast(b.getAttribute('data-toast'), null); });
  });

  renderCup();
})();
</script>
</body>
</html>
