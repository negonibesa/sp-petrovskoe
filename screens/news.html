<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Новость</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/ds.css">
<style>
  /* Деталка новости — подэкран Сообщества (§6.5). Канон: .topbar, .card,
     .mrow, .btn, .tabbar. Герой-фото — цветной блок с иконкой (нет фото-ассетов). */
  .nw-hero {
    position: relative; display: grid; place-items: center; gap: var(--space-2);
    height: 172px; border-radius: var(--radius-lg);
    color: #fff; overflow: hidden; text-align: center;
  }
  .nw-hero-ic {
    width: 56px; height: 56px; display: grid; place-items: center;
    border-radius: 50%; background: color-mix(in srgb, #fff 18%, transparent);
  }
  .nw-hero-ic svg { width: 28px; height: 28px; }
  .nw-hero b { font-size: var(--fs-meta); font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; }
  .nw-meta { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; margin-top: var(--space-3); }
  .nw-title { margin: var(--space-2) 0 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; color: var(--fg); }
  .nw-body { margin: var(--space-3) 0 0; display: grid; gap: var(--space-3); }
  .nw-body p { margin: 0; font-size: var(--fs-body); line-height: 1.55; color: var(--fg-2); }
  .nw-acts { display: flex; gap: var(--space-2); margin-top: var(--space-5); }
  .nw-acts .btn { flex: 1; }
  .nw-like.is-liked { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--border)); background: color-mix(in srgb, var(--danger) 8%, var(--surface)); }
</style>
</head>
<body data-od-id="news-screen">
<svg style="position:absolute;width:0;height:0;overflow:hidden" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="ic-home" viewBox="0 0 24 24"><path d="M20 17.3702V10.3353C20 9.24543 19.5203 8.21325 18.6935 7.52387L14.249 3.81841C12.9402 2.72719 11.0598 2.7272 9.75099 3.81841L5.30654 7.52387C4.47968 8.21325 4 9.24543 4 10.3353V17.3702C4 19.3749 5.59188 21 7.55556 21H16.4444C18.4081 21 20 19.3749 20 17.3702Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"></path><path d="M10 17H14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></symbol>
  <symbol id="ic-events" viewBox="0 0 24 24"><path d="M8.4 5.7L7.5 3M15.6 5.7L16.5 3M20.55 9.3H3.45M3 9.9003C3 6.834 5.4174 4.35 8.4 4.35H15.6C18.5826 4.35 21 6.834 21 9.9003V15.4497C21 18.516 18.5826 21 15.6 21H8.4C5.4174 21 3 18.516 3 15.4497V9.9003Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></symbol>
  <symbol id="ic-dumbbell" viewBox="0 0 24 24"><rect x="3" y="9" width="3.2" height="6" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.7"></rect><rect x="17.8" y="9" width="3.2" height="6" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.7"></rect><path d="M6.2 12h11.6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"></path></symbol>
  <symbol id="ic-users" viewBox="0 0 24 24"><path d="M2.40039 22.8002C2.67639 19.3166 5.61759 16.4066 9.22599 16.2362C9.52999 16.2218 9.85479 16.2098 10.2004 16.2002L11.17 16.2626C12.8062 16.3624 14.3637 16.9998 15.6004 18.0758M17.4004 11.9954C18.9596 12.1416 20.4312 12.7824 21.6004 13.8242M17.986 8.4002C18.5424 8.04805 19.0006 7.56074 19.3179 6.98371C19.6352 6.40667 19.8012 5.7587 19.8004 5.1002C19.8004 2.9462 18.0604 1.2002 15.9124 1.2002C14.8576 1.2002 13.9012 1.6214 13.2004 2.3054M14.1004 9.3002C14.1004 10.3345 13.6895 11.3265 12.9581 12.0579C12.2267 12.7893 11.2347 13.2002 10.2004 13.2002C9.16605 13.2002 8.17407 12.7893 7.44267 12.0579C6.71128 11.3265 6.30039 10.3345 6.30039 9.3002C6.30039 8.26585 6.71128 7.27387 7.44267 6.54248C8.17407 5.81109 9.16605 5.4002 10.2004 5.4002C11.2347 5.4002 12.2267 5.81109 12.9581 6.54248C13.6895 7.27387 14.1004 8.26585 14.1004 9.3002Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></symbol>
  <symbol id="ic-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></circle><path d="M5.5 19.5c0-3.1 2.9-5.2 6.5-5.2s6.5 2.1 6.5 5.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></symbol>
  <symbol id="ic-chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></symbol>
  <symbol id="ic-like" viewBox="0 0 24 24"><path d="M7 10v12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></symbol>
  <symbol id="ic-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.7"></circle><path d="M12 7.5V12l3 2.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></symbol>
  <symbol id="ic-photo" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></rect><circle cx="12" cy="13" r="3.6" fill="none" stroke="currentColor" stroke-width="1.7"></circle><path d="M8.5 7l1.5-2.5h4L15.5 7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></symbol>
  <symbol id="ic-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></symbol>
  <symbol id="ic-trend-up" viewBox="0 0 24 24"><path d="M3.5 17l6-6 4 4 7-7.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path><path d="M14.5 7.5h6v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></symbol>
  <symbol id="ic-share" viewBox="0 0 24 24"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path><path d="M12 15V3M7.5 7.5 12 3l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></symbol>
</svg>

<div class="app">
  <header class="topbar" data-od-id="nw-header">
    <a class="topbar-ic is-back" href="community.html" aria-label="Назад"><svg aria-hidden="true"><use href="#ic-chev"></use></svg></a>
    <h4 class="topbar-tx">Новость</h4>
    <span class="topbar-ic" aria-hidden="true"></span>
  </header>

  <main class="body" data-od-id="nw-body">
    <div class="nw-hero" id="nw-hero" data-od-id="nw-hero">
      <span class="nw-hero-ic" aria-hidden="true"><svg><use href="#ic-photo"></use></svg></span>
      <b id="nw-hero-label">Новость</b>
    </div>

    <div class="nw-meta" id="nw-meta" data-od-id="nw-meta">
      <span class="news-date"><svg aria-hidden="true"><use href="#ic-clock"></use></svg><span id="nw-date">12 Августа</span></span>
      <span class="news-tags" id="nw-tags"></span>
    </div>

    <h1 class="nw-title" id="nw-title">Новость</h1>

    <div class="nw-body" id="nw-text"></div>

    <div class="nw-acts">
      <button class="btn btn-ghost" type="button" id="nw-like" data-od-id="nw-like"><svg aria-hidden="true"><use href="#ic-like"></use></svg><span id="nw-like-cnt">0</span></button>
      <button class="btn btn-ghost" type="button" data-toast="Поделиться — в следующей итерации" data-od-id="nw-share"><svg aria-hidden="true"><use href="#ic-share"></use></svg>Поделиться</button>
    </div>

    <div style="height: var(--space-6)"></div>

    <section class="sec" id="nw-related" data-od-id="nw-related" hidden>
      <div class="sec-head"><h2>По теме</h2></div>
      <div id="nw-related-rows"></div>
    </section>
  </main>

  <nav class="tabbar tabbar--icons" data-od-id="tabbar" aria-label="Разделы">
    <a class="tab" href="06-home.html" aria-label="Главная"><span class="tab-ic"><svg aria-hidden="true"><use href="#ic-home"></use></svg></span></a>
    <a class="tab" href="07-calendar.html" aria-label="Расписание"><span class="tab-ic"><svg aria-hidden="true"><use href="#ic-events"></use></svg></span></a>
    <a class="tab" href="activities.html" aria-label="Активности"><span class="tab-ic"><svg aria-hidden="true"><use href="#ic-dumbbell"></use></svg></span></a>
    <button class="tab is-on" type="button" aria-label="Сообщество"><span class="tab-ic"><svg aria-hidden="true"><use href="#ic-users"></use></svg></span></button>
    <a class="tab" href="profile.html" aria-label="Профиль"><span class="tab-ic"><svg aria-hidden="true"><use href="#ic-user"></use></svg></span></a>
  </nav>
</div>

<div class="evd-toast" id="toast" role="status" aria-live="polite">
  <div class="toast-row">
    <div class="toast toast-info"><span class="t-ico"><svg aria-hidden="true"><use href="#ic-check"></use></svg></span><span id="toast-tx">Готово</span></div>
  </div>
</div>

<script>
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  var NEWS = {
    n1: {
      t: 'Как прошёл забег «Петровские холмы»', date: '12 Августа', tags: ['забег', 'итоги'], likes: 47, photo: true,
      grad: 'linear-gradient(135deg, #3b7bff, #9175e8)', label: 'Фотоотчёт',
      body: ['12 августа на трассе центрального парка собрались 487 участников. Личный зачёт на 5 и 10 км, детские старты и командный забег клубов.',
             'Дмитрий Орлов из клуба любителей бега финишировал вторым на дистанции 10 км с результатом 3:42:11. Победители получили значки и баллы в рейтинге за 1/2/3 место.'],
      club: 'c4', evLabel: 'Событие · Забег «Петровские холмы»', evTo: '15-event-marathon.html'
    },
    n2: {
      t: 'Новое покрытие на летней площадке', date: '12 Августа', tags: ['футбол'], likes: 32, photo: false,
      grad: 'linear-gradient(135deg, #3ab5ad, #3b7bff)', label: 'Инфраструктура',
      body: ['Ремонт завершён: беговые дорожки и зона разминки снова открыты для всех.',
             'Резиновое покрытие уложено на стадионе «Юность», разметка футбольного поля обновлена к сезону.'],
      event: null, club: null
    },
    n3: {
      t: 'Открыт набор в секцию плавания', date: '8 Августа', tags: ['плавание'], likes: 18, photo: false,
      grad: 'linear-gradient(135deg, #3b7bff, #2f4fd8)', label: 'Набор',
      body: ['Секция плавания набирает группы для детей 8–12 лет и взрослых. Тренировки — в бассейне «Волна».',
             'Запись у администратора комплекса или через приложение. Первое занятие — знакомство с тренером.'],
      club: 'c5'
    },
    n4: {
      t: 'Турнир по бадминтону', date: '12 Августа', tags: ['новость', 'турнир'], likes: 9, photo: false,
      grad: 'linear-gradient(135deg, #f472b6, #9175e8)', label: 'Соревнование',
      body: ['18 августа в зале №1 — открытый турнир по бадминтону. Участие свободное, сетка — по рейтингу на месте.',
             'Победитель получит абонемент на месяц. Регистрация — в карточке события.'],
      evLabel: 'Событие · Турнир по бадминтону', evTo: '07-calendar.html'
    },
    n5: {
      t: '«Пульс» открыл набор на утренние тренировки', date: '6 Августа', tags: ['фитнес'], likes: 21, photo: false,
      grad: 'linear-gradient(135deg, #9175e8, #3b7bff)', label: 'Клуб «Пульс»',
      body: ['Клуб «Пульс» открыл утренний поток: понедельник, среда и пятница в 07:30 в ФОК «Ритм».',
             'Первая неделя — бесплатно для участников клуба. Группа до 20 человек, тренер — Анна Смирнова.'],
      club: 'c1'
    },
    n6: {
      t: 'Итоги недели: рейтинг и баллы', date: '5 Августа', tags: ['система'], likes: 14, photo: false,
      grad: 'linear-gradient(135deg, #e6a800, #ff7a3b)', label: 'Рейтинг',
      body: ['Андрей Соколов поднялся на 12-е место в регионе (+2 за неделю). Серия посещений — 6 дней.',
             'Полная история начислений и правила — в разделе «Баллы и рейтинг».'],
      rating: true
    },
    n7: {
      t: 'Лыжная база «Красная горка» готова к сезону', date: '4 Августа', tags: ['лыжи'], likes: 13, photo: false,
      grad: 'linear-gradient(135deg, #a9b6c9, #6b7f9e)', label: 'Лыжный клуб',
      body: ['Обновлён инвентарь проката и открыта запись на смазку. Групповые выезды — по субботам.',
             'Для участников лыжного клуба — приоритетная запись на слоты с 1 сентября.'],
      club: 'c3'
    }
  };

  var CLUBS = {
    c1: 'Клуб «Пульс»', c3: 'Лыжный клуб', c4: 'Клуб любителей бега', c5: 'Секция плавания'
  };

  var q = new URLSearchParams(location.search).get('id') || 'n1';
  var item = NEWS[q] || NEWS.n1;

  var liked = false;

  $('nw-hero').style.background = item.grad;
  $('nw-hero-label').textContent = item.label;
  $('nw-date').textContent = item.date;
  $('nw-title').textContent = item.t;
  $('nw-tags').innerHTML = item.tags.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('');
  $('nw-text').innerHTML = item.body.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('');
  $('nw-like-cnt').textContent = item.likes;

  var related = [];
  if (item.club && CLUBS[item.club]) {
    related.push({ href: 'club.html?id=' + item.club, ic: 'ic-users', t: 'Клуб', s: CLUBS[item.club] });
  }
  if (item.evTo) {
    related.push({ href: item.evTo, ic: 'ic-events', t: 'Событие', s: item.evLabel });
  }
  if (item.rating) {
    related.push({ href: 'rating-details.html', ic: 'ic-trend-up', t: 'Баллы и рейтинг', s: 'Место и история начислений' });
  }
  if (related.length) {
    $('nw-related').hidden = false;
    $('nw-related-rows').innerHTML = related.map(function (r) {
      return '<a class="card card-link" href="' + r.href + '" data-od-id="nw-rel">' +
        '<span class="mrow-media" style="--c:var(--accent)" aria-hidden="true"><svg><use href="#' + r.ic + '"></use></svg></span>' +
        '<span class="mrow-tx"><span class="mrow-t">' + esc(r.s) + '</span><span class="mrow-s">' + esc(r.t) + '</span></span>' +
        '<span class="mrow-chev"><svg aria-hidden="true"><use href="#ic-chev"></use></svg></span></a>';
    }).join('');
  }

  $('nw-like').addEventListener('click', function () {
    liked = !liked;
    var b = $('nw-like');
    b.classList.toggle('is-liked', liked);
    $('nw-like-cnt').textContent = item.likes + (liked ? 1 : 0);
    toast(liked ? 'Нравится' : 'Убрано из «Нравится»');
  });

  var toastTimer;
  function toast(tx) {
    $('toast-tx').textContent = tx;
    var row = $('toast').querySelector('.toast');
    row.className = 'toast toast-info';
    $('toast').classList.add('open');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $('toast').classList.remove('open'); }, 2400);
  }

  document.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('[data-toast]') : null;
    if (btn) toast(btn.getAttribute('data-toast'));
  });
</script>
</body>
</html>
