<style>
  /* Экран «Поиск» — глобальный поиск по платформе (вход — иконка
     в шапке главной). Модель: referens/search.html (альфа-версия) —
     взят подход (стартовое состояние, чипы-фильтры со счётчиками,
     группировка результатов, синк q/f в URL), переписан на ДС v2.
     Компоненты: .topbar, .search-field, .fchip, .mrow, .empty, .evd-toast. */
  .sr-app { background: var(--surface); padding-bottom: 32px; }

  .sr-field { width: 100%; }
  .sr-clear {
    flex: none; width: 40px; height: 40px; padding: 0; margin-right: 2px;
    border: 0; border-radius: 50%; background: none; color: var(--meta);
    display: grid; place-items: center; cursor: pointer;
    transition: background var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
  }
  .sr-clear svg { width: var(--icon-sm); height: var(--icon-sm); }
  .sr-clear:hover { background: var(--surface-2); color: var(--fg-2); }
  .sr-clear:focus-visible { outline: none; box-shadow: var(--focus-ring); }

  .body > .chips.sr-filters { margin-top: var(--space-3); }

  .fchip .cnt {
    display: grid; place-items: center; min-width: 18px; height: 18px;
    padding: 0 var(--space-1); border-radius: var(--radius-pill);
    background: var(--surface-2); color: var(--muted);
    font-size: var(--fs-caption); font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .fchip.is-on .cnt { background: color-mix(in srgb, var(--accent-on) 26%, transparent); color: var(--accent-on); }

  .chips.sr-quick { padding-bottom: var(--space-2); }

  .sr-group {
    display: flex; align-items: center; gap: var(--space-2);
    margin: var(--space-4) 0 var(--space-2);
  }
  .sr-group:first-child { margin-top: var(--space-3); }
  .sr-group span {
    font-family: var(--font-display); font-size: var(--fs-caption); font-weight: 700;
    letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--muted);
    white-space: nowrap;
  }
  .sr-group::after { content: ""; flex: 1; height: 1px; background: var(--border-soft); }

  .sr-rows { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-1); }
  .sr-rows .mrow { min-height: 60px; }

  .sr-media {
    background: color-mix(in srgb, var(--c, var(--accent)) 14%, var(--surface));
    color: var(--c, var(--accent));
  }
  .sr-media svg { color: currentColor; }

  .sr-tag {
    flex: none; display: inline-flex; align-items: center;
    font-size: var(--fs-caption); font-weight: 700; white-space: nowrap;
    color: color-mix(in oklab, var(--c) 55%, var(--fg));
    background: color-mix(in srgb, var(--c) 13%, var(--surface));
    border-radius: var(--radius-pill); padding: 2px var(--space-2);
  }

  .sr-count { margin: var(--space-1) 0 var(--space-3); font-size: var(--fs-meta); color: var(--muted); }
  .sr-count b { color: var(--fg-2); font-weight: 700; }

  .sr-cats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-2); }
  .sr-cat {
    display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-1);
    text-align: left; padding: var(--space-3); border: 1px solid var(--border);
    border-radius: var(--radius-md); background: var(--surface); color: inherit; cursor: pointer;
    transition: border-color var(--motion-fast) var(--ease-standard), transform var(--motion-fast) var(--ease-standard);
  }
  .sr-cat:hover { border-color: var(--border-strong); }
  .sr-cat:active { transform: scale(0.99); }
  .sr-cat:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .sr-cat-ic {
    flex: none; width: 36px; height: 36px; margin-bottom: var(--space-1);
    display: grid; place-items: center; border-radius: var(--radius-md);
    color: var(--c); background: color-mix(in srgb, var(--c) 14%, var(--surface));
  }
  .sr-cat-ic svg { width: var(--icon-sm); height: var(--icon-sm); }
  .sr-cat-tx { display: flex; flex-direction: column; gap: 2px; }
  .sr-cat b { font-size: var(--fs-meta); font-weight: 700; color: var(--fg); }
  .sr-cat small { font-size: var(--fs-caption); color: var(--meta); line-height: 1.35; }
  .sr-cat.is-wide { grid-column: 1 / -1; flex-direction: row; align-items: center; gap: var(--space-3); }
  .sr-cat.is-wide .sr-cat-ic { margin-bottom: 0; }

  .sr-empty { margin-top: var(--space-2); }
</style>

  /* Категории в фиксированном порядке вывода. */

  /* Модель данных: названия и цвета — канон платформы (типы §4.18,
     ГТО-знаки, клубы §6.5, челленджи — слой вовлечения вне расписания). */

    { id: 'e1',  type: 'event',     title: 'Забег «Петровские холмы»', meta: '12 авг · 09:00 · Центральный парк', tag: 'Открыта запись', tagC: 'var(--st-open)', ic: 'ic-events', to: '07-calendar.html' },

    { id: 'p1',  type: 'person',    title: 'Дмитрий Орлов', meta: 'Бег · ГТО', tag: 'Серебро', tagC: 'var(--gto-silver)', c: 'var(--accent)', to: 'profile-view.html?id=p1' },
    { id: 'p2',  type: 'person',    title: 'Мария К.', meta: 'Бег · ГТО', tag: 'Друг', tagC: 'var(--accent)', c: 'var(--accent-purple)', to: 'profile-view.html?id=p2' },

  var BY_ID = {};
  ITEMS.forEach(function (it) { BY_ID[it.id] = it; });

  var QUICK = [
    { icon: 'ic-users', q: 'Волейбол' },
    { icon: 'ic-target', q: 'ГТО' },
    { icon: 'ic-sneaker', q: 'Плавание' },
    { icon: 'ic-trend', q: 'Бег' }
  ];

  var CATS = [
    { key: 'event', label: 'События', hint: 'По датам и статусам', icon: 'ic-events', c: 'var(--type-event)' },
    { key: 'training', label: 'Тренировки', hint: 'Расписание и запись', icon: 'ic-sneaker', c: 'var(--type-training)' },
    { key: 'person', label: 'Люди', hint: 'Друзья и участники', icon: 'ic-users', c: 'var(--accent)' },
    { key: 'club', label: 'Клубы', hint: 'Сообщества и секции', icon: 'ic-users', c: 'var(--type-club)' },
    { key: 'challenge', label: 'Челленджи', hint: 'Сезонные вызовы', icon: 'ic-target', c: 'var(--amber)', wide: true }
  ];

  var input = $('sr-input');
  var clearBtn = $('sr-clear');
  var filtersEl = $('sr-filters');
  var results = $('sr-results');
  var toastTimer = null;

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function initials(t) {
    var parts = t.replace(/[«»]/g, '').split(/\s+/).filter(Boolean);
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
  }

  function plural(n, forms) {
    var a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return forms[2];
    if (b > 1 && b < 5) return forms[1];
    if (b === 1) return forms[0];
    return forms[2];
  }

  function countFor(k) {
    var n = 0;
    for (var i = 0; i < ITEMS.length; i++) if (ITEMS[i].type === k) n++;
    return n;
  }

  function toast(tx) {
    $('toast-tx').textContent = tx;
    var row = $('toast').querySelector('.toast');
    row.className = 'toast toast-info';
    $('toast').classList.add('open');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $('toast').classList.remove('open'); }, 2400);
  }

  function activeFilter() {
    var on = filtersEl.querySelector('.fchip.is-on');
    return on ? on.dataset.k : 'all';
  }

  function setFilter(k) {
    var chips = filtersEl.children;
    for (var i = 0; i < chips.length; i++) chips[i].classList.toggle('is-on', chips[i].dataset.k === k);
  }

  function updateURL() {
    var q = input.value.trim();
    var f = activeFilter();
    var s = '';
    if (q) s += 'q=' + encodeURIComponent(q);
    if (f !== 'all') s += (s ? '&' : '') + 'f=' + f;
    if (history.replaceState) history.replaceState(null, '', '07-search.html' + (s ? '?' + s : ''));
  }

  function readQuery() {
    var q = '', f = 'all';
    var raw = decodeURIComponent(window.location.search.replace(/^\?/, ''));
    if (!raw) return { q: q, f: f };
    var pairs = raw.split('&');
    for (var i = 0; i < pairs.length; i++) {
      var kv = pairs[i].split('=');
      if (kv[0] === 'q') q = (kv[1] || '').replace(/\+/g, ' ');
      if (kv[0] === 'f') f = kv[1] || 'all';
    }
    return { q: q, f: f };
  }

  function buildChips() {
    var s = '';
    for (var i = 0; i < FILTERS.length; i++) {
      var f = FILTERS[i];
      var c = f.key === 'all' ? ITEMS.length : countFor(f.key);
      s += '<button type="button" class="fchip" data-k="' + f.key + '" data-od-id="sr-filter-' + f.key + '"><span>' + f.label + '</span><span class="cnt">' + c + '</span></button>';
    }
    filtersEl.innerHTML = s;
  }

  function rowHtml(it) {
    var media = it.type === 'person'
      ? '<span class="mrow-ava is-tint" style="--c:' + (it.c || TYPE_C.person) + '">' + esc(initials(it.title)) + '</span>'
      : '<span class="mrow-media sr-media" style="--c:' + (it.c || TYPE_C[it.type]) + '"><svg aria-hidden="true"><use href="#' + it.ic + '"></use></svg></span>';
    var side = it.tag ? '<span class="sr-tag" style="--c:' + it.tagC + '">' + esc(it.tag) + '</span>' : '';
    var inner = media +
      '<span class="mrow-tx"><span class="mrow-t">' + esc(it.title) + '</span><span class="mrow-s">' + esc(it.meta) + '</span></span>' +
      '<span class="mrow-side">' + side + '<span class="mrow-chev"><svg aria-hidden="true"><use href="#ic-chev"></use></svg></span></span>';
    var od = ' data-od-id="search-result-' + it.id + '"';
    if (it.to) return '<a class="mrow" href="' + it.to + '"' + od + '>' + inner + '</a>';
    return '<button type="button" class="mrow" data-toast="' + esc(it.toast || '') + '"' + od + '>' + inner + '</button>';
  }

  function groupDiv(type, items) {
    var g = document.createElement('div');
    g.className = 'sr-group';
    g.innerHTML = '<span>' + HEADERS[type] + '</span>';
    var rows = document.createElement('div');
    rows.className = 'sr-rows';
    rows.innerHTML = items.map(rowHtml).join('');
    return [g, rows];
  }

  function render(items, q) {
    results.innerHTML = '';
    if (q && !items.length) {
      var empty = document.createElement('div');
      empty.className = 'empty sr-empty';
      empty.dataset.odId = 'sr-empty';
      empty.innerHTML = '<span class="empty-ic"><svg aria-hidden="true"><use href="#ic-search"></use></svg></span><b>Ничего не найдено</b><span>Попробуйте изменить запрос или выбрать другую категорию</span>';
      results.appendChild(empty);
      return;
    }

    var count = document.createElement('div');
    count.className = 'sr-count';
    count.dataset.odId = 'sr-count';
    count.innerHTML = 'Найдено <b>' + items.length + '</b> ' + plural(items.length, ['результат', 'результата', 'результатов']);
    results.appendChild(count);

    var sorted = items.slice().sort(function (a, b) { return SORT.indexOf(a.type) - SORT.indexOf(b.type); });
    var groups = [];
    for (var i = 0; i < sorted.length; i++) {
      var g = null;
      for (var j = 0; j < groups.length; j++) if (groups[j].type === sorted[i].type) { g = groups[j]; break; }
      if (!g) { g = { type: sorted[i].type, items: [] }; groups.push(g); }
      g.items.push(sorted[i]);
    }
    for (var k = 0; k < groups.length; k++) {
      var nodes = groupDiv(groups[k].type, groups[k].items);
      results.appendChild(nodes[0]);
      results.appendChild(nodes[1]);
    }
  }

  function runSearch() {
    var q = input.value.trim().toLowerCase();
    var f = activeFilter();
    var items = ITEMS.slice();
    if (f !== 'all') items = items.filter(function (r) { return r.type === f; });
    if (q) items = items.filter(function (r) { return (r.title + ' ' + r.meta).toLowerCase().indexOf(q) > -1; });
    render(items, q);
  }

  function buildStart() {
    var s = '';
    s += '<div class="sr-group"><span>Быстрые запросы</span></div>';
    s += '<div class="chips sr-quick" id="sr-quick"></div>';
    s += '<div class="sr-group"><span>Популярное</span></div>';
    s += '<div class="sr-rows" id="sr-popular"></div>';
    s += '<div class="sr-group"><span>Категории</span></div>';
    s += '<div class="sr-cats" id="sr-cats"></div>';
    results.innerHTML = s;

    var qs = '';
    for (var i = 0; i < QUICK.length; i++) {
      qs += '<button type="button" class="fchip" data-q="' + esc(QUICK[i].q) + '" data-od-id="sr-quick-' + esc(QUICK[i].q) + '"><svg aria-hidden="true"><use href="#' + QUICK[i].icon + '"></use></svg>' + esc(QUICK[i].q) + '</button>';
    }
    $('sr-quick').innerHTML = qs;

    var pop = ['e1', 't1', 'p1'];
    var ph = '';
    for (var j = 0; j < pop.length; j++) ph += rowHtml(BY_ID[pop[j]]);
    $('sr-popular').innerHTML = ph;

    var cs = '';
    for (var k = 0; k < CATS.length; k++) {
      var t = CATS[k];
      cs += '<button type="button" class="sr-cat' + (t.wide ? ' is-wide' : '') + '" style="--c:' + t.c + '" data-key="' + t.key + '" data-od-id="sr-cat-' + t.key + '">' +
        '<span class="sr-cat-ic"><svg aria-hidden="true"><use href="#' + t.icon + '"></use></svg></span>' +
        '<span class="sr-cat-tx"><b>' + esc(t.label) + '</b><small>' + esc(t.hint) + '</small></span></button>';
    }
    $('sr-cats').innerHTML = cs;
  }

  function renderStart() {
    if (input.value.trim() || activeFilter() !== 'all') runSearch();
    else buildStart();
  }

  input.addEventListener('input', function () {
    clearBtn.hidden = !input.value;
    updateURL();
    renderStart();
  });

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') e.preventDefault();
  });

  clearBtn.addEventListener('click', function () {
    input.value = '';
    clearBtn.hidden = true;
    input.focus();
    updateURL();
    renderStart();
  });

  filtersEl.addEventListener('click', function (e) {
    var chip = e.target.closest ? e.target.closest('.fchip') : null;
    if (!chip) return;
    var k = chip.dataset.k;
    if (k === 'all') setFilter('all');
    else setFilter(activeFilter() === k ? 'all' : k);
    updateURL();
    renderStart();
  });

  results.addEventListener('click', function (e) {
    var chip = e.target.closest ? e.target.closest('.fchip[data-q]') : null;
    if (chip) {
      input.value = chip.dataset.q;
      clearBtn.hidden = false;
      input.focus();
      updateURL();
      renderStart();
      return;
    }
    var cat = e.target.closest ? e.target.closest('.sr-cat') : null;
    if (cat) {
      setFilter(cat.dataset.key);
      updateURL();
      renderStart();
      return;
    }
    var btn = e.target.closest ? e.target.closest('[data-toast]') : null;
    if (btn) toast(btn.getAttribute('data-toast'));
  });

  $('sr-back').addEventListener('click', function () {
    history.length > 1 ? history.back() : location.href = '06-home.html';
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    input.value = '';
    clearBtn.hidden = true;
    setFilter('all');
    updateURL();
    renderStart();
  });

  buildChips();
  applyQuery(readQuery());

  function applyQuery(q) {
    input.value = q.q;
    clearBtn.hidden = !q.q;
    if (q.f !== 'all') setFilter(q.f);
    renderStart();
  }

  input.focus();
})();
</script>
</body>
</html>
