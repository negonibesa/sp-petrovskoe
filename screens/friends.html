<!doctype html>
<html lang="ru">
<head>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%233b7bff'/%3E%3C/svg%3E">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f7fc">
<title>Друзья · Петровское СП</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/ds.css">
<style>
  /* Экран «Друзья» — пакет профиля §6.6 (friends). Вход — секция
     «Друзья» на profile.html. Живой поиск по имени + скоуп-чипы
     (Друзья / Онлайн / Заявки); заявки принимаются и отклоняются.
     Компоненты: .topbar, .search-field, .fchip, .btn, .evd-toast. */
  .fr-app { background: var(--surface); padding-bottom: 32px; }

  .body > .chips { margin-top: var(--space-3); }
  .fr-clear {
    flex: none; width: 40px; height: 40px; padding: 0; margin-right: 2px;
    border: 0; border-radius: 50%; background: none; color: var(--meta);
    display: grid; place-items: center; cursor: pointer;
    transition: background var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
  }
  .fr-clear svg { width: var(--icon-sm); height: var(--icon-sm); }
  .fr-clear:hover { background: var(--surface-2); color: var(--fg-2); }
  .fr-clear:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .fchip .cnt {
    display: grid; place-items: center; min-width: 18px; height: 18px;
    padding: 0 var(--space-1); border-radius: var(--radius-pill);
    background: var(--surface-2); color: var(--muted);
    font-size: var(--fs-caption); font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .fchip.is-on .cnt { background: color-mix(in srgb, var(--accent-on) 26%, transparent); color: var(--accent-on); }

  .fr-list { display: grid; gap: var(--space-1); }
  .fl {
    display: flex; align-items: center; gap: var(--space-3);
    padding: var(--space-3) var(--space-1); border-radius: var(--radius-md);
    color: inherit; text-decoration: none;
    transition: background var(--motion-fast) var(--ease-standard);
  }
  .fl:hover { background: var(--surface-2); }
  .fl:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .fl-tx { flex: 1; min-width: 0; }
  .fl-tx b { display: block; font-size: var(--fs-body); font-weight: 600; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fl-tx span { display: block; margin-top: 1px; font-size: var(--fs-meta); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fl-tag {
    flex: none; display: inline-flex; align-items: center; font-size: var(--fs-caption); font-weight: 600;
    border-radius: var(--radius-pill); padding: 2px var(--space-2); white-space: nowrap;
  }
  .fl-tag.is-on { color: color-mix(in oklab, var(--success) 55%, var(--fg)); background: color-mix(in srgb, var(--success) 12%, var(--surface)); }
  .fl-tag.is-gto { color: color-mix(in oklab, var(--amber) 55%, var(--fg)); background: color-mix(in srgb, var(--amber) 12%, var(--surface)); }

  .fr-empty { margin-top: var(--space-4); }

  /* Заявки в друзья */
  .fr-req {
    display: flex; align-items: center; gap: var(--space-3);
    padding: var(--space-3) var(--space-1); border-radius: var(--radius-md);
  }
  .fr-req-acts { flex: none; display: flex; gap: var(--space-1); }
  .fr-req-acts .btn-sm { padding: 0 var(--space-3); }
</style>
</head>
<body data-od-id="friends-screen">

  <symbol id="ic-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"></path></symbol>
  <symbol id="ic-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></symbol>
  <symbol id="ic-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.7"></circle><path d="M20 20l-4.3-4.3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></symbol>
  <symbol id="ic-home" viewBox="0 0 24 24"><path d="M20 17.3702V10.3353C20 9.24543 19.5203 8.21325 18.6935 7.52387L14.249 3.81841C12.9402 2.72719 11.0598 2.7272 9.75099 3.81841L5.30654 7.52387C4.47968 8.21325 4 9.24543 4 10.3353V17.3702C4 19.3749 5.59188 21 7.55556 21H16.4444C18.4081 21 20 19.3749 20 17.3702Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"></path><path d="M10 17H14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></symbol>
  <symbol id="ic-events" viewBox="0 0 24 24"><path d="M8.4 5.7L7.5 3M15.6 5.7L16.5 3M20.55 9.3H3.45M3 9.9003C3 6.834 5.4174 4.35 8.4 4.35H15.6C18.5826 4.35 21 6.834 21 9.9003V15.4497C21 18.516 18.5826 21 15.6 21H8.4C5.4174 21 3 18.516 3 15.4497V9.9003Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></symbol>
  <symbol id="ic-dumbbell" viewBox="0 0 24 24"><rect x="3" y="9" width="3.2" height="6" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.7"></rect><rect x="17.8" y="9" width="3.2" height="6" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.7"></rect><path d="M6.2 12h11.6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"></path></symbol>
  <symbol id="ic-users" viewBox="0 0 24 24"><path d="M2.40039 22.8002C2.67639 19.3166 5.61759 16.4066 9.22599 16.2362C9.52999 16.2218 9.85479 16.2098 10.2004 16.2002L11.17 16.2626C12.8062 16.3624 14.3637 16.9998 15.6004 18.0758M17.4004 11.9954C18.9596 12.1416 20.4312 12.7824 21.6004 13.8242M17.986 8.4002C18.5424 8.04805 19.0006 7.56074 19.3179 6.98371C19.6352 6.40667 19.8012 5.7587 19.8004 5.1002C19.8004 2.9462 18.0604 1.2002 15.9124 1.2002C14.8576 1.2002 13.9012 1.6214 13.2004 2.3054M14.1004 9.3002C14.1004 10.3345 13.6895 11.3265 12.9581 12.0579C12.2267 12.7893 11.2347 13.2002 10.2004 13.2002C9.16605 13.2002 8.17407 12.7893 7.44267 12.0579C6.71128 11.3265 6.30039 10.3345 6.30039 9.3002C6.30039 8.26585 6.71128 7.27387 7.44267 6.54248C8.17407 5.81109 9.16605 5.4002 10.2004 5.4002C11.2347 5.4002 12.2267 5.81109 12.9581 6.54248C13.6895 7.27387 14.1004 8.26585 14.1004 9.3002Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></symbol>
  <symbol id="ic-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></circle><path d="M5.5 19.5c0-3.1 2.9-5.2 6.5-5.2s6.5 2.1 6.5 5.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></symbol>
  <symbol id="ic-dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor"></circle><circle cx="12" cy="12" r="1.6" fill="currentColor"></circle><circle cx="19" cy="12" r="1.6" fill="currentColor"></circle></symbol>
</svg>

<div class="app fr-app">
  <header class="topbar" data-od-id="fr-header">
    <a class="topbar-ic is-back" href="profile.html" aria-label="Назад"><svg aria-hidden="true"><use href="#ic-chev"></use></svg></a>
    <h4 class="topbar-tx">Друзья</h4>
    <button class="topbar-ic" type="button" data-toast="Пригласить друга — в следующей итерации" aria-label="Ещё" data-od-id="fr-more"><svg aria-hidden="true"><use href="#ic-dots"></use></svg></button>
  </header>

  <main class="body" data-od-id="fr-body">
    <div class="search-field" role="search">
      <svg aria-hidden="true"><use href="#ic-search"></use></svg>
      <input id="fr-input" data-od-id="fr-input" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Поиск по имени" aria-label="Поиск друга">
      <button type="button" class="fr-clear" id="fr-clear" data-od-id="fr-clear" aria-label="Очистить" hidden><svg aria-hidden="true"><use href="#ic-close"></use></svg></button>
    </div>

    <div class="chips" data-od-id="fr-filters" role="group" aria-label="Фильтр друзей">
      <button class="fchip is-on" type="button" data-scope="all" data-od-id="scope-all">Все<span class="cnt">24</span></button>
      <button class="fchip" type="button" data-scope="online" data-od-id="scope-online">Онлайн<span class="cnt">6</span></button>
      <button class="fchip" type="button" data-scope="requests" data-od-id="scope-requests">Заявки<span class="cnt">2</span></button>
    </div>

    <div id="fr-list" data-od-id="fr-list"></div>
    <div id="fr-empty" class="fr-empty" data-od-id="fr-empty" hidden></div>
  </main>
</div>

<nav class="tabbar tabbar--icons" data-od-id="tabbar" aria-label="Навигация">
  <a class="tab" href="06-home.html" aria-label="Главная"><span class="tab-ic"><svg aria-hidden="true"><use href="#ic-home"></use></svg></span></a>
  <a class="tab" href="07-calendar.html" aria-label="Расписание"><span class="tab-ic"><svg aria-hidden="true"><use href="#ic-events"></use></svg></span></a>
  <a class="tab" href="activities.html" aria-label="Активности"><span class="tab-ic"><svg aria-hidden="true"><use href="#ic-dumbbell"></use></svg></span></a>
  <a class="tab" href="community.html" aria-label="Сообщество"><span class="tab-ic"><svg aria-hidden="true"><use href="#ic-users"></use></svg></span></a>
  <button class="tab is-on" type="button" aria-label="Профиль"><span class="tab-ic"><svg aria-hidden="true"><use href="#ic-user"></use></svg></span></button>
</nav>

<div class="evd-toast" id="toast" role="status" aria-live="polite">
  <div class="toast-row">
    <div class="toast toast-info"><span class="t-ico"><svg aria-hidden="true"><use href="#ic-check"></use></svg></span><span id="toast-tx">Готово</span></div>
  </div>
</div>

<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  var toastTimer;

  function toast(tx) {
    $('toast-tx').textContent = tx;
    var row = $('toast').querySelector('.toast');
    row.className = 'toast toast-info';
    $('toast').classList.add('open');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $('toast').classList.remove('open'); }, 2400);
  }

  var FR = [
    { id: 'p1', n: 'Дмитрий Орлов',  sub: 'Бег · ГТО Серебро', photo: 'athlete-f.png', online: true,  gto: true },
    { id: 'p2', n: 'Мария Ковалёва', sub: 'Бег · ГТО Золото',  photo: 'athlete-f.png', online: true,  gto: true },
    { id: 'p4', n: 'Илья Морозов',   sub: 'Силовая · ГТО Бронза', photo: 'athlete.png', online: false, gto: true },
    { id: 'p5', n: 'Ольга Серова',   sub: 'Плавание',           photo: 'athlete-f.png', online: true,  gto: false },
    { id: 'p8', n: 'Пётр Демидов',   sub: 'Плавание · 2 км',    photo: '', online: false, gto: false },
    { id: 'p9', n: 'Тимур Амиров',   sub: 'ГТО · ступень IX',   photo: '', online: true,  gto: true },
    { id: 'p10', n: 'Лена Шувалова', sub: 'Бег · марафон',      photo: '', online: true,  gto: false },
    { id: 'p11', n: 'Влад Кузнецов', sub: 'Зал · силовая',      photo: '', online: false, gto: false },
    { id: 'p12', n: 'Настя Горелова', sub: 'Зал · пилатес',     photo: '', online: false, gto: false },
    { id: 'p13', n: 'Кирилл Носов',  sub: 'ГТО · тренер',       photo: '', online: true,  gto: true },
    { id: 'p14', n: 'Сергей Мальцев', sub: 'Бег · 5 км',        photo: '', online: false, gto: false },
    { id: 'p15', n: 'Оксана Верещагина', sub: 'Бег · новичок',  photo: '', online: false, gto: false }
  ];
  var REQ = [
    { n: 'Игорь Палий',   sub: 'общий друг: Максим Л.', init: 'ИП' },
    { n: 'Кира Соболева', sub: 'клуб «СП Петровское»',  init: 'КС' }
  ];

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function initials(n) { return n.split(/\s+/).map(function (w) { return w.charAt(0); }).slice(0, 2).join(''); }

  var scope = 'all';

  function friendRow(f) {
    var ava = f.photo
      ? '<span class="mrow-ava is-photo" aria-hidden="true"><img src="../assets/avatars/' + f.photo + '" alt=""></span>'
      : '<span class="mrow-ava is-tint" style="--c: var(--accent)" aria-hidden="true">' + esc(initials(f.n)) + '</span>';
    var tag = f.online
      ? '<span class="fl-tag is-on">Онлайн</span>'
      : (f.gto ? '<span class="fl-tag is-gto">ГТО</span>' : '');
    return '<a class="fl" href="profile-view.html?id=' + f.id + '" data-od-id="friend-row-' + f.id + '">' + ava +
      '<span class="fl-tx"><b>' + esc(f.n) + '</b><span>' + esc(f.sub) + '</span></span>' + tag +
      '<span class="mrow-chev"><svg aria-hidden="true"><use href="#ic-chev"></use></svg></span></a>';
  }

  function render() {
    var q = $('fr-input').value.trim().toLowerCase();
    var list;
    if (scope === 'requests') {
      list = REQ.map(function (r, i) {
        return '<div class="fr-req" data-od-id="request-row-' + i + '">' +
          '<span class="mrow-ava is-tint" style="--c: var(--accent-purple)" aria-hidden="true">' + esc(r.init) + '</span>' +
          '<span class="fl-tx"><b>' + esc(r.n) + '</b><span>' + esc(r.sub) + '</span></span>' +
          '<span class="fr-req-acts">' +
          '<button class="btn btn-success btn-sm" type="button" data-accept="' + i + '" data-od-id="req-accept-' + i + '">Принять</button>' +
          '<button class="btn btn-ghost btn-sm" type="button" data-decline="' + i + '" data-od-id="req-decline-' + i + '">Отклонить</button>' +
          '</span></div>';
      }).join('');
      $('fr-list').innerHTML = list || '';
      $('fr-empty').hidden = list.length > 0;
      $('fr-empty').innerHTML = list.length ? '' : emptyMarkup('Заявок нет', 'Все входящие заявки обработаны.');
      return;
    }
    var rows = FR.filter(function (f) {
      if (scope === 'online' && !f.online) return false;
      if (q && f.n.toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
    $('fr-list').innerHTML = rows.map(friendRow).join('');
    $('fr-empty').hidden = rows.length > 0;
    $('fr-empty').innerHTML = rows.length ? '' : emptyMarkup('Ничего не найдено', 'Попробуйте изменить запрос или фильтр.');
  }

  function emptyMarkup(t, s) {
    return '<div class="empty" data-od-id="fr-empty-card"><span class="empty-ic" aria-hidden="true"><svg><use href="#ic-users"></use></svg></span><b>' + t + '</b><span>' + s + '</span></div>';
  }

  render();

  document.querySelectorAll('.fchip[data-scope]').forEach(function (c) {
    c.addEventListener('click', function () {
      document.querySelectorAll('.fchip[data-scope]').forEach(function (x) { x.classList.remove('is-on'); });
      c.classList.add('is-on');
      scope = c.getAttribute('data-scope');
      render();
    });
  });

  $('fr-input').addEventListener('input', function () {
    $('fr-clear').hidden = !this.value;
    render();
  });
  $('fr-clear').addEventListener('click', function () {
    $('fr-input').value = '';
    this.hidden = true;
    render();
  });

  document.addEventListener('click', function (e) {
    var accept = e.target.closest ? e.target.closest('[data-accept]') : null;
    if (accept) {
      var i = +accept.getAttribute('data-accept');
      toast(REQ[i].n + ' теперь ваш друг');
      REQ.splice(i, 1);
      document.querySelector('.fchip[data-scope="requests"] .cnt').textContent = REQ.length;
      render();
      return;
    }
    var decline = e.target.closest ? e.target.closest('[data-decline]') : null;
    if (decline) {
      var j = +decline.getAttribute('data-decline');
      toast('Заявка от ' + REQ[j].n + ' отклонена');
      REQ.splice(j, 1);
      document.querySelector('.fchip[data-scope="requests"] .cnt').textContent = REQ.length;
      render();
      return;
    }
    var btn = e.target.closest ? e.target.closest('[data-toast]') : null;
    if (btn) toast(btn.getAttribute('data-toast'));
  });
})();
</script>
</body>
</html>
