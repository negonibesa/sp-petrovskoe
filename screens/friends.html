<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Друзья · Петровское СП</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&amp;display=swap" rel="stylesheet">

<style>
  /* Экран «Друзья» — пакет профиля §6.6 (friends). Вход — секция
     «Друзья» на profile.html. Живой поиск по имени + скоуп-чипы
     (Друзья / Онлайн / Заявки); заявки принимаются и отклоняются.
     Компоненты: .topbar, .search-field, .fchip, .btn, .evd-toast. */
  .fr-app { background: var(--surface); padding-bottom: 32px; }

  .body > .chips { margin-top: var(--space-3); }
  .fr-clear {
    flex: none; width: 40px; height: 40px; padding: 0; margin-right: 2px;
    border: 0; border-radius: 50%; background: none; color: var(--meta);
    display: grid; place-items: center; cursor: pointer;
    transition: background var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
  }
  .fr-clear svg { width: var(--icon-sm); height: var(--icon-sm); }
  .fr-clear:hover { background: var(--surface-2); color: var(--fg-2); }
  .fr-clear:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .fchip .cnt {
    display: grid; place-items: center; min-width: 18px; height: 18px;
    padding: 0 var(--space-1); border-radius: var(--radius-pill);
    background: var(--surface-2); color: var(--muted);
    font-size: var(--fs-caption); font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .fchip.is-on .cnt { background: color-mix(in srgb, var(--accent-on) 26%, transparent); color: var(--accent-on); }

  .fr-list { display: grid; gap: var(--space-1); }
  .fl {
    display: flex; align-items: center; gap: var(--space-3);
    padding: var(--space-3) var(--space-1); border-radius: var(--radius-md);
    color: inherit; text-decoration: none;
    transition: background var(--motion-fast) var(--ease-standard);
  }
  .fl:hover { background: var(--surface-2); }
  .fl:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .fl-tx { flex: 1; min-width: 0; }
  .fl-tx b { display: block; font-size: var(--fs-body); font-weight: 600; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fl-tx span { display: block; margin-top: 1px; font-size: var(--fs-meta); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fl-tag {
    flex: none; display: inline-flex; align-items: center; font-size: var(--fs-caption); font-weight: 600;
    border-radius: var(--radius-pill); padding: 2px var(--space-2); white-space: nowrap;
  }
  .fl-tag.is-on { color: color-mix(in oklab, var(--success) 55%, var(--fg)); background: color-mix(in srgb, var(--success) 12%, var(--surface)); }

  .fr-empty { margin-top: var(--space-4); }

  /* Заявки в друзья */
  .fr-req {
    display: flex; align-items: center; gap: var(--space-3);
    padding: var(--space-3) var(--space-1); border-radius: var(--radius-md);
  }
  .fr-req-acts { flex: none; display: flex; gap: var(--space-1); }
  .fr-req-acts .btn-sm { padding: 0 var(--space-3); }
</style>
</head>

<div class="app fr-app">
  <header class="topbar" data-od-id="fr-header">
    <a class="topbar-ic is-back" href="profile.html" aria-label="Назад"><svg aria-hidden="true"><use href="#ic-chev"></use></svg></a>
    <h4 class="topbar-tx">Друзья</h4>
    <button class="topbar-ic" type="button" data-toast="Пригласить друга — в следующей итерации" aria-label="Ещё" data-od-id="fr-more"><svg aria-hidden="true"><use href="#ic-dots"></use></svg></button>
  </header>

  <main class="body" data-od-id="fr-body">
    <div class="search-field" role="search">
      <svg aria-hidden="true"><use href="#ic-search"></use></svg>
      <input id="fr-input" data-od-id="fr-input" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Поиск по имени" aria-label="Поиск друга">
      <button type="button" class="fr-clear" id="fr-clear" data-od-id="fr-clear" aria-label="Очистить" hidden><svg aria-hidden="true"><use href="#ic-close"></use></svg></button>
    </div>

    <div class="chips" data-od-id="fr-filters" role="group" aria-label="Фильтр друзей">
      <button class="fchip is-on" type="button" data-scope="all" data-od-id="scope-all">Все<span class="cnt">24</span></button>
      <button class="fchip" type="button" data-scope="online" data-od-id="scope-online">Онлайн<span class="cnt">6</span></button>
      <button class="fchip" type="button" data-scope="requests" data-od-id="scope-requests">Заявки<span class="cnt">2</span></button>
    </div>

    <div id="fr-list" data-od-id="fr-list"></div>
    <div id="fr-empty" class="fr-empty" data-od-id="fr-empty" hidden></div>
  </main>
</div>

</nav>

<div class="evd-toast" id="toast" role="status" aria-live="polite">
  <div class="toast-row">
    <div class="toast toast-info"><span class="t-ico"><svg aria-hidden="true"><use href="#ic-check"></use></svg></span><span id="toast-tx">Готово</span></div>
  </div>
</div>

<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  var toastTimer;

  function toast(tx) {
    $('toast-tx').textContent = tx;
    var row = $('toast').querySelector('.toast');
    row.className = 'toast toast-info';
    $('toast').classList.add('open');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $('toast').classList.remove('open'); }, 2400);
  }

  var FR = [
    { id: 'p1', n: 'Дмитрий Орлов',  sub: 'Бег · Серебро',   photo: 'athlete-f.png', online: true },
    { id: 'p2', n: 'Мария Ковалёва', sub: 'Бег · Золото',    photo: 'athlete-f.png', online: true },
    { id: 'p4', n: 'Илья Морозов',   sub: 'Силовая · Бронза', photo: 'athlete.png',   online: false },
    { id: 'p5', n: 'Ольга Серова',   sub: 'Плавание',         photo: 'athlete-f.png', online: true },
    { id: 'p8', n: 'Пётр Демидов',   sub: 'Плавание · 2 км',  photo: '',              online: false },
    { id: 'p9', n: 'Тимур Амиров',   sub: 'ГТО · ступень IX', photo: '',              online: true },
    { id: 'p10', n: 'Лена Шувалова', sub: 'Бег · марафон',    photo: '',              online: true },
    { id: 'p11', n: 'Влад Кузнецов', sub: 'Зал · силовая',    photo: '',              online: false },
    { id: 'p12', n: 'Настя Горелова', sub: 'Зал · пилатес',   photo: '',              online: false },
    { id: 'p13', n: 'Кирилл Носов',  sub: 'Тренер',            photo: '',              online: true },
    { id: 'p14', n: 'Сергей Мальцев', sub: 'Бег · 5 км',      photo: '',              online: false },
    { id: 'p15', n: 'Оксана Верещагина', sub: 'Бег · новичок', photo: '',              online: false }
  ];
  var REQ = [
    { n: 'Игорь Палий',   sub: 'общий друг: Максим Л.', init: 'ИП' },
    { n: 'Кира Соболева', sub: 'клуб «СП Петровское»',  init: 'КС' }
  ];

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function initials(n) { return n.split(/\s+/).map(function (w) { return w.charAt(0); }).slice(0, 2).join(''); }

  var scope = 'all';

  function friendRow(f) {
    var ava = f.photo
      ? '<span class="mrow-ava is-photo" aria-hidden="true"><img src="../assets/avatars/' + f.photo + '" alt=""></span>'
      : '<span class="mrow-ava is-tint" style="--c: var(--accent)" aria-hidden="true">' + esc(initials(f.n)) + '</span>';
    var tag = f.online
      ? '<span class="fl-tag is-on">Онлайн</span>'
      : '';
    return '<a class="fl" href="profile-view.html?id=' + f.id + '" data-od-id="friend-row-' + f.id + '">' + ava +
      '<span class="fl-tx"><b>' + esc(f.n) + '</b><span>' + esc(f.sub) + '</span></span>' + tag +
      '<span class="mrow-chev"><svg aria-hidden="true"><use href="#ic-chev"></use></svg></span></a>';
  }

  function render() {
    var q = $('fr-input').value.trim().toLowerCase();
    var list;
    if (scope === 'requests') {
      list = REQ.map(function (r, i) {
        return '<div class="fr-req" data-od-id="request-row-' + i + '">' +
          '<span class="mrow-ava is-tint" style="--c: var(--accent-purple)" aria-hidden="true">' + esc(r.init) + '</span>' +
          '<span class="fl-tx"><b>' + esc(r.n) + '</b><span>' + esc(r.sub) + '</span></span>' +
          '<span class="fr-req-acts">' +
          '<button class="btn btn-success btn-sm" type="button" data-accept="' + i + '" data-od-id="req-accept-' + i + '">Принять</button>' +
          '<button class="btn btn-ghost btn-sm" type="button" data-decline="' + i + '" data-od-id="req-decline-' + i + '">Отклонить</button>' +
          '</span></div>';
      }).join('');
      $('fr-list').innerHTML = list || '';
      $('fr-empty').hidden = list.length > 0;
      $('fr-empty').innerHTML = list.length ? '' : emptyMarkup('Заявок нет', 'Все входящие заявки обработаны.');
      return;
    }
    var rows = FR.filter(function (f) {
      if (scope === 'online' && !f.online) return false;
      if (q && f.n.toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
    $('fr-list').innerHTML = rows.map(friendRow).join('');
    $('fr-empty').hidden = rows.length > 0;
    $('fr-empty').innerHTML = rows.length ? '' : emptyMarkup('Ничего не найдено', 'Попробуйте изменить запрос или фильтр.');
  }

  function emptyMarkup(t, s) {
    return '<div class="empty" data-od-id="fr-empty-card"><span class="empty-ic" aria-hidden="true"><svg><use href="#ic-users"></use></svg></span><b>' + t + '</b><span>' + s + '</span></div>';
  }

  render();

  document.querySelectorAll('.fchip[data-scope]').forEach(function (c) {
    c.addEventListener('click', function () {
      document.querySelectorAll('.fchip[data-scope]').forEach(function (x) { x.classList.remove('is-on'); });
      c.classList.add('is-on');
      scope = c.getAttribute('data-scope');
      render();
    });
  });

  $('fr-input').addEventListener('input', function () {
    $('fr-clear').hidden = !this.value;
    render();
  });
  $('fr-clear').addEventListener('click', function () {
    $('fr-input').value = '';
    this.hidden = true;
    render();
  });

  document.addEventListener('click', function (e) {
    var accept = e.target.closest ? e.target.closest('[data-accept]') : null;
    if (accept) {
      var i = +accept.getAttribute('data-accept');
      toast(REQ[i].n + ' теперь ваш друг');
      REQ.splice(i, 1);
      document.querySelector('.fchip[data-scope="requests"] .cnt').textContent = REQ.length;
      render();
      return;
    }
    var decline = e.target.closest ? e.target.closest('[data-decline]') : null;
    if (decline) {
      var j = +decline.getAttribute('data-decline');
      toast('Заявка от ' + REQ[j].n + ' отклонена');
      REQ.splice(j, 1);
      document.querySelector('.fchip[data-scope="requests"] .cnt').textContent = REQ.length;
      render();
      return;
    }
    var btn = e.target.closest ? e.target.closest('[data-toast]') : null;
    if (btn) toast(btn.getAttribute('data-toast'));
  });
})();
</script>
</body>
</html>
