<style>
  /* Экран «Уведомления» — перечень типов по
     referens/notifications-checklist.md (модель «5 слоёв», §4.20),
     спека §4.10: 4 базовых типа + удаление, §6.2.
     Компоненты ДС v2: топбар .topbar, карточка .n-card,
     фильтр .seg, лист .sheet, пустое состояние .empty, тосты .toast. */
  .nf-app { background: var(--surface); padding-bottom: 32px; }
  .nf-body { padding-top: 4px; }

  .nf-seg { margin: 0 0 var(--space-2); }

  .nf-groups { display: grid; gap: var(--space-6); }
  .nf-group { display: grid; gap: var(--space-2); }
  .nf-group-t {
    display: flex; align-items: baseline; gap: var(--space-2);
    margin: 0; font-size: var(--fs-meta); font-weight: 700;
    letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--muted);
  }
  .nf-group-n { font-size: var(--fs-caption); font-weight: 600; color: var(--meta); }

  /* Карточка уведомления: канон .n-card из ДС v2 + локальные
     состояния (непрочитанное, ссылка, меню «⋯»). */
  .n-card.is-unread { border-color: color-mix(in srgb, var(--accent) 38%, var(--border)); }
  .n-card.is-unread .n-title { color: var(--fg); }
  .n-card.is-unread .n-title::before {
    content: ""; display: inline-block; width: 7px; height: 7px;
    margin-right: 6px; border-radius: 50%;
    background: var(--accent); vertical-align: 2px;
  }
  .n-card.is-link { cursor: pointer; transition: background var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard); }
  .n-card.is-link:hover { background: var(--surface-2); }
  .n-card.is-link:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .n-card.is-removing {
    opacity: 0; transform: translateX(24px);
    transition: opacity 220ms var(--ease-in), transform 220ms var(--ease-in);
  }
  .n-card.is-rise { animation: nf-rise 340ms var(--ease-out) both; }
  .n-card.is-rise + .n-card.is-rise { animation-delay: 50ms; }
  @keyframes nf-rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .n-card.is-rise, .n-card.is-removing { animation: none; transition: none; }
  }

  .nf-more {
    flex: none; align-self: flex-start;
    width: 30px; height: 30px; margin: -6px -8px 0 0;
    display: grid; place-items: center;
    border: 0; border-radius: 50%; background: transparent; color: var(--meta);
    cursor: pointer;
    transition: background var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
  }
  .nf-more:hover { background: var(--surface-2); color: var(--fg-2); }
  .nf-more:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .nf-more svg { width: var(--icon-sm); height: var(--icon-sm); }

  .nf-invite .n-text { margin-bottom: var(--space-1); }

  .nf-empty { margin-top: var(--space-2); }

  .nf-toast { bottom: 28px; }
</style>

  var NOTIFS = [
    { id: 1,  group: 'Сегодня', t: 'Через 30 минут — Круговая тренировка', x: 'Тренажёрный зал · 09:00', m: '08:30', c: 'var(--type-training)', ic: 'ic-clock', href: '07-calendar.html', unread: true },
    { id: 2,  group: 'Сегодня', t: 'Вас пригласили на марафон', x: 'Осенний полумарафон · 12 окт, 08:00 · центр СП', m: '08:05', c: 'var(--type-event)', ic: 'ic-events', href: '15-event-marathon.html', unread: true, invite: true, kind: 'event' },
    { id: 13, group: 'Сегодня', t: 'Мария К. хочет добавить вас в друзья', x: 'Общие активности: бег, ГТО', m: '07:45', c: 'var(--accent)', ic: 'ic-users', unread: true, invite: true, kind: 'friend' },
    { id: 3,  group: 'Сегодня', t: '+50 баллов', x: 'За активность в сентябре · сервис', m: '07:12', c: 'var(--amber)', ic: 'ic-star-solar', unread: true },
    { id: 4,  group: 'Сегодня', t: 'Тест-день ГТО — сегодня', x: 'Бег 2 км · 12 авг · стадион', m: '07:00', c: 'var(--gto-silver)', ic: 'ic-target', href: '25-gto-test.html', unread: true },
    { id: 5,  group: 'Вчера', t: 'Друг записался на то же событие', x: 'Иван П. · Осенний полумарафон', m: '19:24', c: 'var(--accent)', ic: 'ic-users', href: '15-event-marathon.html', unread: true },
    { id: 6,  group: 'Вчера', t: 'Аренда площадки подтверждена', x: 'Волейбол · 11 авг · 18:00 · площадка №2', m: '14:38', c: 'var(--type-rental)', ic: 'ic-check', href: '07-calendar.html' },
    { id: 7,  group: 'Вчера', t: 'Серия · 7 дней подряд', x: 'Тренировки без пропусков — так держать', m: '09:02', c: 'var(--amber)', ic: 'ic-medal-solar', opt: true },
    { id: 8,  group: 'Вчера', t: 'Перенос времени · Кросс-тренинг', x: 'Теперь 19:30 вместо 18:00 · зал №1', m: '08:20', c: 'var(--type-event)', ic: 'ic-clock', href: '07-calendar.html' },
    { id: 9,  group: 'Ранее', t: 'Опрос после тренировки не заполнен', x: 'Бег · 9 авг — потратьте 2 минуты', m: '12 авг', c: 'var(--warn)', ic: 'ic-sneaker', href: 'activities.html' },
    { id: 10, group: 'Ранее', t: 'Списание −50 баллов', x: 'Подозрение в накрутке · обязательное уведомление', m: '11 авг', c: 'var(--danger)', ic: 'ic-close' },
    { id: 11, group: 'Ранее', t: 'Шахматный турнир отменён', x: 'Судья перенёс мероприятие · клуб СП', m: '10 авг', c: 'var(--type-club)', ic: 'ic-events' },
    { id: 12, group: 'Ранее', t: 'Вход с нового устройства', x: 'iPhone 15 · Сергиев Посад · если это не вы — смените пароль', m: '9 авг', c: 'var(--fg-2)', ic: 'ic-home' }
  ];

  var ORDER = ['Сегодня', 'Вчера', 'Ранее'];
  var filter = 'all';
  var activeId = null;
  var toastTimer = null;

  function unreadCount() {
    return NOTIFS.reduce(function (n, it) { return n + (it.unread ? 1 : 0); }, 0);
  }

  function toast(tx, cls) {
    $('toast-tx').textContent = tx;
    var row = $('toast').querySelector('.toast');
    row.className = 'toast ' + (cls || 'toast-success');
    $('toast').classList.add('open');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $('toast').classList.remove('open'); }, 2400);
  }

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  function cardHtml(it) {
    var cls = 'n-card';
    if (it.href) cls += ' is-link';
    if (it.unread) cls += ' is-unread';
    if (it.invite) cls += ' nf-invite';
    cls += ' is-rise';
    var acts = '';
    if (it.invite) {
      var ok = 'Принять';
      var no = 'Позже';
      if (it.kind === 'friend') { no = 'Отклонить'; }
      acts = '<span class="n-acts">' +
        '<button type="button" class="n-btn n-btn-primary" data-act="accept">' + ok + '</button>' +
        '<button type="button" class="n-btn n-btn-secondary" data-act="decline">' + no + '</button>' +
        '</span>';
    }
    return '<article class="' + cls + '" style="--c:' + it.c + '" data-id="' + it.id + '"' +
      (it.href ? ' data-href="' + it.href + '"' : '') + '>' +
      '<span class="n-ic"><svg aria-hidden="true"><use href="#' + it.ic + '"></use></svg></span>' +
      '<span class="n-body">' +
      '<span class="n-title">' + esc(it.t) + '</span>' +
      '<span class="n-text">' + esc(it.x) + '</span>' +
      '<span class="n-meta">' + esc(it.m) + '</span>' + acts +
      '</span>' +
      '<button type="button" class="nf-more" data-more="' + it.id + '" aria-label="Действия с уведомлением"><svg aria-hidden="true"><use href="#ic-dots"></use></svg></button>' +
      '</article>';
  }

  function render() {
    var shown = NOTIFS.filter(function (it) {
      return filter === 'all' || it.unread;
    });
    $('nf-empty').hidden = shown.length > 0;

    var groups = ORDER.map(function (g) {
      var items = shown.filter(function (it) { return it.group === g; });
      if (!items.length) return '';
      var n = items.filter(function (it) { return it.unread; }).length;
      return '<div class="nf-group" data-od-id="nf-group-' + g + '">' +
        '<h3 class="nf-group-t">' + g +
        (n ? '<span class="nf-group-n">' + n + ' новых</span>' : '') +
        '</h3>' +
        items.map(cardHtml).join('') +
        '</div>';
    }).join('');

    $('nf-groups').innerHTML = groups;
    $('btn-clear').style.visibility = NOTIFS.length ? 'visible' : 'hidden';
  }

  function openMenu(id) {
    activeId = id;
    $('menu-scrim').classList.add('open');
    $('menu-sheet').classList.add('open');
  }
  function closeMenu() {
    activeId = null;
    $('menu-scrim').classList.remove('open');
    $('menu-sheet').classList.remove('open');
  }

  function removeById(id) {
    var card = document.querySelector('.n-card[data-id="' + id + '"]');
    if (card) {
      card.classList.add('is-removing');
      setTimeout(function () {
        NOTIFS = NOTIFS.filter(function (it) { return it.id !== id; });
        render();
      }, 220);
    } else {
      NOTIFS = NOTIFS.filter(function (it) { return it.id !== id; });
      render();
    }
  }

  /* Фильтр */
  document.querySelectorAll('#nf-seg .seg-btn').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('#nf-seg .seg-btn').forEach(function (x) { x.classList.remove('is-active'); });
      b.classList.add('is-active');
      filter = b.getAttribute('data-filter');
      render();
    });
  });

  /* События по списку */
  $('nf-groups').addEventListener('click', function (e) {
    var more = e.target.closest('.nf-more');
    if (more) { openMenu(parseInt(more.getAttribute('data-more'), 10)); return; }

    var act = e.target.closest('[data-act]');
    var card = e.target.closest('.n-card');
    if (act && card) {
      var id = parseInt(card.getAttribute('data-id'), 10);
      var it = NOTIFS.find(function (x) { return x.id === id; });
      if (act.getAttribute('data-act') === 'accept') {
        it.unread = false; it.invite = false;
        toast(it.kind === 'friend' ? 'Вы теперь друзья с Марией К.' : 'Вы записаны на марафон');
      } else {
        it.unread = false; it.invite = false;
        toast(it.kind === 'friend' ? 'Заявка отклонена' : 'Приглашение отложено');
      }
      render();
      return;
    }

    if (card && card.getAttribute('data-href')) {
      location.href = card.getAttribute('data-href');
    } else if (card) {
      var cid = parseInt(card.getAttribute('data-id'), 10);
      var item = NOTIFS.find(function (x) { return x.id === cid; });
      if (item && item.unread) { item.unread = false; render(); toast('Отмечено прочитанным'); }
    }
  });

  /* Меню карточки */
  $('menu-read').addEventListener('click', function () {
    var it = NOTIFS.find(function (x) { return x.id === activeId; });
    if (it && it.unread) { it.unread = false; render(); toast('Отмечено прочитанным'); }
    closeMenu();
  });
  $('menu-delete').addEventListener('click', function () {
    if (activeId != null) { removeById(activeId); toast('Уведомление удалено'); }
    closeMenu();
  });
  $('menu-close').addEventListener('click', closeMenu);
  $('menu-cancel').addEventListener('click', closeMenu);
  $('menu-scrim').addEventListener('click', closeMenu);

  /* Очистить всё */
  function openClear() { $('clear-scrim').classList.add('open'); $('clear-sheet').classList.add('open'); }
  function closeClear() { $('clear-scrim').classList.remove('open'); $('clear-sheet').classList.remove('open'); }
  $('btn-clear').addEventListener('click', function () {
    $('clear-note').textContent = 'Будет удалено ' + NOTIFS.length + ' уведомлений' + (unreadCount() ? ' (' + unreadCount() + ' непрочитанных)' : '') + '. Действие нельзя отменить.';
    openClear();
  });
  $('clear-ok').addEventListener('click', function () {
    NOTIFS = [];
    render();
    closeClear();
    toast('Уведомления очищены');
  });
  $('clear-close').addEventListener('click', closeClear);
  $('clear-cancel').addEventListener('click', closeClear);
  $('clear-scrim').addEventListener('click', closeClear);

  /* Назад */
  $('btn-back').addEventListener('click', function () {
    history.length > 1 ? history.back() : location.href = '06-home.html';
  });

  /* Escape закрывает листы */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if ($('menu-sheet').classList.contains('open')) closeMenu();
      if ($('clear-sheet').classList.contains('open')) closeClear();
    }
  });

  render();
})();
</script>
</body>
</html>
