<style>
  /* Полный список достижений: фильтры + список.
     Компоненты: .topbar, .chips, .fchip, .mrow (канон ДС). */
  .ach-app { background: var(--surface); padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px)); }

  /* ── Фильтры ── */
  .ach-filters { padding: 0 var(--space-4); }
  .ach-filters .chips { margin: 0; }

  /* ── Счётчик ── */
  .ach-count {
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--space-3) var(--space-4);
    font-size: var(--fs-meta); color: var(--meta);
  }
  .ach-count b { color: var(--fg); }

  /* ── Секции ── */
  .ach-sec { padding: 0 var(--space-4); }
  .ach-sec + .ach-sec { margin-top: var(--space-3); }
  .ach-sec-head {
    font-size: var(--fs-caption); font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--muted);
    padding: var(--space-2) 0 var(--space-1);
  }

  /* ── Карточка достижения (канон .mrow-паттерн) ── */
  .ach-row {
    display: flex; align-items: center; gap: var(--space-3);
    padding: var(--space-3);
    border-radius: var(--radius-md);
    transition: background var(--motion-fast) var(--ease-standard);
  }
  .ach-row:hover { background: var(--surface-warm); }

  /* Медали ГТО — цветной круг с SVG-медалью */
  .ach-row .gto-badge { width: 40px; height: 40px; }

  /* Прочие достижения — иконки через SVG */
  .ach-ic {
    flex: none; width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center;
    color: #fff;
  }
  .ach-ic svg { width: 20px; height: 20px; }
  .ach-ic.is-success { background: linear-gradient(135deg, #2ecc71, #58d68d); }
  .ach-ic.is-amber { background: linear-gradient(135deg, #f1c40f, #f9e547); }
  .ach-ic.is-flame { background: linear-gradient(135deg, #ff6b35, #ff9a5c); }
  .ach-ic.is-star { background: linear-gradient(135deg, #3b7bff, #6fa0ff); }
  .ach-ic.is-users { background: linear-gradient(135deg, #2ecc71, #58d68d); }
  .ach-ic.is-medal { background: linear-gradient(135deg, #9b59b6, #c39bd3); }
  .ach-ic.is-target { background: linear-gradient(135deg, #8e44ad, #bb8fce); }

  /* Текст */
  .ach-tx { flex: 1; min-width: 0; }
  .ach-name { display: block; font-size: var(--fs-meta); font-weight: 600; color: var(--fg); }
  .ach-desc { display: block; margin-top: 1px; font-size: var(--fs-caption); color: var(--meta); }

  /* Заблокированные */
  .ach-row.is-locked { opacity: 0.5; }
  .ach-row.is-locked .ach-name { color: var(--fg-2); }

  /* Прогресс */
  .ach-progress {
    flex: none; width: 48px; display: grid; gap: 2px; text-align: right;
  }
  .ach-progress-pct { font-size: var(--fs-caption); font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .ach-progress-bar { height: 3px; border-radius: var(--radius-pill); background: var(--surface-2); overflow: hidden; }
  .ach-progress-fill { display: block; height: 100%; border-radius: inherit; background: var(--accent); }

  /* Кнопка «Показать ещё» */
  .ach-more {
    display: flex; margin: var(--space-2) auto 0; padding: var(--space-2) var(--space-4);
    border: none; background: none; border-radius: var(--radius-pill);
    font: inherit; font-size: var(--fs-meta); font-weight: 600; color: var(--accent);
    cursor: pointer; transition: background var(--motion-fast) var(--ease-standard);
  }
  .ach-more:hover { background: var(--surface-warm); }
  .ach-more:focus-visible { outline: none; box-shadow: var(--focus-ring); }
</style>
</head>

<div class="app ach-app">
  <header class="topbar" data-od-id="ach-header">
    <a class="topbar-ic is-back" href="profile.html" aria-label="Назад"><svg aria-hidden="true"><use href="#ic-chev"></use></svg></a>
    <h1 class="topbar-tx">Достижения</h1>
  </header>

  <main class="body" data-od-id="ach-body">
    <div class="ach-filters" data-od-id="ach-filters">
      <div class="chips" role="group">
        <button type="button" class="fchip is-on" data-filter="all">Все</button>
        <button type="button" class="fchip" data-filter="gto">ГТО</button>
        <button type="button" class="fchip" data-filter="sport">Спорт</button>
        <button type="button" class="fchip" data-filter="streak">Серия</button>
        <button type="button" class="fchip" data-filter="locked">Ещё не получены</button>
      </div>
    </div>

    <div class="ach-count" data-od-id="ach-count">
      <span>Получено: <b id="ach-done">5</b> из <b id="ach-total">15</b></span>
      <span id="ach-pts">+1 250 баллов</span>
    </div>

    <div id="ach-grid" data-od-id="ach-grid"></div>
  </main>
</div>

<script>
(function () {
  'use strict';
  var ACHIEVEMENTS = [
    { id: 'gto-silver', group: 'ГТО', name: 'Знак ГТО · Серебро', desc: 'Ступень VII · сдано 3 из 5 нормативов', gtoClass: 'is-silver', cat: 'gto', done: true, date: '12 авг 2026' },
    { id: 'gto-gold', group: 'ГТО', name: 'Знак ГТО · Золото', desc: 'Сдайте ещё 2 норматива', gtoClass: 'is-gold', cat: 'gto', done: false, pct: 60 },
    { id: 'gto-bronze', group: 'ГТО', name: 'Знак ГТО · Бронза', desc: 'Ступень VII · сдано 1 норматив', gtoClass: 'is-bronze', cat: 'gto', done: true, date: '15 июля 2026' },
    { id: '100-trainings', group: 'Спорт', name: '100 тренировок', desc: 'Пройдено за сезон', icon: 'ic-sneaker', tone: 'is-star', cat: 'sport', done: true, date: '5 авг 2026' },
    { id: '7-day-streak', group: 'Серия', name: 'Серия 7 дней', desc: 'Тренировались каждый день', icon: 'ic-flame', tone: 'is-flame', cat: 'streak', done: true, date: '10 авг 2026' },
    { id: '30-day-streak', group: 'Серия', name: 'Серия 30 дней', desc: 'Тренировались каждый день месяц', icon: 'ic-flame', tone: 'is-flame', cat: 'streak', done: false, pct: 20 },
    { id: 'marathon-finish', group: 'Спорт', name: 'Финиш марафона', desc: 'Завершили марафон', icon: 'ic-running', tone: 'is-star', cat: 'sport', done: true, date: '14 авг 2026' },
    { id: 'first-place', group: 'Спорт', name: '1-е место', desc: 'Заняли первое место на соревновании', icon: 'ic-trophy', tone: 'is-amber', cat: 'sport', done: false, pct: 0 },
    { id: 'swim-1km', group: 'Спорт', name: '1 км заплывом', desc: 'Проплыли 1 км без остановки', icon: 'ic-swim', tone: 'is-star', cat: 'sport', done: true, date: '3 авг 2026' },
    { id: 'run-10km', group: 'Спорт', name: '10 км бегом', desc: 'Пробежали 10 км', icon: 'ic-running', tone: 'is-star', cat: 'sport', done: false, pct: 70 },
    { id: '20-trainings', group: 'Спорт', name: '20 тренировок', desc: 'Пройдено за месяц', icon: 'ic-sneaker', tone: 'is-star', cat: 'sport', done: true, date: '1 авг 2026' },
    { id: 'friend-invite', group: 'Спорт', name: 'Пригласи друга', desc: 'Привели друга в приложение', icon: 'ic-users', tone: 'is-users', cat: 'sport', done: false, pct: 0 },
    { id: 'early-bird', group: 'Серия', name: 'Ранняя пташка', desc: '5 тренировок до 7 утра', icon: 'ic-flame', tone: 'is-flame', cat: 'streak', done: true, date: '20 июля 2026' },
    { id: 'crossfit', group: 'Спорт', name: 'Кроссфитер', desc: 'Попробуйте 5 разных видов спорта', icon: 'ic-target', tone: 'is-target', cat: 'sport', done: false, pct: 60 },
    { id: 'rental-10', group: 'Спорт', name: '10 аренд', desc: 'Забронируйте 10 площадок', icon: 'ic-sneaker', tone: 'is-star', cat: 'sport', done: false, pct: 40 }
  ];

  var grid = document.getElementById('ach-grid');
  var filterBtns = document.querySelectorAll('.fchip[data-filter]');
  var currentFilter = 'all';

  function render(filter) {
    var filtered = filter === 'all' ? ACHIEVEMENTS
      : filter === 'locked' ? ACHIEVEMENTS.filter(function (a) { return !a.done; })
      : ACHIEVEMENTS.filter(function (a) { return a.cat === filter; });

    var done = ACHIEVEMENTS.filter(function (a) { return a.done; }).length;
    document.getElementById('ach-done').textContent = done;
    document.getElementById('ach-total').textContent = ACHIEVEMENTS.length;

    var groups = {};
    filtered.forEach(function (a) {
      if (!groups[a.group]) groups[a.group] = [];
      groups[a.group].push(a);
    });

    var html = '';
    Object.keys(groups).forEach(function (g) {
      html += '<div class="ach-sec"><div class="ach-sec-head">' + g + '</div>';
      groups[g].forEach(function (a) {
        var locked = !a.done ? ' is-locked' : '';
        html += '<div class="ach-row' + locked + '" data-od-id="ach-' + a.id + '">';
        if (a.gtoClass) {
          html += '<span class="gto-badge ' + a.gtoClass + '" aria-hidden="true"><svg class="gto-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.27 5.82 22 7 14.14l-5-4.87 6.91-1.01z"/></svg></span>';
        } else {
          html += '<span class="ach-ic ' + (a.tone || '') + '" aria-hidden="true"><svg><use href="#' + a.icon + '"></use></svg></span>';
        }
        html += '<span class="ach-tx"><span class="ach-name">' + a.name + '</span><span class="ach-desc">';
        html += a.done ? 'Получено ' + a.date : a.desc;
        html += '</span></span>';
        if (!a.done && a.pct != null) {
          html += '<span class="ach-progress"><span class="ach-progress-pct">' + a.pct + '%</span>';
          html += '<span class="ach-progress-bar"><span class="ach-progress-fill" style="width:' + a.pct + '%"></span></span></span>';
        }
        html += '</div>';
      });
      html += '</div>';
    });

    if (filtered.length === 0) {
      html = '<div class="empty" style="padding: var(--space-8) 0; text-align: center;"><span class="empty-ic" aria-hidden="true"><svg><use href="#ic-target"></use></svg></span><b>Нет достижений</b><span>В этом разделе пока пусто</span></div>';
    }

    grid.innerHTML = html;
  }

  filterBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      filterBtns.forEach(function (b) { b.classList.remove('is-on'); });
      btn.classList.add('is-on');
      currentFilter = btn.getAttribute('data-filter');
      render(currentFilter);
    });
  });

  render('all');
})();
</script>
