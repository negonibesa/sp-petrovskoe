<style>
  /* Деталка клуба — подэкран Сообщества (§6.5). Канон: .topbar, .card,
     .mrow/.mrow-ava/.mrow-media, .avatar-sm, .btn, .tabbar, .evd-toast.
     Спорт-иконки — картинки из assets/sports, иконки клубов без картинки — символы. */
  .cl-hero { display: flex; flex-direction: column; gap: var(--space-5); }
  .cl-top { display: flex; align-items: center; gap: var(--space-3); }
  .cl-ic {
    flex: none; width: 64px; height: 64px; display: grid; place-items: center;
    border-radius: var(--radius-lg); background: color-mix(in srgb, var(--c, var(--accent)) 14%, var(--surface));
    color: var(--c, var(--accent));
  }
  .cl-ic img { width: 56px; height: 56px; object-fit: contain; }
  .cl-ic svg { width: 34px; height: 34px; }
  .cl-tx { flex: 1; min-width: 0; }
  .cl-tx h1 { margin: 0; font-size: var(--fs-title); font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; color: var(--fg); }
  .cl-tx span { display: block; margin-top: var(--space-1); font-size: var(--fs-meta); color: var(--muted); }
  .cl-desc { margin: 0; font-size: var(--fs-body); line-height: 1.55; color: var(--fg-2); }
  .cl-row-media.is-icon { background: color-mix(in srgb, var(--c, var(--accent)) 13%, var(--surface)); }
</style>

<script>

  function initials(n) { return n.split(/\s+/).map(function (w) { return w.charAt(0); }).slice(0, 2).join(''); }

      desc: 'Тренировки и групповые выезды на лыжной базе «Красная горка». Сезонные сборы, прокат инвентаря и запись на смазку.',

  var PEOPLE = {
    p1: { n: 'Дмитрий Орлов',   p: 'athlete-f.png' },
    p2: { n: 'Мария Ковалёва',  p: 'athlete-f.png' },
    p3: { n: 'Анна Ковалёва',   p: '' },
    p4: { n: 'Илья Морозов',    p: 'athlete.png' },
    p5: { n: 'Ольга Серова',    p: 'athlete-f.png' },
    p8: { n: 'Пётр Демидов',    p: 'athlete.png' },
    p9: { n: 'Тимур Амиров',    p: 'athlete.png' },
    p11: { n: 'Влад Кузнецов',  p: 'athlete.png' },
    p13: { n: 'Кирилл Носов',   p: 'athlete.png' },
    p14: { n: 'Сергей Мальцев', p: 'athlete.png' },
    p15: { n: 'Оксана Верещагина', p: 'athlete-f.png' }

  var NEWS_T = { n1: 'Как прошёл забег «Петровские холмы»', n2: 'Новое покрытие на летней площадке', n3: 'Открыт набор в секцию плавания', n4: 'Турнир по бадминтону', n5: '«Пульс» открыл набор на утренние тренировки', n6: 'Итоги недели: рейтинг и баллы', n7: 'Лыжная база «Красная горка» готова к сезону' };
  var NEWS_D = { n1: '12 Августа', n2: '12 Августа', n3: '8 Августа', n4: '12 Августа', n5: '6 Августа', n6: '5 Августа', n7: '4 Августа' };

  var q = new URLSearchParams(location.search).get('id') || 'c1';
  var club = CLUBS[q] || CLUBS.c1;

  $('cl-top-title').textContent = club.short;
  $('cl-name').textContent = club.name;
  $('cl-sub').textContent = club.sport + ' · ' + club.members + plural(club.members, [' участник', ' участника', ' участников']);
  $('cl-desc').textContent = club.desc;
  document.querySelector('.cl-hero').style.setProperty('--c', club.token);

  var ic = $('cl-ic');
  if (club.img) ic.innerHTML = '<img src="../assets/sports/' + club.img + '" alt="">';
  else ic.innerHTML = '<svg aria-hidden="true"><use href="#ic-' + club.icon + '"></use></svg>';

  var joined = club.joined;
  function renderJoin() {
    var b = $('cl-join');
    b.className = 'btn btn-block ' + (joined ? 'btn-success' : 'btn-accent');
    b.textContent = joined ? 'Вы участник' : 'Вступить';
    var disp = club.members + (joined && !club.joined ? 1 : 0);
    $('cl-sub').textContent = club.sport + ' · ' + disp + plural(disp, [' участник', ' участника', ' участников']);
  }
  $('cl-join').addEventListener('click', function () {
    joined = !joined;
    renderJoin();
    toast(joined ? 'Вы вступили в клуб' : 'Вы вышли из клуба');
  });
  renderJoin();

  $('cl-news-rows').innerHTML = club.news.map(function (id) {
    return '<a class="mrow" href="news.html?id=' + id + '" data-od-id="club-news-' + id + '">' +
      '<span class="mrow-media" style="--c:var(--accent)" aria-hidden="true"><svg><use href="#ic-photo"></use></svg></span>' +
      '<span class="mrow-tx"><span class="mrow-t">' + esc(NEWS_T[id]) + '</span><span class="mrow-s">' + esc(NEWS_D[id]) + '</span></span>' +
      '<span class="mrow-chev"><svg aria-hidden="true"><use href="#ic-chev"></use></svg></span></a>';
  }).join('');

  $('cl-part-rows').innerHTML = club.parts.map(function (id) {
    var per = PEOPLE[id];
    var ava = per.p
      ? '<span class="avatar-sm is-photo" aria-hidden="true"><img src="../assets/avatars/' + per.p + '" alt=""></span>'
      : '<span class="avatar-sm is-tint" style="--c:var(--accent)" aria-hidden="true">' + esc(initials(per.n)) + '</span>';
    return '<a class="mrow" href="profile-view.html?id=' + id + '" data-od-id="club-part-' + id + '">' +
      ava + '<span class="mrow-tx"><span class="mrow-t">' + esc(per.n) + '</span><span class="mrow-s">Участник клуба</span></span>' +
      '<span class="mrow-chev"><svg aria-hidden="true"><use href="#ic-chev"></use></svg></span></a>';
  }).join('');

  var coach = club.coach;
  var coachAva = coach.p
    ? '<span class="avatar-sm is-photo" aria-hidden="true"><img src="../assets/avatars/' + coach.p + '" alt=""></span>'
    : '<span class="avatar-sm is-tint" style="--c:var(--accent)" aria-hidden="true">' + esc(initials(coach.n)) + '</span>';
  $('cl-coach-row').innerHTML =
    '<div class="mrow is-static" data-od-id="club-coach">' +
      coachAva +
      '<span class="mrow-tx"><span class="mrow-t">' + esc(coach.n) + '</span><span class="mrow-s">' + esc(coach.r) + '</span></span>' +
      '<span class="mrow-side"><button class="btn btn-sm btn-ghost" type="button" data-toast="Написать — в следующей итерации" data-od-id="club-write">Написать</button></span>' +
    '</div>';

  $('cl-sched-rows').innerHTML = club.sched.map(function (s, i) {
    return '<a class="mrow" href="07-calendar.html" data-od-id="club-sched-' + i + '">' +
      '<span class="mrow-media" style="--c:var(--type-training)" aria-hidden="true"><svg><use href="#ic-clock"></use></svg></span>' +
      '<span class="mrow-tx"><span class="mrow-t">' + esc(s.t) + '</span><span class="mrow-s">' + esc(s.s) + '</span></span>' +
      '<span class="mrow-chev"><svg aria-hidden="true"><use href="#ic-chev"></use></svg></span></a>';
  }).join('');

  function plural(n, forms) {
    var a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return forms[2];
    if (b > 1 && b < 5) return forms[1];
    if (b === 1) return forms[0];
    return forms[2];
  }

  var toastTimer;
  function toast(tx) {
    $('toast-tx').textContent = tx;
    var row = $('toast').querySelector('.toast');
    row.className = 'toast toast-info';
    $('toast').classList.add('open');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $('toast').classList.remove('open'); }, 2400);
  }

  document.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('[data-toast]') : null;
    if (btn) toast(btn.getAttribute('data-toast'));
  });
</script>
</body>
</html>
