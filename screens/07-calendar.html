<script>
(function () {
  var TYPE = {
    training: 'var(--type-training)',
    event: 'var(--type-event)',
    club: 'var(--type-club)',
    rental: 'var(--type-rental)'
  };
  var STATUS = {
    confirmed: ['Подтв.', 'var(--st-confirmed)'],
    open: ['Запись', 'var(--st-open)'],
    pending: ['Ожид.', 'var(--st-pending)'],
    ongoing: ['Идёт', 'var(--st-ongoing)'],
    done: ['Готово', 'var(--st-done)'],
    cancelled: ['Отменено', 'var(--st-cancelled)']
  };
  var FILTERS = [
    { id: 'all', label: 'Все', token: null },
    { id: 'personal', label: 'Индивидуальные', token: '--type-training' },
    { id: 'group', label: 'Групповые', token: '--type-training' },
    { id: 'coach', label: 'Самостоятельные', token: '--type-training' },
    { id: 'rental', label: 'Аренда', token: '--type-rental' }
  ];
  var state = { filter: 'all', sub: 'all', scope: 'all' };
  var SCOPE = [
    { id: 'all', label: 'Все', hint: 'Все события календаря' },
    { id: 'mine', label: 'Мои', hint: 'Тренировки и события, в которых участвую' },
    { id: 'inv', label: 'Приглашения', hint: 'События, ожидающие вашего решения' }
  ];
  var EVENTS = [
    { d: '2026-08-12', t: '05:40', title: 'Утренняя пробежка', place: 'парк у спорткомплекса', type: 'training', sub: 'personal', fmt: 'личная', st: 'confirmed' },
    { d: '2026-08-12', t: '19:00', title: 'Аренда зала', place: 'Спорткомплекс «СП Петровское»', type: 'rental', sub: 'rental', fmt: 'аренда', st: 'open' },
    { d: '2026-08-13', t: '09:00', title: 'Тренировка с тренером', place: 'тренажёрный зал', type: 'training', sub: 'coach', fmt: 'с тренером', st: 'confirmed' },
    { d: '2026-08-14', t: '10:00', title: 'Турнир по шахматам', place: 'холл спорткомплекса', type: 'event', sub: 'event', fmt: 'турнир', st: 'open' },
    { d: '2026-08-15', t: '09:00', title: 'Клуб любителей бега', place: 'стадион «Труд»', type: 'club', sub: 'club', fmt: 'клуб', st: 'open' },
    { d: '2026-08-16', t: '12:00', title: 'Аренда бассейна', place: 'бассейн спорткомплекса', type: 'rental', sub: 'rental', fmt: 'аренда', st: 'confirmed' },
    { d: '2026-08-18', t: '18:30', title: 'Силовая тренировка', place: 'тренажёрный зал', type: 'training', sub: 'personal', fmt: 'личная', st: 'pending' },
    { d: '2026-08-21', t: '11:00', title: 'Летний Кубок · финал', place: 'стадион «Труд»', type: 'event', sub: 'event', fmt: 'турнир', st: 'open' },
    { d: '2026-08-23', t: '10:00', title: 'Волейбольный турнир', place: 'волейбольная площадка', type: 'event', sub: 'event', fmt: 'турнир', st: 'open' },
    { d: '2026-08-26', t: '18:00', title: 'Клуб настольного тенниса', place: 'клуб тенниса', type: 'club', sub: 'club', fmt: 'клуб', st: 'confirmed' },
    { d: '2026-08-28', t: '16:00', title: 'Аренда корта', place: 'теннисный корт', type: 'rental', sub: 'rental', fmt: 'аренда', st: 'pending' },
    { d: '2026-08-30', t: '08:00', title: 'Осенний полумарафон', place: 'центр поселения', type: 'event', sub: 'event', fmt: 'марафон', st: 'pending', id: 'marathon' }
  ];

  /* Прототип марафона (§4.20): статус карточки приходит из машины состояний
     экрана 15-event-marathon.html (localStorage 'evt:marathon'). Старт забега —
     глобальное событие: авто-флип confirmed → ongoing в момент старта. */
  try {
    var evtRaw = localStorage.getItem('evt:marathon');
    if (evtRaw) {
      var evtState = JSON.parse(evtRaw);
      if (evtState && evtState.status) {
        if (evtState.status === 'confirmed' && Date.now() >= Date.UTC(2026, 7, 30, 8, 0)) {
          evtState.status = 'ongoing';
        }
        EVENTS.forEach(function (e) { if (e.id === 'marathon') e.st = evtState.status; });
      }
    }
  } catch (e) { /* ignore */ }
  var WD = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
  var WD_FULL = ['понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота', 'воскресенье'];
  var MONTH_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  var MONTH_NOM = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];

  var grid = document.getElementById('grid');
  var week = document.getElementById('week');
  var monthEl = document.getElementById('cal-month');
  var dayTitle = document.getElementById('day-title');
  var dayCount = document.getElementById('day-count');
  var dayList = document.getElementById('day-list');

  var today = new Date(2026, 7, 12);
  var view = new Date(today.getFullYear(), today.getMonth(), 1);
  var selected = today.getDate();

  function iso(d, m, y) {
    return y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  }
  function eventsFor(d) {
    var key = iso(d.getDate(), d.getMonth(), d.getFullYear());
    return EVENTS.filter(function (e) {
      if (e.d !== key) return false;
      if (state.filter !== 'all') {
        if (state.filter === 'rental') {
          if (e.type !== 'rental') return false;
        } else {
          if (e.type !== 'training' || e.sub !== state.filter) return false;
        }
      }
      if (state.scope === 'mine' && e.st !== 'confirmed' && e.st !== 'done') return false;
      if (state.scope === 'inv' && e.st !== 'pending') return false;
      return true;
    });
  }
  function mondayIndex(date) { return (date.getDay() + 6) % 7; }

  function renderChips() {
    var box = document.getElementById('type-chips');
    box.innerHTML = '';
    FILTERS.forEach(function (f) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'fchip' + (state.filter === f.id ? ' is-on' : '');
      if (f.token) b.style.setProperty('--c', 'var(' + f.token + ')');
      b.innerHTML = (f.token ? '<span class="dot" aria-hidden="true"></span>' : '') + f.label;
      b.addEventListener('click', function () {
        if (state.filter === f.id) return;
        state.filter = f.id;
        state.sub = 'all';
        renderChips();
        renderGrid();
        renderDay(new Date(view.getFullYear(), view.getMonth(), selected));
      });
      box.appendChild(b);
    });
  }

  function renderScope() {
    var box = document.getElementById('scope-list');
    box.innerHTML = '';
    SCOPE.forEach(function (s) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'sheet-item' + (state.scope === s.id ? ' is-on' : '');
      b.setAttribute('role', 'radio');
      b.setAttribute('aria-checked', state.scope === s.id ? 'true' : 'false');
      b.innerHTML =
        '<span class="sheet-it"><span class="sheet-il">' + s.label + '</span>' +
        '<span class="sheet-ih">' + s.hint + '</span></span>' +
        '<span class="sheet-check"><svg aria-hidden="true"><use href="#ic-check"></use></svg></span>';
      b.addEventListener('click', function () {
        state.scope = s.id;
        document.getElementById('filter-btn').classList.toggle('is-on', state.scope !== 'all');
        renderScope();
        closeFilter();
        renderGrid();
        renderDay(new Date(view.getFullYear(), view.getMonth(), selected));
      });
      box.appendChild(b);
    });
  }

  function renderWeek() {
    week.innerHTML = '';
    WD.forEach(function (w) {
      var el = document.createElement('span');
      el.className = 'cal-wd';
      el.textContent = w;
      week.appendChild(el);
    });
  }

  function renderGrid() {
    var y = view.getFullYear(), m = view.getMonth();
    var first = new Date(y, m, 1);
    var dim = new Date(y, m + 1, 0).getDate();
    var prevDim = new Date(y, m, 0).getDate();
    var lead = mondayIndex(first);
    monthEl.textContent = MONTH_NOM[m] + ' ' + y;
    grid.innerHTML = '';
    var cells = [];

    for (var i = lead - 1; i >= 0; i--) {
      cells.push({ d: prevDim - i, m: m - 1, y: y, other: true });
    }
    for (var d = 1; d <= dim; d++) {
      cells.push({ d: d, m: m, y: y, other: false });
    }
    var tail = cells.length % 7;
    if (tail !== 0) {
      for (var k = 1; k <= 7 - tail; k++) {
        cells.push({ d: k, m: m + 1, y: y, other: true });
      }
    }

    cells.forEach(function (c) {
      var cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'cal-cell';
      if (c.other) cell.classList.add('is-other');
      var isToday = c.d === today.getDate() && c.m === today.getMonth() && c.y === today.getFullYear() && !c.other;
      if (isToday) cell.classList.add('is-today');
      if (c.d === selected && c.m === view.getMonth() && c.y === view.getFullYear() && !c.other) cell.classList.add('is-sel');
      cell.setAttribute('aria-label', String(c.d));

      var num = document.createElement('span');
      num.className = 'cal-num';
      num.textContent = c.d;
      cell.appendChild(num);

      var events = eventsFor(new Date(c.y, c.m, c.d));
      if (events.length) {
        var dots = document.createElement('span');
        dots.className = 'cal-dots';
        var shown = Math.min(events.length, 4);
        for (var j = 0; j < shown; j++) {
          var dot = document.createElement('span');
          dot.className = 'cal-dot';
          dot.style.setProperty('--c', TYPE[events[j].type] || 'var(--meta)');
          dots.appendChild(dot);
        }
        cell.appendChild(dots);
      }
      cell.addEventListener('click', function () {
        selected = c.d;
        renderGrid();
        renderDay(new Date(c.y, c.m, c.d));
      });
      grid.appendChild(cell);
    });
  }

  function evLabel(date) {
    var t = today;
    if (date.getDate() === t.getDate() && date.getMonth() === t.getMonth() && date.getFullYear() === t.getFullYear()) return 'Сегодня';
    var tm = new Date(t.getFullYear(), t.getMonth(), t.getDate() + 1);
    if (date.getDate() === tm.getDate() && date.getMonth() === tm.getMonth() && date.getFullYear() === tm.getFullYear()) return 'Завтра';
    return WD[mondayIndex(date)];
  }

  function renderDay(date) {
    var events = eventsFor(date);
    dayTitle.textContent = WD_FULL[mondayIndex(date)][0].toUpperCase() + WD_FULL[mondayIndex(date)].slice(1) + ', ' + date.getDate() + ' ' + MONTH_GEN[date.getMonth()];
    dayCount.textContent = events.length;
    dayList.innerHTML = '';
    if (!events.length) {
      var empty = document.createElement('div');
      empty.className = 'day-empty';
      empty.innerHTML = '<svg aria-hidden="true"><use href="#ic-events"></use></svg><div>В этот день пока ничего нет</div>';
      dayList.appendChild(empty);
      return;
    }
    events.forEach(function (e) {
      var card = document.createElement('article');
      card.className = 'ev-card';
      card.style.setProperty('--c', TYPE[e.type]);
      var st = STATUS[e.st] || STATUS.done;
      var stCls = e.st === 'pending' ? ' is-pending' : '';
      card.innerHTML =
        '<div class="ev-when"><span class="ev-day"></span><span class="ev-time"></span></div>' +
        '<div class="ev-body"><h3 class="ev-title"></h3><div class="ev-place"></div></div>' +
        '<span class="ev-status' + stCls + '" style="--c:' + st[1] + '"></span>' +
        '<button class="ev-menu" type="button" aria-label="Ещё"><svg aria-hidden="true"><use href="#ic-dots"></use></svg></button>';
      card.querySelector('.ev-day').textContent = evLabel(date);
      card.querySelector('.ev-time').textContent = e.t;
      card.querySelector('.ev-title').textContent = e.title;
      var fmtEl = document.createElement('span');
      fmtEl.className = 'ev-fmt';
      fmtEl.textContent = e.fmt;
      card.querySelector('.ev-title').appendChild(fmtEl);
      card.querySelector('.ev-place').textContent = e.place;
      card.querySelector('.ev-status').textContent = st[0];
      if (e.id === 'marathon') {
        card.classList.add('is-link');
        var go = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        go.setAttribute('class', 'ev-go');
        go.setAttribute('aria-hidden', 'true');
        var use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
        use.setAttribute('href', '#ic-chev');
        go.appendChild(use);
        card.querySelector('.ev-body').appendChild(go);
        card.addEventListener('click', function (ev2) {
          if (ev2.target.closest('.ev-menu')) return;
          location.href = '15-event-marathon.html';
        });
      }
      dayList.appendChild(card);
    });
  }

  document.getElementById('prev').addEventListener('click', function () {
    view = new Date(view.getFullYear(), view.getMonth() - 1, 1);
    renderGrid();
  });
  document.getElementById('next').addEventListener('click', function () {
    view = new Date(view.getFullYear(), view.getMonth() + 1, 1);
    renderGrid();
  });

  renderWeek();
  renderChips();
  renderGrid();
  renderDay(new Date(view.getFullYear(), view.getMonth(), selected));

  var scrim = document.getElementById('menu-scrim');
  var sheet = document.getElementById('menu-sheet');
  function openMenu() { scrim.classList.add('open'); sheet.classList.add('open'); }
  function closeMenu() { scrim.classList.remove('open'); sheet.classList.remove('open'); }
  if (scrim && sheet) {
    document.addEventListener('click', function (e) {
      var btn = e.target.closest('.ev-card .ev-menu');
      if (btn) openMenu();
    });
    scrim.addEventListener('click', closeMenu);
    document.querySelectorAll('.js-sheet-close').forEach(function (btn) {
      btn.addEventListener('click', closeMenu);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeMenu();
    });
  }

  var fScrim = document.getElementById('filter-scrim');
  var fSheet = document.getElementById('filter-sheet');
  function openFilter() { fScrim.classList.add('open'); fSheet.classList.add('open'); }
  function closeFilter() { fScrim.classList.remove('open'); fSheet.classList.remove('open'); }
  if (fScrim && fSheet) {
    document.getElementById('filter-btn').addEventListener('click', function () {
      renderScope();
      openFilter();
    });
    fScrim.addEventListener('click', closeFilter);
    document.querySelectorAll('.js-filter-close').forEach(function (btn) {
      btn.addEventListener('click', closeFilter);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeFilter();
    });
  }
})();
</script>

</body>
</html>
